/* ============================================================
   BASE + COQUILLE D'APPLI
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-round);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ---------- barre du haut ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--ground) 82%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar .logo { font-size: 22px; }
.topbar .name {
  flex: 1;
  font-weight: 800;
  font-size: 17px;
  letter-spacing: -.01em;
}

    tip:"U-505 On-Board (~16 €) à acheter en ligne LE MATIN MÊME — les créneaux partent dans la journée.",
    items:[
      { h:"Journée", c:"musee", t:"Griffin Museum of Science and Industry", n:"Priorités : 1. Anne Frank · 2. U-505 · 3. Coal Mine · 4. Powering the Future · 5. Science Storms · 6. Great Train Story · 7. Boeing 727.", pass:"5/5" },
      { h:"17h",     c:"air",   t:"Promontory Point (si énergie)", n:"20 min par Hyde Park. La meilleure vue de la skyline, et jamais personne. Retour bus 6 ou Metra.", pr:"Gratuit" }
    ]},
  { d:14, date:"2026-09-11", dow:"Ven", lab:"11 sept", e:"🎡", p:3, title:"Navy Pier + départ",
    tip:"✈️ Vol à 16 h 15. La Blue Line s'arrête sans prévenir : grosse marge, pas une marge raisonnable.",
    items:[
      { h:"9h",    c:"air",    t:"Navy Pier", n:"Promenade, lac, skyline. Centennial Wheel seulement si le timing est bon.", pr:"Gratuit" },
      { h:"11h30", c:"trajet", t:"Quitter le Pier — sans discuter", n:"Bus 124 ou 20 min à pied vers Grand (Red Line).", w:1 },
      { h:"13h30", c:"trajet", t:"Bagages → O'Hare", n:"Blue Line 45 min. Être à l'aéroport vers 13 h 30." },
      { h:"16h15", c:"trajet", t:"✈️ Vol retour" }
    ]}
];

var PASS = [
  { n:"1/5", e:"🚢", t:"Architecture River Tour", d:"Jeu 3 sept · 16 h" },
  { n:"2/5", e:"🌇", t:"360 CHICAGO", d:"Ven 4 sept · sunset" },
  { n:"3/5", e:"🌃", t:"Skydeck Chicago", d:"Mar 8 sept · nuit" },
  { n:"4/5", e:"🐠", t:"Shedd Aquarium", d:"Mer 9 sept · 9 h" },
  { n:"5/5", e:"🔬", t:"Griffin MSI", d:"Jeu 10 sept · journée" }
];

var PREP = [
  { e:"🚗", t:"Régler Memphis ↔ Oxford", n:"Navette réservée, location ou cousin — décidé avant le départ." },
  { e:"🏨", t:"Réserver l'hôtel du 8 → 11 sept", n:"≤ 330 € pour tenir la cible des 3 500 €." },
  { e:"🚢", t:"Réserver les créneaux CityPASS", n:"River Tour (3), 360 sunset (4), Skydeck (8), Shedd 9 h (9)." },
  { e:"🕵️", t:"Réserver le Crime Tour du 8", n:"~40 €, en ligne." },
  { e:"⚾", t:"Confirmer l'heure de Cubs–Brewers", n:"Sur mlb.com — un match en journée décale tout le 2 sept." },
  { e:"🎈", t:"Vérifier le Balloon Museum", n:"Expo itinérante : bien à Chicago le 1er sept ?" },
  { e:"🛂", t:"Passeport dans le sac du 2 sept", n:"Obligatoire au Money Museum, version physique." },
  { e:"💵", t:"Prévoir du liquide", n:"Green Mill (13–17 €) et la plupart des clubs." }
];

var BUDGET = {
  paid: [
    ["Vol international A/R", 735],
    ["Vols Chicago ↔ Memphis", 314],
    ["Visa", 35],
    ["Kaplan + hébergement", 1011],
    ["CityPASS", 124]
  ],
  toPay: [
    ["Hôtel 8 → 11 sept", "300 – 600 €", 450, "b1"],
    ["Activités hors pass", "~304 €", 304, "b2"],
    ["Nourriture", "~350 €", 350, "b3"],
    ["Transports", "~300 €", 300, "b4"]
  ]
};

/* ============================================================
   ÉTAT
   ============================================================ */
var store = {
  get: function (k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
var done = store.get("chi26:done", {});
var prepDone = store.get("chi26:prep", {});
var passUsed = store.get("chi26:pass", {});
var totalItems = DAYS.reduce(function (a, d) { return a + d.items.length; }, 0);

function todayChicago() {
  var p = new Intl.DateTimeFormat("fr-CA", { timeZone: "America/Chicago" }).format(new Date());
  return p; /* AAAA-MM-JJ */
}

/* ============================================================
   THÈME
   ============================================================ */
var root = document.documentElement;
var savedTheme = null;
try { savedTheme = localStorage.getItem("chi26:theme"); } catch (e) {}
if (savedTheme) root.setAttribute("data-theme", savedTheme);
document.getElementById("themeBtn").addEventListener("click", function () {
  var cur = root.getAttribute("data-theme") ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var next = cur === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("chi26:theme", next); } catch (e) {}
});

/* ============================================================
   RENDU
   ============================================================ */
function esc(s) { return String(s == null ? "" : s); }

function priceHtml(it) {
  if (it.pass) return '<span class="price pass">🎫 ' + it.pass + "</span>";
  if (!it.pr) return "";
  var cls = /Gratuit|Donation/.test(it.pr) ? "price free" : "price";
  return '<span class="' + cls + '">' + esc(it.pr) + "</span>";
}

function itemHtml(day, idx) {
  var it = day.items[idx];
  var uid = "d" + day.d + "-" + idx;
  var checked = done[uid] ? " checked" : "";
  var doneCls = done[uid] ? " done" : "";
  return '<label class="item' + doneCls + '" style="--cat: var(--c-' + it.c + ')" data-uid="' + uid + '">' +
    '<input type="checkbox" class="chk" data-uid="' + uid + '" data-day="' + day.d + '"' + checked +
    ' aria-label="Fait : ' + esc(it.t).replace(/"/g, "&quot;") + '">' +
    '<span class="body"><span class="h">' + esc(it.h) + "</span><br>" +
    '<span class="t">' + esc(it.t) + "</span>" +
    (it.n ? '<div class="n' + (it.w ? " warn" : "") + '">' + esc(it.n) + "</div>" : "") +
    "</span>" + priceHtml(it) + "</label>";
}

function dayDoneCount(day) {
  var n = 0;
  day.items.forEach(function (_, i) { if (done["d" + day.d + "-" + i]) n++; });
  return n;
}

function dayCardHtml(day, kicker) {
  var dn = dayDoneCount(day);
  var html = '<div class="dayhero" data-p="' + day.p + '">' +
    '<span class="big-emoji">' + day.e + "</span>" +
    '<div class="kicker">' + esc(kicker || ("Jour " + day.d + " / 14 · " + day.dow + " " + day.lab)) + "</div>" +
    "<h3>" + day.e + " " + esc(day.title) + "</h3>" +
    '<div class="sub">' + ["", "Chicago · semaine Kaplan", "Mississippi · Ole Miss", "Chicago · mode touriste"][day.p] + "</div>" +
    '<span class="done-pill">' + dn + " / " + day.items.length + " coché" + (dn > 1 ? "s" : "") + "</span>" +
    "</div>";
  if (day.tip) html += '<div class="tipcard">💡 ' + esc(day.tip) + "</div>";
  day.items.forEach(function (_, i) { html += itemHtml(day, i); });
  return html;
}

/* ---------- écran Jours ---------- */
var curDay = 1;
function renderPlan() {
  var scr = document.getElementById("scr-plan");
  var picks = DAYS.map(function (day) {
    var all = dayDoneCount(day) === day.items.length;
    return '<button class="dp' + (day.d === curDay ? " on" : "") + (all ? " alldone" : "") +
      '" data-p="' + day.p + '" data-d="' + day.d + '" type="button">' +
      '<span class="e">' + day.e + '</span><span class="n">' + day.d + '</span>' +
      '<span class="d">' + day.dow + "</span></button>";
  }).join("");
  var day = DAYS[curDay - 1];
  scr.innerHTML = '<h2 class="screen-title"><span>📅</span>Jour par jour</h2>' +
    '<div class="daypick" id="daypick">' + picks + "</div>" + dayCardHtml(day);
  scr.querySelectorAll(".dp").forEach(function (b) {
    b.addEventListener("click", function () {
      curDay = +b.dataset.d;
      renderPlan();
    });
  });
  bindChecks(scr);
}

/* ---------- écran Aujourd'hui ---------- */
function renderHome() {
  var scr = document.getElementById("scr-home");
  var t = todayChicago();
  var start = "2026-08-29", end = "2026-09-11";
  var html = "";
  if (t < start) {
    var days = Math.round((new Date(start) - new Date(t)) / 864e5);
    var prepLeft = PREP.filter(function (_, i) { return !prepDone["p" + i]; }).length;
    html += '<div class="hero-count"><span class="skyline">🏙️</span>' +
      '<div class="jminus">J−' + days + "</div>" +
      '<div class="lbl">avant l\'embarquement · 14 jours · 3 villes · 5 CityPASS</div></div>';
    html += '<div class="card"><h3>✅ À régler avant de partir' +
      (prepLeft ? " · " + prepLeft + " restant" + (prepLeft > 1 ? "s" : "") : " · tout est prêt 🎉") + "</h3>";
    PREP.forEach(function (p, i) {
      var uid = "p" + i;
      html += '<label class="item' + (prepDone[uid] ? " done" : "") + '" style="--cat: var(--c-cours)">' +
        '<input type="checkbox" class="chk" data-prep="' + uid + '"' + (prepDone[uid] ? " checked" : "") +
        ' aria-label="' + esc(p.t).replace(/"/g, "&quot;") + '">' +
        '<span class="body"><span class="t">' + p.e + " " + esc(p.t) + '</span><div class="n">' + esc(p.n) + "</div></span></label>";
    });
    html += "</div>";
    html += '<div class="tipcard">👉 Le jour J, cet écran affichera automatiquement le programme du jour, en heure de Chicago.</div>';
  } else if (t > end) {
    var checked = Object.keys(done).length;
    html += '<div class="hero-count"><span class="skyline">🌆</span>' +
      '<div class="jminus">Fini ✔</div>' +
      '<div class="lbl">' + checked + " / " + totalItems + " activités cochées. Beau voyage.</div></div>";
    html += '<div class="tipcard">Revois le détail dans l\'onglet 📅 Jours.</div>';
  } else {
    var day = DAYS.find(function (d) { return d.date === t; }) || DAYS[0];
    html += dayCardHtml(day, "Aujourd'hui · " + day.dow + " " + day.lab);
    var nxt = DAYS[day.d] ;
    if (nxt) {
      html += '<div class="tipcard">🔜 <b>Demain :</b> ' + nxt.e + " " + esc(nxt.title) +
        (nxt.tip ? " — " + esc(nxt.tip) : "") + "</div>";
    }
  }
  scr.innerHTML = html;
  bindChecks(scr);
  scr.querySelectorAll("[data-prep]").forEach(function (box) {
    box.addEventListener("change", function () {
      prepDone[box.dataset.prep] = box.checked ? 1 : undefined;
      if (!box.checked) delete prepDone[box.dataset.prep];
      store.set("chi26:prep", prepDone);
      renderHome();
    });
  });
}

/* ---------- écran Pass ---------- */
function renderPass() {
  var scr = document.getElementById("scr-pass");
  var used = PASS.filter(function (_, i) { return passUsed["s" + i]; }).length;
  var html = '<h2 class="screen-title"><span>🎫</span>CityPASS</h2>' +
    '<div class="card"><h3>' + used + " / 5 utilisées · 124 € déjà payés</h3>" +
    "<p>Activé le <b>jeudi 3 septembre</b> (River Tour) → 9 jours consécutifs → dernier jour le <b>vendredi 11 inclus</b>. Tout le programme rentre.</p>" +
    "<p>À l'unité, les cinq coûteraient ~220 €.</p></div>";
  PASS.forEach(function (s, i) {
    var uid = "s" + i;
    html += '<div class="pass-slot' + (passUsed[uid] ? " used" : "") + '">' +
      '<span class="num">' + s.e + "</span>" +
      '<span><span class="t">' + esc(s.t) + '</span><br><span class="d">' + s.n + " · " + esc(s.d) + "</span></span>" +
      '<button class="stamp-btn" data-pass="' + uid + '" type="button">' + (passUsed[uid] ? "Utilisé ✓" : "Tamponner") + "</button></div>";
  });
  html += '<div class="tipcard">💡 Field, Adler et Art Institute sont payés à part <b>exprès</b> : dans les couples de choix du pass, ils sont les alternatives de Griffin, de la croisière et du 360. Vouloir les six impose d\'en payer trois hors pass.</div>';
  scr.innerHTML = html;
  scr.querySelectorAll("[data-pass]").forEach(function (b) {
    b.addEventListener("click", function () {
      var uid = b.dataset.pass;
      if (passUsed[uid]) delete passUsed[uid]; else { passUsed[uid] = 1; burst(["🎫", "✨", "🌆"]); }
      store.set("chi26:pass", passUsed);
      renderPass();
    });
  });
}

/* ---------- écran Budget ---------- */
function renderBudget() {
  var scr = document.getElementById("scr-budget");
  var paidTotal = BUDGET.paid.reduce(function (a, r) { return a + r[1]; }, 0);
  var segs = [["Déjà payé", paidTotal, "var(--b-paid)"]].concat(
    BUDGET.toPay.map(function (r) { return [r[0], r[2], "var(--" + r[3].replace("b", "b-") + ")"]; })
  );
  var grand = segs.reduce(function (a, s) { return a + s[1]; }, 0);
  var bar = segs.map(function (s) {
    return '<span style="width:' + (s[1] / grand * 100).toFixed(1) + "%; background:" + s[2] + '" title="' + esc(s[0]) + '"></span>';
  }).join("");

  var html = '<h2 class="screen-title"><span>💰</span>Budget</h2>' +
    '<div class="card money-hero">' +
    '<div class="lbl">TOTAL ESTIMÉ DU VOYAGE</div>' +
    '<div class="total">3 473 – 3 773 €</div>' +
    '<div class="lbl">cible : ~3 500 € hors shopping</div>' +
    '<div class="stackbar" role="img" aria-label="Répartition du budget">' + bar + "</div>" +
    '<ul class="blegend">' +
    '<li class="head"><span class="dot" style="background:var(--b-paid)"></span><span class="lab">Déjà payé</span><span class="val">2 219 €</span></li>' +
    BUDGET.toPay.map(function (r) {
      return '<li><span class="dot" style="background:var(--' + r[3].replace("b", "b-") + ')"></span><span class="lab">' + esc(r[0]) + '</span><span class="val">' + esc(r[1]) + "</span></li>";
    }).join("") +
    "</ul></div>";

  html += '<div class="card"><h3>✔ Déjà payé — 2 219 €</h3><ul class="blegend">' +
    BUDGET.paid.map(function (r) {
      return '<li><span class="dot" style="background:var(--b-paid)"></span><span class="lab">' + esc(r[0]) + '</span><span class="val">' + r[1].toLocaleString("fr-FR") + " €</span></li>";
    }).join("") + "</ul></div>";

  html += '<div class="tipcard">⚠️ <b>Le seul poste qui peut faire déraper : l\'hôtel.</b> À 300 € les 3 nuits, le total tombe à 3 473 € — la cible tient. À 600 €, on est à 3 773 €. Viser ≤ 330 €.</div>';
  html += '<div class="tipcard">🚗 L\'Uber Memphis ↔ Oxford (180–230 € A/R) mange les deux tiers des 300 € de transport. Une navette ou une location peut libérer 50–100 €.</div>';
  scr.innerHTML = html;
}

/* ---------- écran Infos ---------- */
function renderInfos() {
  var scr = document.getElementById("scr-infos");
  scr.innerHTML = '<h2 class="screen-title"><span>ℹ️</span>Infos pratiques</h2>' +

    '<div class="card"><h3>📲 Installer l\'appli sur ton téléphone</h3>' +
    "<p><b>iPhone (Safari)</b> : ouvre cette page → bouton Partager <b>⬆️</b> → « <b>Sur l'écran d'accueil</b> ». L'icône skyline apparaît et la page s'ouvre en plein écran, comme une appli.</p>" +
    "<p><b>Android (Chrome)</b> : menu <b>⋮</b> → « <b>Ajouter à l'écran d'accueil</b> ».</p>" +
    "<p>Tes coches et le thème restent enregistrés sur l'appareil — pas besoin de connexion pour les garder.</p></div>" +

    '<div class="card"><h3>🚇 Se déplacer</h3><ul>' +
    "<li><b>Carte Ventra</b> : 5 $ (rendus en crédit), 2,50 $ le trajet en « L ».</li>" +
    "<li><b>Pass 7 jours : 20 $</b> — rentable dès 3 trajets/jour. Deux pass couvrent tes deux séjours.</li>" +
    "<li><b>O'Hare ↔ centre</b> : Blue Line, 5 $, 45 min, 24 h/24.</li>" +
    "<li>La ville est un damier : State × Madison = le point zéro. Impossible de se perdre.</li></ul></div>" +

    '<div class="card"><h3>🎒 À ne pas oublier</h3><ul>' +
    "<li><b>Passeport physique</b> — exigé au Money Museum (2 sept).</li>" +
    "<li><b>Liquide</b> — Green Mill et la plupart des clubs.</li>" +
    "<li><b>Coupe-vent</b>, pas de parapluie (le vent le retourne — d'où le surnom de la ville).</li>" +
    "<li><b>Vraies chaussures</b> : 12–18 km de marche par jour.</li>" +
    "<li>Pourboires : 18–20 % au resto, 1–2 $ par verre au bar.</li></ul></div>" +

    '<div class="card"><h3>⚠️ Les trois pièges du voyage</h3><ul>' +
    "<li><b>Memphis ↔ Oxford</b> : 135 km sans course retour → annulations Uber fréquentes. Se règle avant le départ.</li>" +
    "<li><b>Mardi 8</b> : toute la journée dépend du vol. En cas de retard, sacrifier le Crime Tour, jamais le Skydeck.</li>" +
    "<li><b>Vendredi 11</b> : quitter Navy Pier à 11 h 30 max — vol à 16 h 15 et le Pier est mal desservi.</li></ul></div>" +

    '<div class="card"><h3>🎁 En bonus si le temps le permet</h3><ul>' +
    "<li><b>Water Taxi → Chinatown</b> (~9 €/trajet) : le 31 août ou le 9 sept. Vérifier le calendrier de la ligne.</li>" +
    "<li><b>Plages</b> : Oak Street ou North Avenue Beach, sur le Lakefront Trail. Gratuit, lac baignable jusqu'à mi-septembre.</li>" +
    "<li><b>Jazz Fest</b> (3–6 sept, gratuit) : tes soirées du 3 et du 4 sont les seules attrapables.</li></ul></div>";
}

/* ============================================================
   INTERACTIONS COMMUNES
   ============================================================ */
function refreshRing() {
  var n = 0;
  DAYS.forEach(function (day) { n += dayDoneCount(day); });
  var pct = Math.round(n / totalItems * 100);
  document.getElementById("ringFg").style.strokeDashoffset = (100.5 * (1 - n / totalItems)).toFixed(1);
  document.getElementById("ringTxt").textContent = pct + "%";
}

function burst(emojis) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var box = document.getElementById("confettiBox");
  for (var i = 0; i < 14; i++) {
    var s = document.createElement("span");
    s.className = "confetti";
    s.textContent = emojis[i % emojis.length];
    s.style.left = (5 + Math.random() * 90) + "%";
    s.style.animationDelay = (Math.random() * .35) + "s";
    s.style.fontSize = (16 + Math.random() * 14) + "px";
    box.appendChild(s);
    setTimeout(function (el) { return function () { el.remove(); }; }(s), 2200);
  }
}

function bindChecks(scope) {
  scope.querySelectorAll(".chk[data-uid]").forEach(function (box) {
    box.addEventListener("change", function () {
      var uid = box.dataset.uid;
      if (box.checked) done[uid] = 1; else delete done[uid];
      store.set("chi26:done", done);
      box.closest(".item").classList.toggle("done", box.checked);
      refreshRing();
      var day = DAYS[+box.dataset.day - 1];
      if (box.checked && dayDoneCount(day) === day.items.length) {
        burst([day.e, "🎉", "⭐", "🎊"]);
      }
      var pill = scope.querySelector(".done-pill");
      if (pill && day.d === curDay || (pill && scope.id === "scr-home")) {
        var dn = dayDoneCount(day);
        pill.textContent = dn + " / " + day.items.length + " coché" + (dn > 1 ? "s" : "");
      }
    });
  });
}

/* ---------- onglets ---------- */
var renderers = { home: renderHome, plan: renderPlan, pass: renderPass, budget: renderBudget, infos: renderInfos };
document.querySelectorAll(".tab").forEach(function (tab) {
  tab.addEventListener("click", function () {
    document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("on", t === tab); });
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("on"); });
    var id = tab.dataset.scr;
    document.getElementById("scr-" + id).classList.add("on");
    renderers[id]();
    window.scrollTo({ top: 0 });
  });
});

/* ---------- démarrage ---------- */
var t0 = todayChicago();
var d0 = DAYS.find(function (d) { return d.date === t0; });
if (d0) curDay = d0.d;
renderHome();
renderPlan();
renderPass();
renderBudget();
renderInfos();
refreshRing();
})();
</script>
