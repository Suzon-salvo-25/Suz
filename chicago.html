  --c-archi:  #3fc1b5;
  --c-air:    #57c57b;
  --c-soir:   #ef7fb1;
  --c-sport:  #f0924e;
  --c-campus: #d46bdd;

  --b-paid: #8b94a6;
  --b-1: #3987e5;
  --b-2: #d95926;
  --b-3: #199e70;
  --b-4: #c98500;

  --gold: #e3c06b;

  --ok:   #4ade80;
  --warn: #fbbf24;
}

/* ============================================================
   BASE + COQUILLE D'APPLI
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--ground);
  background-image:
    radial-gradient(900px 420px at 20% -8%, color-mix(in srgb, var(--g1a) 9%, transparent), transparent 70%),
    radial-gradient(700px 360px at 95% 4%, color-mix(in srgb, var(--g3a) 7%, transparent), transparent 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--f-round);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ---------- barre du haut ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--ground) 82%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar .logo { font-size: 22px; }
.topbar .name {
  flex: 1;
  font-family: var(--f-disp);
  font-weight: 800;
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: .07em;
}
.topbar .name small {
  display: block;
  font-weight: 600;
  font-size: 11px;
  color: var(--ink-faint);
}
.ring { width: 40px; height: 40px; flex: 0 0 auto; }
.ring circle { fill: none; stroke-width: 4; }
.ring .bg { stroke: var(--line); }
.ring .fg {
  stroke: url(#ringGrad);
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: center;
  transition: stroke-dashoffset .5s ease;
}
.ring text {
  font-family: var(--f-round);
  font-size: 11px;
  font-weight: 800;
  fill: var(--ink);
  text-anchor: middle;
  dominant-baseline: central;
}
.theme-toggle {
  border: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 36px; height: 36px;
  font-size: 16px;
  cursor: pointer;
  display: grid;
  place-items: center;
}

/* ---------- contenu défilant ---------- */
main {
  flex: 1;
  padding: 16px 16px calc(104px + env(safe-area-inset-bottom));
}
.screen { display: none; }
.screen.on { display: block; animation: pop .22s ease; }
@keyframes pop {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

/* ---------- nav du bas ---------- */
.tabbar {
  position: fixed;
  bottom: calc(10px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: min(100% - 20px, 540px);
  z-index: 30;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 7px 6px;
  border-radius: 26px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow), 0 18px 44px -18px rgba(9, 11, 30, .45);
}
.tabbar::-webkit-scrollbar { display: none; }
.tab {
  border: 0;
  background: none;
  font-family: var(--f-round);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border-radius: var(--r-sm);
  color: var(--ink-faint);
  font-size: 9.5px;
  font-weight: 700;
  cursor: pointer;
  flex: 1 0 auto;
  min-width: 46px;
}
.tab { transition: background .15s ease; }
.tab .ico { font-size: 20px; line-height: 1; filter: grayscale(1) opacity(.55); transition: filter .15s, transform .15s; }
.tab.on {
  color: var(--ink);
  background: var(--panel-2);
  box-shadow: inset 0 0 0 1px var(--line);
}
.tab.on .ico { filter: none; transform: scale(1.12); }

/* ============================================================
   COMPOSANTS
   ============================================================ */
h2.screen-title {
  font-family: var(--f-disp);
  font-size: 28px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin: 4px 0 16px;
}
h2.screen-title span { font-size: 22px; margin-right: 7px; }
h2.screen-title::after {
  content: "";
  display: block;
  width: 52px;
  height: 3.5px;
  border-radius: 2px;
  margin-top: 7px;
  background: linear-gradient(90deg, var(--gold), transparent);
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 14px;
}
.card h3 {
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 800;
}
.card p { margin: 0 0 8px; font-size: 14px; color: var(--ink-soft); }
.card p:last-child { margin-bottom: 0; }
.card ul { margin: 0; padding-left: 18px; }
.card li { font-size: 14px; color: var(--ink-soft); margin-bottom: 7px; }
.card li b { color: var(--ink); }
.card li:last-child { margin-bottom: 0; }

/* ---------- en-tête de jour (dégradé) ---------- */
.dayhero {
  border-radius: var(--r-lg);
  padding: 18px;
  color: var(--on-grad);
  box-shadow: var(--shadow);
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}
.dayhero[data-p="1"] { background: linear-gradient(135deg, var(--g1a), var(--g1b)); }
.dayhero[data-p="2"] { background: linear-gradient(135deg, var(--g2a), var(--g2b)); }
.dayhero[data-p="3"] { background: linear-gradient(135deg, var(--g3a), var(--g3b)); }
.dayhero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(440px 190px at 88% -25%, rgba(255,255,255,.30), transparent 70%);
  pointer-events: none;
}
.dayhero::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 44px;
  background: var(--skyline) bottom / 100% 100% no-repeat;
  pointer-events: none;
}
.dayhero .big-emoji {
  position: absolute;
  right: -2px; bottom: 2px;
  font-size: 78px;
  opacity: .30;
  transform: rotate(-8deg);
  z-index: 1;
}
.dayhero > *:not(.big-emoji) { position: relative; z-index: 1; }
.dayhero .kicker {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .14em;
  opacity: .85;
}
.dayhero h3 {
  margin: 3px 0 2px;
  font-family: var(--f-disp);
  font-size: 27px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .03em;
}
.dayhero .sub { font-size: 13px; opacity: .9; font-weight: 600; }
.dayhero .done-pill {
  display: inline-block;
  margin-top: 10px;
  font-size: 12px;
  font-weight: 800;
  background: rgba(255,255,255,.22);
  border-radius: 999px;
  padding: 4px 12px;
}

/* ---------- filtres + vue globale ---------- */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 12px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--f-round);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
  background: var(--panel);
  border: 1.5px solid var(--line);
  padding: 6px 11px 6px 9px;
  border-radius: 999px;
  cursor: pointer;
}
.chip::before {
  content: "";
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--dot, var(--ink-faint));
  flex: 0 0 auto;
}
.chip.reset::before { display: none; }
.chip[aria-pressed="true"] {
  border-color: var(--dot, var(--ink));
  background: color-mix(in srgb, var(--dot, var(--ink)) 14%, var(--panel));
  color: var(--ink);
  box-shadow: 0 3px 10px -4px var(--dot, var(--ink));
}
.seg {
  display: flex;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  margin-bottom: 12px;
  width: fit-content;
}
.seg button {
  border: 0;
  background: none;
  font-family: var(--f-round);
  font-weight: 800;
  font-size: 12.5px;
  padding: 7px 16px;
  border-radius: 999px;
  color: var(--ink-faint);
  cursor: pointer;
}
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.mini-day {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 20px 2px 10px;
}
.mini-day .me { font-size: 18px; }
.mini-day .n { font-weight: 900; font-size: 15px; white-space: nowrap; }
.mini-day .d { font-size: 12px; color: var(--ink-faint); font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-day::after { content: ""; flex: 1; height: 2.5px; border-radius: 2px; background: var(--pc, var(--line)); opacity: .45; min-width: 14px; }

/* ---------- sélecteur de jours ---------- */
.daypick {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 12px;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.daypick::-webkit-scrollbar { display: none; }
.dp {
  flex: 0 0 auto;
  scroll-snap-align: center;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 14px;
  padding: 8px 10px 7px;
  min-width: 54px;
  text-align: center;
  cursor: pointer;
  font-family: var(--f-round);
  color: var(--ink);
}
.dp .e { font-size: 18px; display: block; }
.dp .n { font-size: 14px; font-weight: 900; display: block; margin-top: 1px; }
.dp .d { font-size: 9.5px; font-weight: 700; color: var(--ink-faint); display: block; }
.dp { transition: transform .12s ease, border-color .12s ease; }
.dp:active { transform: scale(.94); }
.dp.on { border-width: 2px; box-shadow: var(--shadow); }
.dp.on[data-p="1"] { border-color: var(--g1a); background: color-mix(in srgb, var(--g1a) 12%, var(--panel)); }
.dp.on[data-p="2"] { border-color: var(--g2b); background: color-mix(in srgb, var(--g2b) 12%, var(--panel)); }
.dp.on[data-p="3"] { border-color: var(--g3a); background: color-mix(in srgb, var(--g3a) 12%, var(--panel)); }
.dp.alldone .e::after { content: " ✅"; font-size: 11px; }

/* ---------- items ---------- */
.item {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  gap: 4px 10px;
  align-items: start;
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 5px solid var(--cat, var(--line));
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
  padding: 12px 12px 12px 10px;
  margin-bottom: 10px;
}
.item .chk {
  width: 26px; height: 26px;
  margin-top: 1px;
  appearance: none;
  -webkit-appearance: none;
  border: 2.5px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: border-color .15s, background .15s, transform .1s;
}
.item .chk:active { transform: scale(.88); }
.item .chk:checked {
  background: var(--c-air);
  border-color: var(--c-air);
  animation: popchk .28s ease;
}
@keyframes popchk {
  0% { transform: scale(.8); }
  45% { transform: scale(1.22); }
  100% { transform: scale(1); }
}
.item .chk:checked::after {
  content: "✓";
  color: #fff;
  font-size: 15px;
  font-weight: 900;
}
.item .body { min-width: 0; }
.item .h {
  font-family: var(--f-data);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-faint);
  letter-spacing: .02em;
}
.item .t { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.item .n { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.item .n.warn { color: var(--warn); font-weight: 600; }
.item.done { opacity: .5; }
.item.done .t { text-decoration: line-through; }
.price {
  font-family: var(--f-data);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--ink-soft);
  white-space: nowrap;
  align-self: start;
}
.price.free { background: color-mix(in srgb, var(--c-air) 16%, var(--panel)); color: var(--ok); }
.price.pass { background: color-mix(in srgb, var(--c-musee) 16%, var(--panel)); color: var(--c-musee); }

.lnk {
  display: inline-block;
  margin-top: 7px;
  font-size: 12px;
  font-weight: 800;
  color: var(--c-musee);
  text-decoration: none;
  border: 1.5px solid color-mix(in srgb, var(--c-musee) 40%, var(--line));
  border-radius: 999px;
  padding: 4px 11px;
  background: color-mix(in srgb, var(--c-musee) 10%, var(--panel));
}
.lnk:active { transform: scale(.97); }

/* ---------- édition d'activités ---------- */
.item { position: relative; }
.iedit {
  position: absolute;
  right: 10px; bottom: 8px;
  border: 0;
  background: var(--panel-2);
  color: var(--ink-faint);
  width: 27px; height: 27px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 13px;
  display: grid;
  place-items: center;
}
.modif {
  font-size: 10px;
  font-weight: 800;
  color: var(--c-musee);
  background: color-mix(in srgb, var(--c-musee) 12%, var(--panel));
  border-radius: 999px;
  padding: 1px 7px;
}
.ef input, .ef textarea, .ef select {
  width: 100%;
  font-family: var(--f-round);
  font-size: 14px;
  color: var(--ink);
  background: var(--panel-2);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 9px 11px;
  margin-bottom: 8px;
}
.ef textarea { min-height: 72px; resize: vertical; }
.ef input:focus, .ef textarea:focus, .ef select:focus { outline: 2px solid var(--c-musee); }
.ef-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.tipcard {
  border-radius: var(--r-md);
  background: var(--panel-2);
  border: 1px dashed var(--line);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 10px;
}
.tipcard b { color: var(--ink); }

/* ---------- accueil ---------- */
.hero-count {
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--g1a), var(--g3a));
  color: var(--on-grad);
  padding: 22px 18px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}
.hero-count::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 48px;
  background: var(--skyline) bottom / 100% 100% no-repeat;
  pointer-events: none;
}
.hero-count .skyline {
  position: absolute; right: 8px; bottom: 2px;
  font-size: 68px; opacity: .3; transform: rotate(-6deg);
}
.hero-count .jminus {
  font-family: var(--f-disp);
  font-size: 52px;
  font-weight: 800;
  letter-spacing: .01em;
  line-height: 1;
  position: relative;
  z-index: 1;
}
.hero-count .lbl { position: relative; z-index: 1; }
.hero-count .lbl { font-size: 13px; font-weight: 700; opacity: .9; margin-top: 4px; }

/* ---------- CityPASS ---------- */
.pass-slot {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  gap: 12px;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
  padding: 12px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
}
.pass-slot::before {
  content: "";
  position: absolute;
  right: 96px;
  top: 9px; bottom: 9px;
  border-left: 2px dashed var(--line);
}
.pass-slot .num {
  width: 44px; height: 44px;
  border-radius: 14px;
  display: grid; place-items: center;
  font-size: 22px;
  background: color-mix(in srgb, var(--c-musee) 14%, var(--panel));
}
.pass-slot .t { font-weight: 800; font-size: 15px; }
.pass-slot .d { font-size: 12px; color: var(--ink-faint); font-weight: 600; }
.pass-slot .stamp-btn {
  border: 1.5px solid var(--line);
  background: var(--panel);
  color: var(--ink-faint);
  font-family: var(--f-round);
  font-size: 11px;
  font-weight: 800;
  border-radius: 999px;
  padding: 7px 11px;
  cursor: pointer;
}
.pass-slot.used { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.pass-slot.used .stamp-btn { border-color: var(--ok); color: var(--ok); }
.pass-slot.used::after {
  content: "TAMPONNÉ";
  position: absolute;
  right: 74px; top: 50%;
  transform: translateY(-50%) rotate(-12deg);
  font-size: 13px;
  font-weight: 900;
  letter-spacing: .1em;
  color: var(--ok);
  border: 2.5px solid var(--ok);
  border-radius: 6px;
  padding: 2px 7px;
  opacity: .85;
  pointer-events: none;
}

/* ---------- budget ---------- */
.money-hero {
  text-align: center;
  padding: 20px 16px;
}
.money-hero .total {
  font-family: var(--f-disp);
  font-size: 40px;
  font-weight: 800;
  letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: linear-gradient(95deg, var(--gold), var(--c-sport));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.money-hero .lbl { font-size: 12.5px; color: var(--ink-faint); font-weight: 700; }
.stackbar {
  display: flex;
  height: 26px;
  border-radius: 999px;
  overflow: hidden;
  gap: 2px;
  margin: 14px 0 12px;
}
.stackbar span { display: block; height: 100%; }
.blegend { list-style: none; margin: 0; padding: 0; }
.blegend li {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 2px;
  font-size: 14px;
  border-bottom: 1px solid var(--line);
}
.blegend li:last-child { border-bottom: 0; }
.blegend .dot { width: 11px; height: 11px; border-radius: 4px; flex: 0 0 auto; }
.blegend .lab { flex: 1; color: var(--ink-soft); font-weight: 600; }
.blegend .val {
  font-family: var(--f-data);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.blegend li.head .lab, .blegend li.head .val { color: var(--ink); font-weight: 800; }
.paychk {
  appearance: none;
  -webkit-appearance: none;
  width: 23px; height: 23px;
  flex: 0 0 auto;
  border: 2.5px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: border-color .15s, background .15s;
}
.paychk:checked { background: var(--c-air); border-color: var(--c-air); }
.paychk:checked::after { content: "✓"; color: #fff; font-size: 13px; font-weight: 900; }
button.pedit {
  border: 0;
  background: var(--panel-2);
  color: var(--ink);
  cursor: pointer;
  border-radius: 999px;
  padding: 4px 9px;
  border: 1px dashed var(--line);
}
button.pedit.edited {
  border-style: solid;
  border-color: var(--c-musee);
  background: color-mix(in srgb, var(--c-musee) 12%, var(--panel));
}
.btn {
  display: inline-block;
  border: 1.5px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
  font-family: var(--f-round);
  font-weight: 800;
  font-size: 13px;
  border-radius: 999px;
  padding: 9px 15px;
  cursor: pointer;
  margin: 2px 8px 2px 0;
}
.btn:active { transform: scale(.96); }

/* ---------- accordéons (Miam / Shops) ---------- */
details.acc { padding: 0; overflow: hidden; }
details.acc summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 15px 16px;
  font-size: 15px;
  font-weight: 800;
  -webkit-user-select: none;
  user-select: none;
}
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary .cnt {
  margin-left: auto;
  font-family: var(--f-data);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-faint);
  white-space: nowrap;
}
details.acc summary::after {
  content: "▾";
  color: var(--ink-faint);
  transition: transform .18s ease;
}
details.acc[open] summary::after { transform: rotate(180deg); }
details.acc .acc-body { padding: 0 12px 12px; }

/* ---------- parcours du jour ---------- */
.route-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;

/* ============================================================
   ÉTAT — moteur de sauvegarde à 3 niveaux
   1. localStorage (testé réellement, pas juste supposé)
   2. cookies (si localStorage est bloqué par le bac à sable)
   3. mémoire seule + alerte et export/import manuel
   ============================================================ */
var LS_OK = (function () {
  try {
    localStorage.setItem("chi26:t", "1");
    var ok = localStorage.getItem("chi26:t") === "1";
    localStorage.removeItem("chi26:t");
    return ok;
  } catch (e) { return false; }
})();

/* Les cookies posés sur le domaine parent survivent aux republications
   de l'appli (qui changent l'origine du cadre) — c'est la copie durable. */
var COOKIE_DOMAIN = (function () {
  try {
    var h = location.hostname.split(".");
    if (h.length >= 3) return "; domain=." + h.slice(1).join(".");
  } catch (e) {}
  return "";
})();

function readCookieRaw() {
  try {
    var out = "";
    for (var i = 0; i < 6; i++) {
      var m = document.cookie.match(new RegExp("(?:^|;\\s*)chi26p" + i + "=([^;]*)"));
      if (!m || !m[1]) break;
      out += m[1];
    }
    return out ? decodeURIComponent(out) : null;
  } catch (e) { return null; }
}

function writeCookieChunks(enc, domain) {
  var CH = 3500;
  var n = Math.ceil(enc.length / CH) || 0;
  if (n > 6) return false;
  for (var i = 0; i < 6; i++) {
    var part = i < n ? enc.slice(i * CH, (i + 1) * CH) : "";
    document.cookie = "chi26p" + i + "=" + part + "; path=/; SameSite=Lax; max-age=" + (part ? 31536000 : 0) + domain;
  }
  return true;
}

function writeCookieRaw(raw) {
  try {
    var enc = encodeURIComponent(raw);
    writeCookieChunks(enc, COOKIE_DOMAIN);
    if (readCookieRaw() === raw) return true;
    writeCookieChunks(enc, "");
    return readCookieRaw() === raw;
  } catch (e) { return false; }
}

var CK_OK = (function () {
  var existing = readCookieRaw();
  return writeCookieRaw(existing !== null ? existing : "chi26probe");
})();

var BACKEND = LS_OK ? "local" : (CK_OK ? "cookie" : "mem");

var DB = { done: {}, prep: {}, pass: {}, pack: {}, food: {}, shop: {}, notes: {}, prices: {}, edits: {}, hidden: {}, added: {}, spend: [], paid: null, theme: null };

function parseCand(raw) {
  if (!raw) return null;
  try {
    var o = JSON.parse(raw);
    return o && typeof o === "object" ? o : null;
  } catch (e) { return null; }
}

function loadDB() {
  var cands = [];
  try { cands.push(parseCand(localStorage.getItem("chi26:db"))); } catch (e) {}
  cands.push(parseCand(readCookieRaw()));
  try {
    var legacy = {};
    ["done", "prep", "pass", "pack", "food", "shop", "notes", "prices"].forEach(function (k) {
      var v = localStorage.getItem("chi26:" + k);
      if (v) legacy[k] = JSON.parse(v);
    });
    if (Object.keys(legacy).length) cands.push(legacy);
  } catch (e) {}
  var best = null;
  cands.forEach(function (c) {
    if (c && (!best || (+c.ts || 0) >= (+best.ts || 0))) best = c;
  });
  if (!best) return;
  ["done", "prep", "pass", "pack", "food", "shop", "notes", "prices", "edits", "hidden", "added"].forEach(function (k) {
    if (best[k] && typeof best[k] === "object" && !Array.isArray(best[k])) DB[k] = best[k];
  });
  if (Array.isArray(best.spend)) DB.spend = best.spend;
  if (best.paid && typeof best.paid === "object") DB.paid = best.paid;
  if (best.theme) DB.theme = best.theme;
}

function saveDB() {
  DB.ts = Date.now();
  var raw = JSON.stringify(DB);
  try { localStorage.setItem("chi26:db", raw); } catch (e) {}
  writeCookieRaw(raw);
}

loadDB();
if (!DB.paid) {
  DB.paid = {};
  BUDGET.fixed.forEach(function (r) { if (r.def) DB.paid[r.id] = 1; });
}
saveDB();

function esc(s) { return String(s == null ? "" : s); }

function linkLabel(it) {
  if (it.u.indexOf("maps.google") !== -1) return "🗺️ Y aller";
  if (it.pass || (it.pr && !/Gratuit|Donation/.test(it.pr))) return "Réserver — site officiel";
  return "Site officiel";
}

function priceHtml(it) {
  if (it.pass) return '<span class="price pass">🎫 ' + it.pass + "</span>";
  if (!it.pr) return "";
  var cls = /Gratuit|Donation/.test(it.pr) ? "price free" : "price";
  return '<span class="' + cls + '">' + esc(it.pr) + "</span>";
}

var editItem = null;

function dayItems(day) {
  var arr = [];
  day.items.forEach(function (base, i) {
    var uid = "d" + day.d + "-" + i;
    if (DB.hidden[uid]) return;
    var it = DB.edits[uid] ? Object.assign({}, base, DB.edits[uid]) : base;
    arr.push({ it: it, uid: uid });
  });
  (DB.added[day.d] || []).forEach(function (c, i) {
    var uid = "a" + day.d + "-" + i;
    if (DB.hidden[uid]) return;
    arr.push({ it: c, uid: uid, custom: true });
  });
  return arr;
}

function hiddenCount(day) {
  var n = 0;
  day.items.forEach(function (_, i) { if (DB.hidden["d" + day.d + "-" + i]) n++; });
  (DB.added[day.d] || []).forEach(function (_, i) { if (DB.hidden["a" + day.d + "-" + i]) n++; });
  return n;
}

function editFormHtml(uid, it) {
  var cats = CATS.map(function (c) {
    return '<option value="' + c[0] + '"' + ((it.c || "air") === c[0] ? " selected" : "") + ">" + c[1] + "</option>";
  }).join("");
  var isNew = uid.indexOf("new-") === 0;
  return '<div class="card ef" data-efuid="' + uid + '">' +
    "<h3>" + (isNew ? "➕ Nouvelle activité" : "✏️ Modifier l'activité") + "</h3>" +
    '<input class="ef-h" type="text" placeholder="Heure (ex : 14h30, Aprem…)" value="' + esc(it.h || "").replace(/"/g, "&quot;") + '">' +
    '<input class="ef-t" type="text" placeholder="Titre de l\'activité" value="' + esc(it.t || "").replace(/"/g, "&quot;") + '">' +
    '<textarea class="ef-n" placeholder="Note, détails, transport…">' + escT(it.n || "") + "</textarea>" +
    '<div class="ef-row"><input class="ef-pr" type="text" placeholder="Prix (26 €, Gratuit…)" value="' + esc(it.pr || "").replace(/"/g, "&quot;") + '">' +
    '<select class="ef-c">' + cats + "</select></div>" +
    "<div>" +
    '<button class="btn" type="button" data-efsave="1">✓ Enregistrer</button>' +
    '<button class="btn" type="button" data-efcancel="1">✕ Annuler</button>' +
    (isNew ? "" : '<button class="btn" type="button" data-efhide="1">🗑 Retirer</button>') +
    (!isNew && DB.edits[uid] ? '<button class="btn" type="button" data-eforig="1">↩︎ Original</button>' : "") +
    "</div></div>";
}

function itemHtml(day, uid, it, showEdit) {
  if (editItem === uid) return editFormHtml(uid, it);
  var checked = done[uid] ? " checked" : "";
  var doneCls = done[uid] ? " done" : "";
  var badge = uid.charAt(0) === "a" ? '<span class="modif">ajouté</span>' : (DB.edits[uid] ? '<span class="modif">modifié</span>' : "");
  return '<label class="item' + doneCls + '" style="--cat: var(--c-' + (it.c || "air") + ')" data-uid="' + uid + '">' +
    '<input type="checkbox" class="chk" data-uid="' + uid + '" data-day="' + day.d + '"' + checked +
    ' aria-label="Fait : ' + esc(it.t).replace(/"/g, "&quot;") + '">' +
    '<span class="body"><span class="h">' + esc(it.h || "—") + "</span> " + badge + "<br>" +
    '<span class="t">' + esc(it.t) + "</span>" +
    (it.n ? '<div class="n' + (it.w ? " warn" : "") + '">' + esc(it.n) + "</div>" : "") +
    (it.u ? '<a class="lnk" href="' + it.u + '" target="_blank" rel="noopener">' + linkLabel(it) + " ↗</a>" : "") +
    "</span>" + priceHtml(it) +
    (showEdit ? '<button class="iedit" type="button" data-iedit="' + uid + '" aria-label="Modifier cette activité">✎</button>' : "") +
    "</label>";
}

function dayDoneCount(day) {
  var n = 0;
  dayItems(day).forEach(function (en) { if (done[en.uid]) n++; });
  return n;
}

function progressCounts() {
  var ok = 0, total = 0;
  DAYS.forEach(function (day) {
    dayItems(day).forEach(function (en) { total++; if (done[en.uid]) ok++; });
  });
  return { ok: ok, total: total };
}

function itemMatches(it) {
  return activeCats.length === 0 || activeCats.indexOf(it.c) !== -1;
}

function dayCardHtml(day, kicker, useFilter, hideDone) {
  var dn = dayDoneCount(day);
  var html = '<div class="dayhero" data-p="' + day.p + '">' +
    '<span class="big-emoji">' + day.e + "</span>" +
    '<div class="kicker">' + esc(kicker || ("Jour " + day.d + " / 14 · " + day.dow + " " + day.lab)) + "</div>" +
    "<h3>" + day.e + " " + esc(day.title) + "</h3>" +
    '<div class="sub">' + ["", "Chicago · semaine Kaplan", "Mississippi · Ole Miss", "Chicago · mode touriste"][day.p] + "</div>" +
    '<span class="done-pill">' + dn + " / " + dayItems(day).length + " coché" + (dn > 1 ? "s" : "") + "</span>" +
    "</div>";
  if (day.tip) html += '<div class="tipcard">💡 ' + esc(day.tip) + "</div>";
  html += routeStrip(day);
  var shown = 0;
  dayItems(day).forEach(function (en) {
    if (hideDone && done[en.uid]) return;
    if (!useFilter || itemMatches(en.it)) { html += itemHtml(day, en.uid, en.it, true); shown++; }
  });
  if (useFilter && shown === 0) html += '<div class="tipcard">Rien ce jour-là pour ce filtre.</div>';
  if (hideDone && shown === 0) html += '<div class="tipcard">🎉 Tout est fait pour aujourd\'hui !</div>';
  var hc = hiddenCount(day);
  html += '<div style="margin-bottom:10px">' +
    '<button class="btn" type="button" data-addday="' + day.d + '">＋ Ajouter une activité</button>' +
    (hc ? '<button class="btn" type="button" data-unhide="' + day.d + '">↩︎ Réafficher ' + hc + " retirée" + (hc > 1 ? "s" : "") + "</button>" : "") +
    "</div>";
  html += '<textarea class="daynote" data-note="d' + day.d + '" placeholder="📓 Journal du jour ' + day.d +
    ' — ce que tu as vu, aimé, raté…">' + escT(DB.notes["d" + day.d] || "") + "</textarea>";
  return html;
}

function bindEditing(scope) {
  scope.querySelectorAll("[data-iedit]").forEach(function (b) {
    b.addEventListener("click", function (e) {
      e.preventDefault();
      editItem = b.dataset.iedit;
      renderPlan(); renderHome();
    });
  });
  scope.querySelectorAll("[data-addday]").forEach(function (b) {
    b.addEventListener("click", function () {
      editItem = "new-" + b.dataset.addday;
      renderPlan(); renderHome();
    });
  });
  scope.querySelectorAll("[data-unhide]").forEach(function (b) {
    b.addEventListener("click", function () {
      var d = b.dataset.unhide;
      Object.keys(DB.hidden).forEach(function (k) {
        if (k === "d" + d || k.indexOf("d" + d + "-") === 0 || k.indexOf("a" + d + "-") === 0) delete DB.hidden[k];
      });
      saveDB(); renderPlan(); renderHome(); refreshRing();
      toast("Activités réaffichées ↩︎");
    });
  });
  var ef = scope.querySelector("[data-efuid]");
  if (!ef) return;
  var uid = ef.dataset.efuid;
  var val = function (sel) { var el = ef.querySelector(sel); return el ? el.value : ""; };
  ef.querySelector("[data-efsave]").addEventListener("click", function () {
    var vals = { h: val(".ef-h").trim() || "—", t: val(".ef-t").trim(), c: val(".ef-c") || "air" };
    if (!vals.t) { toast("Il faut au moins un titre"); return; }
    var n = val(".ef-n").trim(); if (n) vals.n = n;
    var pr = val(".ef-pr").trim(); if (pr) vals.pr = pr;
    if (uid.indexOf("new-") === 0) {
      var d = +uid.slice(4);
      (DB.added[d] = DB.added[d] || []).push(vals);
      toast("Activité ajoutée ➕");
    } else if (uid.charAt(0) === "a") {
      var p = uid.slice(1).split("-");
      DB.added[+p[0]][+p[1]] = vals;
      toast("Activité modifiée ✓");
    } else {
      DB.edits[uid] = vals;
      toast("Activité modifiée ✓");
    }
    editItem = null;
    saveDB(); renderPlan(); renderHome(); refreshRing();
  });
  ef.querySelector("[data-efcancel]").addEventListener("click", function () {
    editItem = null;
    renderPlan(); renderHome();
  });
  var hideBtn = ef.querySelector("[data-efhide]");
  if (hideBtn) hideBtn.addEventListener("click", function () {
    DB.hidden[uid] = 1;
    editItem = null;
    saveDB(); renderPlan(); renderHome(); refreshRing();
    toast("Retirée — « Réafficher » en bas du jour pour annuler");
  });
  var origBtn = ef.querySelector("[data-eforig]");
  if (origBtn) origBtn.addEventListener("click", function () {
    delete DB.edits[uid];
    editItem = null;
    saveDB(); renderPlan(); renderHome();
    toast("Original rétabli ↩︎");
  });
}

function escT(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
}

function routeStrip(day) {
  var steps = dayItems(day).map(function (en) { return en.it; }).filter(function (it) { return it.c !== "cours"; });
  if (steps.length < 2) return "";
  var h = '<div class="route-strip" aria-label="Ordre de la journée">';
  steps.forEach(function (it, i) {
    var short = it.t.replace(/\s*[—:+·(].*$/, "").trim();
    if (short.length > 22) short = short.slice(0, 21) + "…";
    h += (i ? '<span class="ra">→</span>' : "") +
      '<span class="rs" style="--cat: var(--c-' + it.c + ')"><b>' + (i + 1) + "</b>" + esc(short) + "</span>";
  });
  return h + "</div>";
}

function bindNotes(scope) {
  scope.querySelectorAll(".daynote").forEach(function (ta) {
    ta.addEventListener("input", function () {
      var k = ta.dataset.note;
      var v = ta.value;
      if (v) DB.notes[k] = v; else delete DB.notes[k];
      saveDB();
    });
  });
}

    '<button type="button" data-view="all" class="' + (planView === "all" ? "on" : "") + '">Tout le séjour</button></div>';

  var chips = '<div class="filters">' +
    '<button class="chip reset" type="button" data-cat="all" aria-pressed="' + (activeCats.length === 0 ? "true" : "false") + '">Tout</button>' +
    CATS.map(function (c) {
      var on = activeCats.indexOf(c[0]) !== -1;
      return '<button class="chip" type="button" data-cat="' + c[0] + '" style="--dot: var(' + c[2] + ')" aria-pressed="' + (on ? "true" : "false") + '">' + c[1] + "</button>";
    }).join("") + "</div>";

  var body = "";
  if (planView === "day") {
    var picks = DAYS.map(function (day) {
      var all = dayItems(day).length > 0 && dayDoneCount(day) === dayItems(day).length;
      return '<button class="dp' + (day.d === curDay ? " on" : "") + (all ? " alldone" : "") +
        '" data-p="' + day.p + '" data-d="' + day.d + '" type="button">' +
        '<span class="e">' + day.e + '</span><span class="n">' + day.d + '</span>' +
        '<span class="d">' + day.dow + "</span></button>";
    }).join("");
    body = '<div class="daypick" id="daypick">' + picks + "</div>" + dayCardHtml(DAYS[curDay - 1], null, true);
  } else {
    DAYS.forEach(function (day) {
      var ens = dayItems(day).filter(function (en) { return itemMatches(en.it); });
      if (!ens.length) return;
      body += '<div class="mini-day" style="--pc: var(--g' + day.p + 'a)">' +
        '<span class="me">' + day.e + '</span><span class="n">J' + day.d + '</span>' +
        '<span class="d">' + day.dow + " " + day.lab + " · " + esc(day.title) + "</span></div>";
      ens.forEach(function (en) { body += itemHtml(day, en.uid, en.it, false); });
    });
    if (!body) body = '<div class="tipcard">Rien pour ce filtre.</div>';
  }

  scr.innerHTML = '<h2 class="screen-title"><span>📅</span>Le planning</h2>' + seg + chips + body;

  scr.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () { planView = b.dataset.view; renderPlan(); });
  });
  scr.querySelectorAll(".chip").forEach(function (ch) {
    ch.addEventListener("click", function () {
      var c = ch.dataset.cat;
      if (c === "all") activeCats = [];
      else {
        var i = activeCats.indexOf(c);
        if (i === -1) activeCats.push(c); else activeCats.splice(i, 1);
      }
      renderPlan();
    });
  });
  scr.querySelectorAll(".dp").forEach(function (b) {
    b.addEventListener("click", function () {
      curDay = +b.dataset.d;
      renderPlan();
    });
  });
  bindChecks(scr);
  bindNotes(scr);
  bindEditing(scr);
}

/* ---------- écran Aujourd'hui ---------- */
var focusMode = false;

function renderHome() {
  var scr = document.getElementById("scr-home");
  var t = todayChicago();
  var start = "2026-08-29", end = "2026-09-11";
  var html = "";
  if (BACKEND === "mem") {
    html += '<div class="tipcard">⚠️ <b>Ce navigateur bloque l\'enregistrement des coches.</b> Pense à Exporter ta sauvegarde (onglet ℹ️ Infos) avant de fermer.</div>';
  }
  if (t < start) {
    var days = Math.round((new Date(start) - new Date(t)) / 864e5);
    var prepLeft = PREP.filter(function (_, i) { return !prepDone["p" + i]; }).length;
    html += '<div class="hero-count"><span class="skyline">🏙️</span>' +
      '<div class="jminus">J−' + days + "</div>" +
      '<div class="lbl">avant l\'embarquement · 14 jours · 3 villes · 5 CityPASS</div></div>';
    html += '<div class="card"><h3>✅ À régler avant de partir' +
      (prepLeft ? " · " + prepLeft + " restant" + (prepLeft > 1 ? "s" : "") : " · tout est prêt 🎉") + "</h3>";
    PREP.forEach(function (p, i) {
      var uid = "p" + i;
      html += '<label class="item' + (prepDone[uid] ? " done" : "") + '" style="--cat: var(--c-cours)">' +
        '<input type="checkbox" class="chk" data-prep="' + uid + '"' + (prepDone[uid] ? " checked" : "") +
        ' aria-label="' + esc(p.t).replace(/"/g, "&quot;") + '">' +
        '<span class="body"><span class="t">' + p.e + " " + esc(p.t) + '</span><div class="n">' + esc(p.n) + "</div></span></label>";
    });
    html += "</div>";
    html += '<div class="tipcard">👉 Le jour J, cet écran affichera automatiquement le programme du jour, en heure de Chicago.</div>';
  } else if (t > end) {
    var pcEnd = progressCounts();
    html += '<div class="hero-count"><span class="skyline">🌆</span>' +
      '<div class="jminus">Fini ✔</div>' +
      '<div class="lbl">' + pcEnd.ok + " / " + pcEnd.total + " activités cochées. Beau voyage.</div></div>";
    html += '<div class="tipcard">Revois le détail dans l\'onglet 📅 Jours.</div>';
  } else {
    var day = DAYS.find(function (d) { return d.date === t; }) || DAYS[0];
    var hour = 12, minute = 0;
    try {
      var hp = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Chicago", hour: "numeric", minute: "numeric", hour12: false
      }).formatToParts(new Date());
      hp.forEach(function (p) {
        if (p.type === "hour") hour = parseInt(p.value, 10);
        if (p.type === "minute") minute = parseInt(p.value, 10);
      });
    } catch (e) {}
    /* compte à rebours du prochain créneau horaire non coché */
    var nowMin = hour * 60 + minute;
    var nextEn = null, nextMin = 0;
    dayItems(day).forEach(function (en) {
      if (nextEn || done[en.uid]) return;
      var m = /(\d{1,2})h(\d{0,2})/.exec(en.it.h || "");
      if (!m) return;
      var em = (+m[1]) * 60 + (+(m[2] || 0));
      if (em > nowMin) { nextEn = en; nextMin = em; }
    });
    if (nextEn) {
      var diff = nextMin - nowMin;
      var dtxt = diff >= 60 ? Math.floor(diff / 60) + " h " + (diff % 60 ? (diff % 60) + " min" : "") : diff + " min";
      html += '<div class="tipcard">⏱️ <b>Prochain créneau :</b> ' + esc(nextEn.it.t) + " à " + esc(nextEn.it.h) + " — dans " + dtxt + "</div>";
    }
    html += '<div style="margin-bottom:10px"><button class="btn" id="btnFocus" type="button">' +
      (focusMode ? "👀 Tout afficher" : "🎯 Masquer ce qui est fait") + "</button></div>";
    html += dayCardHtml(day, "Aujourd'hui · " + day.dow + " " + day.lab, false, focusMode);
    var nxt = DAYS[day.d];
    if (nxt && hour >= 18) {
      html += '<div class="card"><h3>🌙 Demain en un coup d\'œil — ' + nxt.e + " " + esc(nxt.title) + "</h3><ul>";
      nxt.items.slice(0, 3).forEach(function (it) {
        html += "<li><b>" + esc(it.h) + "</b> — " + esc(it.t) + "</li>";
      });
      html += "</ul>" + (nxt.tip ? "<p>💡 " + esc(nxt.tip) + "</p>" : "") + "</div>";
    } else if (nxt) {
      html += '<div class="tipcard">🔜 <b>Demain :</b> ' + nxt.e + " " + esc(nxt.title) +
        (nxt.tip ? " — " + esc(nxt.tip) : "") + "</div>";
    }
  }

  /* le voyage en chiffres */
  var foodTotal = 0, shopTotal = 0;
  FOOD.forEach(function (g) { foodTotal += g.items.length; });
  SHOP.forEach(function (g) { shopTotal += g.items.length; });
  var spentSum = DB.spend.reduce(function (a, e) { return a + (+e.a || 0); }, 0);
  var pc = progressCounts();
  html += '<div class="card"><h3>📊 Le voyage en chiffres</h3><ul class="blegend">' +
    '<li><span class="dot" style="background:var(--c-air)"></span><span class="lab">Activités cochées</span><span class="val">' + pc.ok + " / " + pc.total + "</span></li>" +
    '<li><span class="dot" style="background:var(--c-musee)"></span><span class="lab">CityPASS tamponnés</span><span class="val">' + Object.keys(passUsed).length + " / 5</span></li>" +
    '<li><span class="dot" style="background:var(--c-sport)"></span><span class="lab">Adresses goûtées</span><span class="val">' + Object.keys(DB.food).length + " / " + foodTotal + "</span></li>" +
    '<li><span class="dot" style="background:var(--c-soir)"></span><span class="lab">Boutiques faites</span><span class="val">' + Object.keys(DB.shop).length + " / " + shopTotal + "</span></li>" +
    '<li><span class="dot" style="background:var(--c-campus)"></span><span class="lab">Dépensé sur place</span><span class="val">' + spentSum.toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " €</span></li>" +
    '<li><span class="dot" style="background:var(--c-archi)"></span><span class="lab">Marche estimée</span><span class="val">~12–18 km/j</span></li>' +
    "</ul>" +
    [1, 2, 3].map(function (p) {
      var ok = 0, tot = 0;
      DAYS.forEach(function (d) {
        if (d.p !== p) return;
        dayItems(d).forEach(function (en) { tot++; if (done[en.uid]) ok++; });
      });
      var pctp = tot ? Math.round(ok / tot * 100) : 0;
      return '<div class="phrow"><span>' + ["", "Chicago 1", "Ole Miss", "Chicago 2"][p] + '</span>' +
        '<div class="gauge"><span style="width:' + pctp + '%; background: var(--g' + p + 'a)"></span></div>' +
        '<span class="pv">' + ok + "/" + tot + "</span></div>";
    }).join("") +
    '<div style="margin-top:12px"><button class="btn" id="btnSouvenir" type="button">🖼️ Ma carte-souvenir</button></div></div>';

  scr.innerHTML = html;
  var sv = document.getElementById("btnSouvenir");
  if (sv) sv.addEventListener("click", showSouvenir);
  var fb = document.getElementById("btnFocus");
  if (fb) fb.addEventListener("click", function () { focusMode = !focusMode; renderHome(); });
  bindChecks(scr);
  bindNotes(scr);
  bindEditing(scr);
  scr.querySelectorAll("[data-prep]").forEach(function (box) {
    box.addEventListener("change", function () {
      prepDone[box.dataset.prep] = box.checked ? 1 : undefined;
      if (!box.checked) delete prepDone[box.dataset.prep];
      store.set("chi26:prep", prepDone);
      renderHome();
    });
  });
}

/* ---------- écran Budget ---------- */
function fmtEur(n) { return n.toLocaleString("fr-FR") + " €"; }

function effPrice(r) {
  return DB.prices[r.id] != null ? +DB.prices[r.id] : r.v;
}
function effLabel(r) {
  return DB.prices[r.id] != null ? fmtEur(+DB.prices[r.id]) : (r.lab || fmtEur(r.v));
}

function renderBudget() {
  var scr = document.getElementById("scr-budget");
  var paidSum = 0, restFixed = 0;
  BUDGET.fixed.forEach(function (r) {
    if (paidState[r.id]) paidSum += effPrice(r); else restFixed += effPrice(r);
  });
  var onsiteSum = BUDGET.onsite.reduce(function (a, r) { return a + r[2]; }, 0);
  var resteTotal = restFixed + onsiteSum;

  var tMin = onsiteSum, tMax = onsiteSum;
  BUDGET.fixed.forEach(function (r) {
    if (DB.prices[r.id] != null) { tMin += +DB.prices[r.id]; tMax += +DB.prices[r.id]; }
    else if (r.id === "hot") { tMin += 300; tMax += 600; }
    else if (r.id === "sim") { tMin += 20; tMax += 40; }
    else { tMin += r.v; tMax += r.v; }
  });
  var totalTxt = tMin === tMax
    ? fmtEur(tMin)
    : tMin.toLocaleString("fr-FR") + " – " + tMax.toLocaleString("fr-FR") + " €";

  var segs = [
    ["Déjà payé", paidSum, "var(--b-paid)"],
    ["Réservations restantes", restFixed, "var(--b-1)"]
  ].concat(BUDGET.onsite.map(function (r) {
    return [r[0], r[2], "var(--" + r[3] + ")"];
  })).filter(function (s) { return s[1] > 0; });
  var grand = segs.reduce(function (a, s) { return a + s[1]; }, 0);
  var bar = segs.map(function (s) {
    return '<span style="width:' + (s[1] / grand * 100).toFixed(1) + "%; background:" + s[2] + '" title="' + esc(s[0]) + '"></span>';
  }).join("");

  var spent = DB.spend.reduce(function (a, e) { return a + (+e.a || 0); }, 0);
  var envelope = 954; /* activités 304 + nourriture 350 + transports 300 */
  var pct = Math.min(100, spent / envelope * 100);
  var spendRows = DB.spend.slice().reverse().map(function (e, ri) {
    var i = DB.spend.length - 1 - ri;
    var dayObj = null;
    DAYS.forEach(function (d) { if (d.date === e.d) dayObj = d; });
    var lbl = dayObj ? "J" + dayObj.d : (e.d || "").slice(5);
    return '<li><span class="sd">' + esc(lbl) + '</span><span class="st">' + esc(e.t || "—") +
      '</span><span class="sa">' + (+e.a).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " €" +
      '</span><button class="sx" type="button" data-del="' + i + '" aria-label="Supprimer">✕</button></li>';
  }).join("");

  var html = '<h2 class="screen-title"><span>💰</span>Budget</h2>' +

    '<div class="card"><h3>💸 Carnet de dépenses — ' +
    spent.toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " € dépensés</h3>" +
    '<div class="spend-form">' +
    '<input type="number" inputmode="decimal" min="0" step="0.5" id="spAmt" placeholder="12,50">' +
    '<input type="text" id="spTxt" placeholder="ex : deep dish Pequod\'s" maxlength="60">' +
    '<button class="btn" id="spAdd" type="button" style="margin:0">＋</button></div>' +
    '<div class="gauge' + (spent > envelope ? " over" : "") + '"><span style="width:' + pct.toFixed(1) + '%"></span></div>' +
    '<p style="font-size:12.5px">' +
    (spent > envelope
      ? "Enveloppe « sur place » de 954 € dépassée de " + Math.round(spent - envelope) + " € — à compenser sur l'hôtel ou le shopping."
      : "Reste " + Math.round(envelope - spent) + " € sur l'enveloppe « sur place » (activités + nourriture + transports : 954 €).") +
    "</p>" +
    (spendRows ? '<ul class="spend-list">' + spendRows + "</ul>" : '<p style="font-size:12.5px">Saisis chaque dépense en 2 secondes — le total se compare tout seul au budget.</p>') +
    "</div>" +

    '<div class="card money-hero">' +
    '<div class="lbl">TOTAL ESTIMÉ DU VOYAGE</div>' +
    '<div class="total">' + totalTxt + "</div>" +
    '<div class="lbl">cible : ~3 500 € hors shopping · les prix corrigés recalculent tout</div>' +
    '<div class="stackbar" role="img" aria-label="Répartition du budget">' + bar + "</div>" +
    '<ul class="blegend">' +
    '<li class="head"><span class="dot" style="background:var(--b-paid)"></span><span class="lab">Déjà payé</span><span class="val">' + fmtEur(paidSum) + "</span></li>" +
    '<li class="head"><span class="dot" style="background:var(--b-1)"></span><span class="lab">Reste à payer</span><span class="val">~' + fmtEur(resteTotal) + "</span></li>" +
    BUDGET.onsite.map(function (r) {
      return '<li><span class="dot" style="background:var(--' + r[3] + ')"></span><span class="lab">' + esc(r[0]) + " (sur place)</span><span class=\"val\">" + esc(r[1]) + "</span></li>";
    }).join("") +
    "</ul></div>";

  var accB = accOpen.budget || (accOpen.budget = {});
  var paidRows = "", restRows = "";
  BUDGET.fixed.forEach(function (r) {
    var row = '<li><span class="dot" style="background:var(--b-' + (paidState[r.id] ? "paid" : "1") + ')"></span>' +
      '<span class="lab">' + esc(r.t) + '</span><span class="val">' + effLabel(r) + "</span></li>";
    if (paidState[r.id]) paidRows += row; else restRows += row;
  });
  BUDGET.onsite.forEach(function (r) {
    restRows += '<li><span class="dot" style="background:var(--' + r[3] + ')"></span>' +
      '<span class="lab">' + esc(r[0]) + ' (sur place)</span><span class="val">' + esc(r[1]) + "</span></li>";
  });
  html += '<details class="card acc" data-bacc="paid"' + (accB.paid ? " open" : "") + ">" +
    "<summary>✅ Déjà payé — le détail<span class=\"cnt\">" + fmtEur(paidSum) + "</span></summary>" +
    '<div class="acc-body"><ul class="blegend">' + (paidRows || "<li><span class=\"lab\">Rien pour l'instant.</span></li>") + "</ul></div></details>";
  html += '<details class="card acc" data-bacc="rest"' + (accB.rest ? " open" : "") + ">" +
    "<summary>⏳ Reste à payer — le détail<span class=\"cnt\">~" + fmtEur(resteTotal) + "</span></summary>" +
    '<div class="acc-body"><ul class="blegend">' + restRows + "</ul>" +
    '<p style="font-size:12.5px; margin-top:8px">Coche un poste dans le suivi ci-dessous dès qu\'il est réglé : il bascule automatiquement dans « Déjà payé ».</p></div></details>';

  html += '<div class="card"><h3>🧾 Suivi des paiements</h3>' +
    '<p style="font-size:12.5px; margin-bottom:8px">Coche quand c\'est réglé · touche un prix ✏️ pour saisir ce que tu as vraiment payé (vide + ✓ = retour à l\'estimation).</p><ul class="blegend">' +
    BUDGET.fixed.map(function (r) {
      var on = paidState[r.id];
      var edited = DB.prices[r.id] != null;
      if (editingPay === r.id) {
        var cur = edited ? DB.prices[r.id] : r.v;
        return '<li><span class="lab">' + esc(r.t) + "</span>" +
          '<input class="pin" type="number" inputmode="decimal" step="0.01" min="0" id="pinInput" value="' + cur + '" aria-label="Prix payé en euros">' +
          '<button class="mini" type="button" data-pok="1" aria-label="Valider le prix">✓</button>' +
          '<button class="mini cancel" type="button" data-pcancel="1" aria-label="Annuler">✕</button></li>';
      }
      return '<li><input type="checkbox" class="paychk" data-pay="' + r.id + '"' + (on ? " checked" : "") +
        ' aria-label="Payé : ' + esc(r.t).replace(/"/g, "&quot;") + '">' +
        '<span class="lab"' + (on ? ' style="text-decoration:line-through; opacity:.6"' : "") + ">" + esc(r.t) + "</span>" +
        '<button class="val pedit' + (edited ? " edited" : "") + '" type="button" data-edit="' + r.id +
        '" aria-label="Corriger le prix de ' + esc(r.t).replace(/"/g, "&quot;") + '">' + effLabel(r) + " ✏️</button></li>";
    }).join("") + "</ul></div>";

  html += '<div class="tipcard">⚠️ <b>Le seul poste qui peut faire déraper : l\'hôtel.</b> À 300 € les 3 nuits, le total fait ~3 493 € — la cible tient tout juste. À 600 €, on file à 3 813 €. Viser ≤ 330 €.</div>';
  html += '<div class="tipcard">🚗 Bon plan transfert : la navette Groome Memphis ↔ Oxford coûte ~50 $ le trajet au lieu des 90–115 € d\'Uber budgétés — ça peut libérer 100–150 € sur les 300 € de transport. Lien dans l\'onglet Infos.</div>';
  scr.innerHTML = html;

  scr.querySelectorAll("[data-pay]").forEach(function (box) {
    box.addEventListener("change", function () {
      if (box.checked) paidState[box.dataset.pay] = 1; else delete paidState[box.dataset.pay];
      store.set("chi26:paid", paidState);
      if (box.checked) burst(["💸", "✅", "💰"]);
      renderBudget();
    });
  });

  var addBtn = document.getElementById("spAdd");
  var amtIn = document.getElementById("spAmt");
  var txtIn = document.getElementById("spTxt");
  function addSpend() {
    var a = parseFloat(String(amtIn.value).replace(",", "."));
    if (!a || a <= 0) { amtIn.focus(); return; }
    DB.spend.push({ d: todayChicago(), a: a, t: txtIn.value.trim() });
    saveDB();
    renderBudget();
  }
  if (addBtn) {
    addBtn.addEventListener("click", addSpend);
    txtIn.addEventListener("keydown", function (e) { if (e.key === "Enter") addSpend(); });
  }
  scr.querySelectorAll("[data-del]").forEach(function (b) {
    b.addEventListener("click", function () {
      DB.spend.splice(+b.dataset.del, 1);
      saveDB();
      renderBudget();
    });
  });
  scr.querySelectorAll("[data-bacc]").forEach(function (d) {
    d.addEventListener("toggle", function () {
      if (d.open) accOpen.budget[d.dataset.bacc] = 1; else delete accOpen.budget[d.dataset.bacc];
    });
  });
  scr.querySelectorAll("[data-edit]").forEach(function (b) {
    b.addEventListener("click", function () {
      editingPay = b.dataset.edit;
      renderBudget();
      var inp = document.getElementById("pinInput");
      if (inp) { inp.focus(); if (inp.select) inp.select(); }
    });
  });
  var pok = scr.querySelector("[data-pok]");
  if (pok) pok.addEventListener("click", commitPrice);
  var pcan = scr.querySelector("[data-pcancel]");
  if (pcan) pcan.addEventListener("click", function () { editingPay = null; renderBudget(); });
  var pinInp = document.getElementById("pinInput");
  if (pinInp) pinInp.addEventListener("keydown", function (e) { if (e.key === "Enter") commitPrice(); });
}

var editingPay = null;

function commitPrice() {
  var inp = document.getElementById("pinInput");
  if (!inp || editingPay == null) return;
  var raw = String(inp.value).trim().replace(",", ".").replace(/[€\s]/g, "");
  if (raw === "") {
    delete DB.prices[editingPay];
    toast("Prix remis à l'estimation");
  } else {
    var val = parseFloat(raw);
    if (isNaN(val) || val < 0) { toast("Montant invalide"); return; }
    DB.prices[editingPay] = Math.round(val * 100) / 100;
    toast("Prix enregistré ✓");
  }
  editingPay = null;
  saveDB();
  renderBudget();
}

function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove("show"); }, 2400);
}

var accOpen = {};

function renderGuide(scrId, groups, dbKey, titleHtml, tip, verb) {
  var scr = document.getElementById(scrId);
  var state = DB[dbKey];
  var opened = accOpen[scrId] || (accOpen[scrId] = {});
  var total = 0, ok = 0;
  groups.forEach(function (g, gi) {
    g.items.forEach(function (_, ii) { total++; if (state["g" + gi + "-" + ii]) ok++; });
  });
  var html = titleHtml +
    '<div class="tipcard"><b>' + ok + " / " + total + "</b> " + verb + (ok > 1 ? "s" : "") + ". " + tip + "</div>";
  groups.forEach(function (g, gi) {
    var gOk = 0;
    g.items.forEach(function (_, ii) { if (state["g" + gi + "-" + ii]) gOk++; });
    html += '<details class="card acc" data-gi="' + gi + '"' + (opened[gi] ? " open" : "") + ">" +
      "<summary>" + g.e + " " + esc(g.t) +
      '<span class="cnt">' + gOk + " / " + g.items.length + "</span></summary>" +
      '<div class="acc-body">';
    g.items.forEach(function (it, ii) {
      var uid = "g" + gi + "-" + ii;
      html += '<label class="item' + (state[uid] ? " done" : "") + '" style="--cat: var(--c-' + g.c + '); box-shadow:none; margin-bottom:8px;">' +
        '<input type="checkbox" class="chk" data-guide="' + uid + '"' + (state[uid] ? " checked" : "") +
        ' aria-label="' + esc(it[0]).replace(/"/g, "&quot;") + '">' +
        '<span class="body"><span class="t">' + esc(it[0]) + "</span>" +
        (it[1] ? '<div class="n">' + esc(it[1]) + "</div>" : "") + "</span>" +
        (it[2] ? '<span class="price">' + esc(it[2]) + "</span>" : "") + "</label>";
    });
    html += "</div></details>";
  });
  scr.innerHTML = html;
  scr.querySelectorAll("details.acc").forEach(function (d) {
    d.addEventListener("toggle", function () {
      if (d.open) opened[d.dataset.gi] = 1; else delete opened[d.dataset.gi];
    });
  });
  scr.querySelectorAll("[data-guide]").forEach(function (box) {
    box.addEventListener("change", function () {
      if (box.checked) state[box.dataset.guide] = 1; else delete state[box.dataset.guide];
      saveDB();
      if (box.checked) {
        var left = 0;
        groups.forEach(function (g, gi) {
          g.items.forEach(function (_, ii) { if (!state["g" + gi + "-" + ii]) left++; });
        });
        if (left === 0) burst(["🎉", "⭐", "🎊"]);
      }
      renderGuide(scrId, groups, dbKey, titleHtml, tip, verb);
    });
  });
}

function exportSave() {
  var data = JSON.stringify(DB);
  var doClipboard = function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(function () {
        toast("Sauvegarde copiée 📋 — colle-la dans une note");
      }, function () {
        showImpBox(data);
        toast("Copie le texte affiché et garde-le");
      });
    } else {
      showImpBox(data);
      toast("Copie le texte affiché et garde-le");
    }
  };
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (dl) {
      if (!dl) { doClipboard(); return; }
      dl.save({ filename: "chicago-sauvegarde.json", data: data }).then(function () {
        toast("Fichier de sauvegarde proposé ⬇️");
      }, function (e) {
        if (!e || e.code !== "declined") doClipboard();
      });
    }, doClipboard);
  } else {
    doClipboard();
  }
}

function importSave(raw) {
  if (!raw || !raw.trim()) { toast("Colle d'abord ta sauvegarde dans la zone"); return; }
  try {
    var obj = JSON.parse(raw.trim());
    if (typeof obj !== "object" || !obj) throw 0;
    ["done", "prep", "pass", "pack", "food", "shop", "notes", "prices", "edits", "hidden", "added"].forEach(function (k) {
      if (obj[k] && typeof obj[k] === "object" && !Array.isArray(obj[k])) DB[k] = obj[k];
    });
    if (Array.isArray(obj.spend)) DB.spend = obj.spend;
    if (obj.paid && typeof obj.paid === "object") DB.paid = obj.paid;
    if (obj.theme) { DB.theme = obj.theme; root.setAttribute("data-theme", obj.theme); }
    relink();
    saveDB();
    rerenderAll();
    toast("Sauvegarde restaurée ✅");
  } catch (e) {
    toast("Ce texte n'est pas une sauvegarde valide");
  }
}

function refreshRing() {
  var pc = progressCounts();
  var ratio = pc.total ? pc.ok / pc.total : 0;
  document.getElementById("ringFg").style.strokeDashoffset = (100.5 * (1 - ratio)).toFixed(1);
  document.getElementById("ringTxt").textContent = Math.round(ratio * 100) + "%";
}

function burst(emojis) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var box = document.getElementById("confettiBox");
  for (var i = 0; i < 14; i++) {
    var s = document.createElement("span");
    s.className = "confetti";
    s.textContent = emojis[i % emojis.length];
    s.style.left = (5 + Math.random() * 90) + "%";
    s.style.animationDelay = (Math.random() * .35) + "s";
    s.style.fontSize = (16 + Math.random() * 14) + "px";
    box.appendChild(s);
    setTimeout(function (el) { return function () { el.remove(); }; }(s), 2200);
  }
}

function bindChecks(scope) {
  scope.querySelectorAll(".chk[data-uid]").forEach(function (box) {
    box.addEventListener("change", function () {
      var uid = box.dataset.uid;
      if (box.checked) done[uid] = 1; else delete done[uid];
      store.set("chi26:done", done);
      box.closest(".item").classList.toggle("done", box.checked);
      refreshRing();
      var day = DAYS[+box.dataset.day - 1];
      if (box.checked && dayDoneCount(day) === dayItems(day).length) {
        burst([day.e, "🎉", "⭐", "🎊"]);
      }
      var pcAll = progressCounts();
      if (box.checked && pcAll.ok === pcAll.total) {
        burst(["🏆", "🎆", "🌆"]);
        burst(["🎉", "⭐", "🎊"]);
        toast("🏆 100 % du voyage coché — chapeau !");
      }
      var pill = scope.querySelector(".done-pill");
      if (pill && day.d === curDay || (pill && scope.id === "scr-home")) {
        var dn = dayDoneCount(day);
        pill.textContent = dn + " / " + dayItems(day).length + " coché" + (dn > 1 ? "s" : "");
      }
    });
  });
}

var searchHits = [];

function doSearch(q) {
  q = q.trim().toLowerCase();
  searchHits = [];
  if (q.length < 2) return "";
  DAYS.forEach(function (day) {
    dayItems(day).forEach(function (en) {
      if ((en.it.t + " " + (en.it.n || "")).toLowerCase().indexOf(q) !== -1)
        searchHits.push({ e: day.e, l: en.it.t, w: "📅 Jour " + day.d + " · " + day.dow + " " + day.lab, go: ["plan", day.d] });
    });
  });
  FOOD.forEach(function (g, gi) {
    g.items.forEach(function (it) {
      if ((it[0] + " " + (it[1] || "")).toLowerCase().indexOf(q) !== -1)
        searchHits.push({ e: g.e, l: it[0], w: "🍕 Miam · " + g.t, go: ["miam", gi] });
    });
  });
  SHOP.forEach(function (g, gi) {
    g.items.forEach(function (it) {
      if ((it[0] + " " + (it[1] || "")).toLowerCase().indexOf(q) !== -1)
        searchHits.push({ e: g.e, l: it[0], w: "🛍️ Shops · " + g.t, go: ["shop", gi] });
    });
  });
  PACK.forEach(function (g, gi) {
    g.items.forEach(function (it) {
      if ((it[0] + " " + (it[1] || "")).toLowerCase().indexOf(q) !== -1)
        searchHits.push({ e: g.e, l: it[0], w: "🧳 Valise · " + g.t, go: ["pack", gi] });
    });
  });
  STORY.forEach(function (st, i) {
    if ((st.t + " " + st.x).toLowerCase().indexOf(q) !== -1)
      searchHits.push({ e: st.e, l: st.t, w: "🕰️ Histoire", go: ["story", i] });
  });
  searchHits = searchHits.slice(0, 30);
  if (!searchHits.length) return '<div class="tipcard">Rien trouvé pour « ' + esc(q) + " »</div>";
  return searchHits.map(function (r, i) {
    return '<button class="resrow" type="button" data-ri="' + i + '">' +
      '<span class="rw">' + esc(r.w) + '</span><span class="rl">' + r.e + " " + esc(r.l) + "</span></button>";
  }).join("");
}

/* ---------- carte-souvenir ---------- */
function makeSouvenir() {
  var c = document.createElement("canvas");
  c.width = 1080; c.height = 1350;
  var x = c.getContext("2d");
  var g = x.createLinearGradient(0, 0, 0, 1350);
  g.addColorStop(0, "#1e1b4b"); g.addColorStop(.55, "#7c2d82"); g.addColorStop(1, "#f06e3c");
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
  x.fillStyle = "#ffcd5a";
  x.beginPath(); x.arc(820, 640, 105, 0, 7); x.fill();
  x.fillStyle = "#100e28";
  var B = [[30, 165, 900], [200, 120, 780], [340, 175, 860], [540, 130, 700], [690, 150, 830], [860, 150, 740], [1020, 60, 880]];
  B.forEach(function (b) { x.fillRect(b[0], b[2], b[1], 1350 - b[2]); });
  x.fillRect(590, 620, 14, 80);
  x.fillStyle = "rgba(255,214,120,.85)";
  B.forEach(function (b, bi) {
    for (var wy = b[2] + 28; wy < 1300; wy += 46)
      for (var wx = b[0] + 16; wx < b[0] + b[1] - 16; wx += 40)
        if ((wx * 7 + wy * 13 + bi) % 17 < 6) x.fillRect(wx, wy, 14, 20);
  });
  x.fillStyle = "#fff";
  x.textAlign = "center";
  x.font = "900 96px -apple-system, system-ui, sans-serif";
  x.fillText("CHICAGO", 540, 150);
  x.font = "800 40px -apple-system, system-ui, sans-serif";
  x.fillText("& OLE MISS · 29 AOÛT → 11 SEPT 2026", 540, 215);
  var pc = progressCounts();
  var spent = DB.spend.reduce(function (a, e) { return a + (+e.a || 0); }, 0);
  var lines = [
    "✅  " + pc.ok + " / " + pc.total + " activités",
    "🎫  " + Object.keys(passUsed).length + " / 5 CityPASS",
    "🍕  " + Object.keys(DB.food).length + " adresses goûtées",
    "🛍️  " + Object.keys(DB.shop).length + " boutiques",
    "💸  " + Math.round(spent) + " € sur place",
    "🚶  ~200 km à pied"
  ];
  x.fillStyle = "rgba(16,14,40,.5)";
  x.fillRect(130, 270, 820, 640);
  x.fillStyle = "#fff";
  x.textAlign = "left";
  x.font = "700 54px -apple-system, system-ui, sans-serif";
  lines.forEach(function (l, i) { x.fillText(l, 200, 380 + i * 98); });
  x.textAlign = "center";
  x.font = "700 34px -apple-system, system-ui, sans-serif";
  x.fillText("14 jours · 3 villes · 1 malédiction de chèvre évitée", 540, 1315);
  return c;
}

function showSouvenir() {
  var c = makeSouvenir();
  document.getElementById("souvenirImg").src = c.toDataURL("image/png");
  document.getElementById("imgOvl").hidden = false;
  if (window.claude && window.claude.use && c.toBlob) {
    c.toBlob(function (blob) {
      if (!blob) return;
      window.claude.use("downloads").then(function (dl) {
        if (dl) dl.save({ filename: "chicago-souvenir.png", data: blob }).catch(function () {});
      }, function () {});
    });
  }
}

/* ---------- planning imprimable (.txt) ---------- */
function planText() {
  var out = "CHICAGO & OLE MISS — 29 août → 11 septembre 2026\n";
  out += "================================================\n\n";
  DAYS.forEach(function (day) {
    out += "JOUR " + day.d + " — " + day.dow + " " + day.lab + " · " + day.title + "\n";
    if (day.tip) out += "  💡 " + day.tip + "\n";
    dayItems(day).forEach(function (en) {
      out += "  [" + (done[en.uid] ? "x" : " ") + "] " + (en.it.h || "—") + " · " + en.it.t + (en.it.pr ? " (" + en.it.pr + ")" : "") + "\n";
      if (en.it.n) out += "      " + en.it.n + "\n";
    });
    var note = DB.notes["d" + day.d];
    if (note) out += "  📓 " + note + "\n";
    out += "\n";
  });
  return out;
}

function exportPlanTxt() {
  var data = planText();
  function fallback() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(function () {
        toast("Planning copié 📋 — colle-le dans Notes et imprime");
      }, function () { toast("Impossible ici — utilise Exporter"); });
    } else toast("Impossible ici — utilise Exporter");
  }
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (dl) {
      if (!dl) { fallback(); return; }
      dl.save({ filename: "planning-chicago.txt", data: data }).then(function () {
        toast("Planning téléchargé 🖨️");
      }, function (e) { if (!e || e.code !== "declined") fallback(); });
    }, fallback);
  } else fallback();
}

/* ---------- liaisons statiques : recherche, souvenir, swipe ---------- */
document.getElementById("searchBtn").addEventListener("click", function () {
  document.getElementById("searchOvl").hidden = false;
  var inp = document.getElementById("searchIn");
  inp.focus();
  inp.select();
});
document.getElementById("searchClose").addEventListener("click", function () {
  document.getElementById("searchOvl").hidden = true;
});
document.getElementById("searchIn").addEventListener("input", function () {
  document.getElementById("searchRes").innerHTML = doSearch(this.value);
});
document.getElementById("searchRes").addEventListener("click", function (e) {
  var b = e.target.closest ? e.target.closest("[data-ri]") : null;
  if (!b) return;
  var r = searchHits[+b.dataset.ri];
  if (!r) return;
  document.getElementById("searchOvl").hidden = true;
  if (r.go[0] === "plan") { curDay = r.go[1]; planView = "day"; }
  else if (r.go[0] === "story") { (accOpen.story = accOpen.story || {})[r.go[1]] = 1; }
  else { (accOpen["scr-" + r.go[0]] = accOpen["scr-" + r.go[0]] || {})[r.go[1]] = 1; }
  switchTab(r.go[0]);
});
document.getElementById("imgClose").addEventListener("click", function () {
  document.getElementById("imgOvl").hidden = true;
});

(function () {
  var sx = 0, sy = 0;
  var scr = document.getElementById("scr-plan");
  scr.addEventListener("touchstart", function (e) {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  scr.addEventListener("touchend", function (e) {
    if (planView !== "day" || editItem) return;
    var t = e.target;
    if (t.closest && (t.closest(".daypick") || t.closest("textarea") || t.closest("input") || t.closest(".ef") || t.closest(".filters"))) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) {
      var next = Math.min(DAYS.length, Math.max(1, curDay + (dx < 0 ? 1 : -1)));
      if (next !== curDay) { curDay = next; renderPlan(); }
    }
  }, { passive: true });
})();

var d0 = DAYS.find(function (d) { return d.date === t0; });
if (d0) curDay = d0.d;
renderHome();
renderPlan();
renderPack();
renderFood();
renderShop();
renderStory();
renderPass();
renderBudget();
renderInfos();
refreshRing();
})();
</script>
