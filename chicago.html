  --ink:      #e8ecf6;
  --ink-soft: #a6b0c6;
  --ink-faint:#78829a;
  --line:     #2c3650;
  --shadow:   0 2px 6px rgba(0,0,0,.4), 0 14px 34px -20px rgba(0,0,0,.9);

  --g1a: #1d4ed8; --g1b: #0e7490;
  --g2a: #b45309; --g2b: #c2410c;
  --g3a: #be185d; --g3b: #c2410c;

  --c-trajet: #9aa6b8;
  --c-cours:  #a98beb;
  --c-musee:  #7ca5f2;
  --c-archi:  #3fc1b5;
  --c-air:    #57c57b;
  --c-soir:   #ef7fb1;
  --c-sport:  #f0924e;
  --c-campus: #d46bdd;

  --b-paid: #8b94a6;
  --b-1: #3987e5;
  --b-2: #d95926;
  --b-3: #199e70;
  --b-4: #c98500;

  --gold: #e3c06b;
  --on-cat: #0d1220;

  --ok:   #4ade80;
  --warn: #fbbf24;
}

/* ============================================================
   BASE + COQUILLE D'APPLI
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--ground);
  background-image:
    radial-gradient(900px 420px at 20% -8%, color-mix(in srgb, var(--g1a) 9%, transparent), transparent 70%),
    radial-gradient(700px 360px at 95% 4%, color-mix(in srgb, var(--g3a) 7%, transparent), transparent 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--f-round);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ---------- barre du haut ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--ground) 82%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar .logo { font-size: 22px; }
.topbar .name {
  flex: 1;
  font-family: var(--f-disp);
  font-weight: 800;
  font-size: 18px;
  text-transform: uppercase;
  letter-spacing: .07em;
}
.topbar .name small {
  display: block;
  font-weight: 600;
  font-size: 11px;
  color: var(--ink-faint);
}
.ring { width: 40px; height: 40px; flex: 0 0 auto; }
.ring circle { fill: none; stroke-width: 4; }
.ring .bg { stroke: var(--line); }
.ring .fg {
  stroke: url(#ringGrad);
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: center;
  transition: stroke-dashoffset .5s ease;
}
.ring text {
  font-family: var(--f-round);
  font-size: 11px;
  font-weight: 800;
  fill: var(--ink);
  text-anchor: middle;
  dominant-baseline: central;
}
.theme-toggle {
  border: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 36px; height: 36px;
  font-size: 16px;
  cursor: pointer;
  display: grid;
  place-items: center;
}

/* ---------- contenu défilant ---------- */
main {
  flex: 1;
  padding: 16px 16px calc(104px + env(safe-area-inset-bottom));
}
.screen { display: none; }
.screen.on { display: block; animation: pop .22s ease; }
@keyframes pop {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

/* ---------- nav du bas ---------- */
.tabbar {
  position: fixed;
  bottom: calc(10px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  width: min(100% - 20px, 540px);
  z-index: 30;
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 7px 6px;
  border-radius: 26px;
  background: color-mix(in srgb, var(--panel) 86%, transparent);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  box-shadow: var(--shadow), 0 18px 44px -18px rgba(9, 11, 30, .45);
}
.tabbar::-webkit-scrollbar { display: none; }
.tab {
  border: 0;
  background: none;
  font-family: var(--f-round);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border-radius: var(--r-sm);
  color: var(--ink-faint);
  font-size: 9.5px;
  font-weight: 700;
  cursor: pointer;
  flex: 1 0 auto;
  min-width: 46px;
}
.tab { transition: background .15s ease; }
.tab .ico { font-size: 20px; line-height: 1; filter: grayscale(1) opacity(.55); transition: filter .15s, transform .15s; }
.tab.on {
  color: var(--ink);
  background: var(--panel-2);
  box-shadow: inset 0 0 0 1px var(--line);
}
.tab.on .ico { filter: none; transform: scale(1.12); }

/* ============================================================
   COMPOSANTS
   ============================================================ */
h2.screen-title {
  font-family: var(--f-disp);
  font-size: 32px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin: 4px 0 16px;
}
h2.screen-title span { font-size: 22px; margin-right: 7px; }
h2.screen-title::after {
  content: "";
  display: block;
  width: 52px;
  height: 3.5px;
  border-radius: 2px;
  margin-top: 7px;
  background: linear-gradient(90deg, var(--gold), transparent);
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 14px;
}
.card h3 {
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 800;
}
.card p { margin: 0 0 8px; font-size: 14px; color: var(--ink-soft); }
.card p:last-child { margin-bottom: 0; }
.card ul { margin: 0; padding-left: 18px; }
.card li { font-size: 14px; color: var(--ink-soft); margin-bottom: 7px; }
.card li b { color: var(--ink); }
.card li:last-child { margin-bottom: 0; }

/* ---------- en-tête de jour (dégradé) ---------- */
.dayhero {
  border-radius: var(--r-lg);
  padding: 18px;
  color: var(--on-grad);
  box-shadow: var(--shadow);
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}
.dayhero[data-p="1"] { background: linear-gradient(135deg, var(--g1a), var(--g1b)); }
.dayhero[data-p="2"] { background: linear-gradient(135deg, var(--g2a), var(--g2b)); }
.dayhero[data-p="3"] { background: linear-gradient(135deg, var(--g3a), var(--g3b)); }
.dayhero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(440px 190px at 88% -25%, rgba(255,255,255,.30), transparent 70%), var(--grain);
  pointer-events: none;
}
.dayhero::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 44px;
  background: var(--skyline) bottom / 100% 100% no-repeat;
  pointer-events: none;
}
.dayhero .big-emoji {
  position: absolute;
  right: -2px; bottom: 2px;
  font-size: 78px;
  opacity: .30;
  transform: rotate(-8deg);
  z-index: 1;
}
.dayhero > *:not(.big-emoji) { position: relative; z-index: 1; }
.dayhero .kicker {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .14em;
  opacity: .85;
}
.dayhero h3 {
  margin: 3px 0 2px;
  font-family: var(--f-disp);
  font-size: 27px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .03em;
}
.dayhero .sub { font-size: 13px; opacity: .9; font-weight: 600; }
.dayhero .done-pill {
  display: inline-block;
  margin-top: 10px;
  font-size: 12px;
  font-weight: 800;
  background: rgba(255,255,255,.22);
  border-radius: 999px;
  padding: 4px 12px;
}

/* ---------- filtres + vue globale ---------- */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 12px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--f-round);
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-soft);
  background: var(--panel);
  border: 1.5px solid var(--line);
  padding: 6px 11px 6px 9px;
  border-radius: 999px;
  cursor: pointer;
}
.chip::before {
  content: "";
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--dot, var(--ink-faint));
  flex: 0 0 auto;
}
.chip.reset::before { display: none; }
.chip[aria-pressed="true"] {
  border-color: var(--dot, var(--ink));
  background: color-mix(in srgb, var(--dot, var(--ink)) 14%, var(--panel));
  color: var(--ink);
  box-shadow: 0 3px 10px -4px var(--dot, var(--ink));
}
.seg {
  display: flex;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  margin-bottom: 12px;
  width: fit-content;
}
.seg button {
  border: 0;
  background: none;
  font-family: var(--f-round);
  font-weight: 800;
  font-size: 12.5px;
  padding: 7px 16px;
  border-radius: 999px;
  color: var(--ink-faint);
  cursor: pointer;
}
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.mini-day {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 20px 2px 10px;
}
.mini-day .me { font-size: 18px; }
.mini-day .n { font-weight: 900; font-size: 15px; white-space: nowrap; }
.mini-day .d { font-size: 12px; color: var(--ink-faint); font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-day::after { content: ""; flex: 1; height: 2.5px; border-radius: 2px; background: var(--pc, var(--line)); opacity: .45; min-width: 14px; }
.mini-day:has(.dnavs)::after { display: none; }
.dnavs { margin-left: auto; display: flex; gap: 6px; flex: none; }
.dnavb {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.dnavb:active { transform: scale(.94); }

/* ---------- vue horaire (type Google Calendar) ---------- */
.tl {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 12px;
}
.tlh {
  height: 56px;
  border-top: 1px solid var(--line);
  position: relative;
}
.tlh:first-child { border-top: 0; }
.tlh span {
  position: absolute;
  top: -8px;
  left: 8px;
  font-family: var(--f-data);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-faint);
  background: var(--panel);
  padding: 0 4px;
}
.tlb {
  position: absolute;
  left: 52px;
  right: 8px;
  background: var(--cat, var(--ink-faint));
  color: var(--on-cat);
  border-radius: 10px;
  padding: 5px 9px;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 2px 8px -3px rgba(9, 11, 30, .4);
  border: 0;
  text-align: left;
  font-family: var(--f-round);
  line-height: 1.25;
}
.tlb .tltime {
  display: block;
  font-family: var(--f-data);
  font-size: 10px;
  font-weight: 700;
  opacity: .85;
}
.tlb b { font-size: 12.5px; font-weight: 800; display: block; }
.tlb.sm .tltime { display: none; }
.tlb.sm b { font-size: 11.5px; }
.tlb.done { opacity: .45; }
.tlb.done b { text-decoration: line-through; }
.tlb:active { transform: scale(.985); }
.tlb.lane1 { left: 52%; box-shadow: 0 2px 10px -2px rgba(9,11,30,.5); }
.twb.lane1 { left: 42%; z-index: 2; }

/* ---------- vue semaine ---------- */
.twhead { display: flex; gap: 3px; margin-bottom: 6px; }
.twhead .twgut, .tw .twgut { width: 34px; flex: 0 0 34px; position: relative; }
.twd {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  border-top: 3px solid var(--pc, var(--line));
  background: var(--panel);
  border-radius: 10px;
  padding: 5px 2px 4px;
  text-align: center;
  cursor: pointer;
  font-family: var(--f-round);
  color: var(--ink);
}
.twd span { display: block; font-size: 9px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; }
.twd b { font-size: 13px; font-weight: 900; }
.tw {
  display: flex;
  gap: 3px;
  position: relative;
  background: var(--panel);
  background-image: repeating-linear-gradient(to bottom,
    color-mix(in srgb, var(--line) 60%, transparent) 0 1px, transparent 1px 44px);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 10px;
}
.tw .twgut span {
  position: absolute;
  left: 3px;
  font-family: var(--f-data);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--ink-faint);
  background: var(--panel);
  padding: 0 2px;
}
.twc {
  flex: 1;
  position: relative;
  min-width: 0;
  border-left: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
}
.twb {
  position: absolute;
  left: 1px; right: 1px;
  border: 0;
  border-radius: 6px;
  background: var(--cat, var(--ink-faint));
  color: var(--on-cat);
  padding: 2px 3px;
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  font-family: var(--f-round);
}
.twb span {
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 8.5px;
  font-weight: 800;
  line-height: 1.2;
}
.twb.done { opacity: .4; }
.twb.done span { text-decoration: line-through; }

/* ---------- sélecteur de jours ---------- */
.daypick {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 12px;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.daypick::-webkit-scrollbar { display: none; }
.dp {
  flex: 0 0 auto;
  scroll-snap-align: center;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 14px;
  padding: 8px 10px 7px;
  min-width: 54px;
  text-align: center;
  cursor: pointer;
  font-family: var(--f-round);
  color: var(--ink);
}
.dp .e { font-size: 18px; display: block; }
.dp .n { font-size: 14px; font-weight: 900; display: block; margin-top: 1px; }
.dp .d { font-size: 9.5px; font-weight: 700; color: var(--ink-faint); display: block; }
.dp { transition: transform .12s ease, border-color .12s ease; }
.dp:active { transform: scale(.94); }
.dp.on { border-width: 2px; box-shadow: var(--shadow); }
.dp.on[data-p="1"] { border-color: var(--g1a); background: color-mix(in srgb, var(--g1a) 12%, var(--panel)); }
.dp.on[data-p="2"] { border-color: var(--g2b); background: color-mix(in srgb, var(--g2b) 12%, var(--panel)); }
.dp.on[data-p="3"] { border-color: var(--g3a); background: color-mix(in srgb, var(--g3a) 12%, var(--panel)); }
.dp.alldone .e::after { content: " ✅"; font-size: 11px; }

/* ---------- items ---------- */
.item {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  gap: 4px 10px;
  align-items: start;
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 5px solid var(--cat, var(--line));
  border-radius: var(--r-md);
  box-shadow: var(--shadow);
  padding: 12px 12px 12px 10px;
  margin-bottom: 10px;
}
.item .chk {
  width: 26px; height: 26px;
  margin-top: 1px;
  appearance: none;
  -webkit-appearance: none;
  border: 2.5px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: border-color .15s, background .15s, transform .1s;
}
.item .chk:active { transform: scale(.88); }
.item .chk:checked {
  background: var(--c-air);
  border-color: var(--c-air);
  animation: popchk .28s ease;
}
@keyframes popchk {
  0% { transform: scale(.8); }
  45% { transform: scale(1.22); }
  100% { transform: scale(1); }
}
.item .chk:checked::after {
  content: "✓";
  color: #fff;
  font-size: 15px;
  font-weight: 900;
}
.item .body { min-width: 0; }
.item .h {
  font-family: var(--f-data);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-faint);
  letter-spacing: .02em;
}
.item .t { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.item .n { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.item .n.warn { color: var(--warn); font-weight: 600; }
.item.done { opacity: .5; }
.item.done .t { text-decoration: line-through; }
.price {
  font-family: var(--f-data);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--panel-2);
  color: var(--ink-soft);
  white-space: nowrap;
  align-self: start;
}
.price.free { background: color-mix(in srgb, var(--c-air) 16%, var(--panel)); color: var(--ok); }
.price.pass { background: color-mix(in srgb, var(--c-musee) 16%, var(--panel)); color: var(--c-musee); }

.lnk {
  display: inline-block;
  margin-top: 7px;
  font-size: 12px;
  font-weight: 800;
  color: var(--c-musee);
  text-decoration: none;
  border: 1.5px solid color-mix(in srgb, var(--c-musee) 40%, var(--line));
  border-radius: 999px;
  padding: 4px 11px;
  background: color-mix(in srgb, var(--c-musee) 10%, var(--panel));
}
.lnk:active { transform: scale(.97); }
.lnk.lnkmap {
  color: var(--c-archi);
  border-color: color-mix(in srgb, var(--c-archi) 40%, var(--line));
  background: color-mix(in srgb, var(--c-archi) 10%, var(--panel));
  margin-left: 6px;
}
.tt {
  font-family: var(--f-data);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--c-air);
  margin-top: 5px;
}

/* ---------- ligne « maintenant » + fiche événement (façon Google Agenda) ---------- */
.tlnow, .twnow {
  position: absolute;
  left: 0; right: 0;
  height: 0;
  border-top: 2px solid #ea4335;
  z-index: 5;
  pointer-events: none;
}
.tlnow::before, .twnow::before {
  content: "";
  position: absolute;
  left: 0; top: -6px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #ea4335;
}
.tlnow span {
  position: absolute;
  right: 4px; top: -19px;
  font-family: var(--f-data);
  font-size: 10px;
  font-weight: 800;
  color: #ea4335;
  background: var(--panel);
  border: 1px solid #ea4335;
  border-radius: 8px;
  padding: 1px 6px;
}
.twd.today { box-shadow: inset 0 0 0 2px #ea4335; }
.tdy { width: 100%; }
.tlb, .twb {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
.tlb.drag, .twb.drag {
  z-index: 30;
  opacity: .93;
  transform-origin: center;
  box-shadow: 0 14px 30px -6px rgba(9, 11, 30, .55);
  outline: 2px solid var(--panel);
  transition: none;
}
#dragBadge {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  z-index: 90;
  background: var(--ink);
  color: var(--panel);
  font-family: var(--f-data);
  font-weight: 800;
  font-size: 15px;
  padding: 8px 16px;
  border-radius: 999px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
  transition: transform .18s;
  pointer-events: none;
}
#dragBadge.show { transform: translateX(-50%) translateY(0); }
.shwrap {
  position: fixed;
  inset: 0;
  background: rgba(9, 11, 30, .45);
  z-index: 80;
  display: flex;
  align-items: flex-end;
  animation: shFade .18s ease-out;
}
@keyframes shFade { from { opacity: 0 } }
.sheet {
  background: var(--panel);
  color: var(--ink);
  border-radius: 22px 22px 0 0;
  padding: 13px 18px calc(22px + env(safe-area-inset-bottom, 0px));
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  box-shadow: 0 -14px 44px rgba(0, 0, 0, .3);
  animation: shUp .22s ease-out;
  max-height: 78vh;
  overflow-y: auto;
}
@keyframes shUp { from { transform: translateY(46px); opacity: 0 } }
.sh-grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sh-head {

  { e:"🧄", y:"1780", g:0, t:"Un marécage qui sentait l'ail", x:"Le nom vient du miami-illinois « <b>shikaakwa</b> » : l'ail sauvage qui poussait dans le marécage puant au bord du lac. Premier habitant permanent vers 1780 : <b>Jean Baptiste Point du Sable</b>, commerçant noir francophone né à Saint-Domingue (l'actuelle Haïti), qui monte un comptoir prospère à l'embouchure de la rivière avec sa femme potawatomie Kitihawa. La troisième ville des États-Unis a donc été fondée par un Haïtien qui parlait français. Son buste t'attend au pied du pont de Michigan Avenue, et la grande avenue du lac s'appelle officiellement <b>DuSable Lake Shore Drive</b> depuis 2021." },
  { e:"🏰", y:"1812", g:0, t:"Fort Dearborn, l'an zéro sanglant", x:"En 1803, l'armée plante un fortin de rondins au bord de la rivière : <b>Fort Dearborn</b>. Guerre de 1812 : la garnison évacue le 15 août et la colonne — soldats, femmes, enfants — est attaquée sur la plage quelques kilomètres au sud. 68 morts, le fort brûlé. On l'a reconstruit, démoli, puis oublié… sauf que des <b>clous de laiton scellés dans le trottoir</b> au croisement Michigan × Wacker dessinent encore son emplacement exact. Tu marcheras dessus dix fois sans le savoir — au pied du pont, regarde par terre." },
  { e:"🚂", y:"1848", g:0, t:"L'année où tout s'emballe", x:"1848, tout arrive en même temps : le <b>canal Illinois & Michigan</b> relie enfin les Grands Lacs au Mississippi, le premier train siffle, le télégraphe grésille, et le <b>Board of Trade</b> ouvre — on y invente les <b>contrats à terme</b> (acheter la récolte avant qu'elle ne pousse), toujours la base de la finance mondiale. Résultat : 30 000 habitants en 1850, 300 000 en 1870, <b>1,7 million en 1900</b>. La croissance urbaine la plus folle de l'histoire moderne : Chicago n'a pas grandi, elle a explosé." },

  { e:"🔥", y:"1871", g:1, t:"La ville qui a brûlé en entier", x:"Le 8 octobre 1871, un incendie part d'une étable et dévore Chicago pendant deux jours : 300 morts, 100 000 sans-abri, 9 km² de cendres. La légende accuse la vache de Mme O'Leary d'avoir renversé une lanterne — la pauvre bête a été officiellement <b>innocentée par le conseil municipal… en 1997</b>. Presque tout a brûlé, sauf une poignée de bâtiments dont la <b>Water Tower</b> que tu verras le 4 septembre. Et c'est ce désastre qui a tout déclenché : une ville neuve, dessinée par les meilleurs architectes du pays." },
  { e:"🏗️", y:"1885", g:1, t:"Pourquoi tous ces gratte-ciel", x:"Reconstruire vite, sur un sol marécageux, avec des terrains hors de prix : la solution était de monter. En 1885, Chicago érige le <b>premier gratte-ciel du monde</b> (le Home Insurance Building, ossature d'acier). La « Chicago School » invente ici l'immeuble moderne, puis Frank Lloyd Wright, Mies van der Rohe et les autres prennent la suite. Ta <b>croisière du 9 septembre</b> est littéralement une visite du musée où tout ça a été inventé — les guides te montreront la Willis (ton Skydeck) et le Hancock (ton 360)." },
  { e:"💣", y:"1886", g:1, t:"Haymarket : pourquoi ton 1er mai est férié", x:"4 mai 1886 : un meeting ouvrier pour la <b>journée de 8 heures</b> tourne au drame place Haymarket — une bombe, des tirs, des morts des deux côtés, puis quatre anarchistes pendus après un procès que l'histoire jugera truqué. En leur mémoire, le monde entier fait du <b>1er mai</b> la fête des travailleurs… sauf les États-Unis, qui l'ont déplacée en septembre pour tourner la page. Ton jour férié du 1er mai vient donc d'un carrefour de Chicago. Huit ans plus tard, la <b>grève Pullman</b> (1894) partira d'ici aussi et paralysera tout le rail américain." },
  { e:"🌬️", y:"1890", g:1, t:"« Windy City » ne parle pas (que) du vent", x:"Le surnom viendrait moins de la météo que des journalistes de New York moquant les <b>politiciens « pleins de vent »</b> de Chicago dans les années 1890, quand la ville faisait campagne pour accueillir l'Exposition universelle. Cela dit, le vent du lac existe très bien — c'est pour lui que ta valise contient un coupe-vent et zéro parapluie." },
  { e:"🎡", y:"1893", g:1, t:"La White City et la première grande roue", x:"Pour éblouir le monde, Chicago construit une ville blanche éphémère : l'<b>Exposition universelle de 1893</b>, 27 millions de visiteurs. On y invente la <b>grande roue</b> (M. Ferris, pour rivaliser avec la tour Eiffel), le zip, le chewing-gum Juicy Fruit. Le <b>Griffin Museum de ton 10 septembre est le dernier palais encore debout</b>, et la Centennial Wheel de Navy Pier (ton dernier jour) est l'hommage direct à la roue originale." },
  { e:"😈", y:"1893", g:1, t:"H.H. Holmes, le diable de la White City", x:"Pendant que 27 millions de visiteurs s'émerveillent à la foire, un certain <b>H.H. Holmes</b> tient à Englewood, à quelques kilomètres, un « hôtel » très particulier : couloirs sans issue, portes qui ne s'ouvrent que de l'extérieur, cave équipée de fours. Il avouera <b>27 meurtres</b> — surtout des jeunes femmes venues seules pour l'Expo — et passe pour le premier tueur en série américain identifié. Son histoire croisée avec celle de la foire a donné le best-seller « <b>The Devil in the White City</b> ». À méditer en visitant le Griffin, dernier vestige de cette foire-là…" },
  { e:"🔄", y:"1900", g:2, t:"Le fleuve qu'on a inversé", x:"En 1900, Chicago réalise un des plus gros chantiers du siècle : <b>inverser le sens de sa rivière</b>, pour que les égouts arrêtent de couler vers le lac… où la ville puisait son eau potable. Depuis, la Chicago River tourne le dos au lac Michigan. Bonus : chaque Saint-Patrick, on la teint en <b>vert fluo</b>. C'est sur cette rivière inversée que tu navigueras le 9 septembre, à l'heure dorée." },
  { e:"⛴️", y:"1915", g:2, t:"L'Eastland : un naufrage… à quai", x:"24 juillet 1915 : l'<b>Eastland</b>, paquebot d'excursion bourré pour le pique-nique annuel de Western Electric, se retourne <b>à quai</b>, dans six mètres d'eau, entre les ponts Clark et LaSalle. <b>844 morts</b> — plus de passagers que sur le Titanic — à vingt mètres du trottoir. Cause probable : le navire avait été alourdi de canots de sauvetage supplémentaires… imposés après le Titanic. Une plaque discrète sur la Riverwalk marque l'endroit : tu passeras devant en croisière le 9 septembre." },
  { e:"🎷", y:"1916", g:3, t:"Le blues se branche sur ampli", x:"Entre 1916 et 1970, la <b>Grande Migration</b> amène des centaines de milliers d'Afro-Américains du Sud vers Chicago. Le blues du Delta arrive avec eux — et ici, il se joue en ville, dans le bruit : il faut des amplis. Muddy Waters électrifie le genre, les studios <b>Chess Records</b> (2120 S. Michigan Ave) enregistrent tout ce qui compte, et les Rolling Stones viendront y prier en 1964. Le jazz, lui, tourne au Green Mill depuis 1907 — sans interruption, Prohibition comprise." },
  { e:"🥃", y:"1920", g:3, t:"La Prohibition, l'aubaine d'Al Capone", x:"L'Amérique interdit l'alcool (1920-1933), Chicago décide de ne pas être d'accord. Al Capone, arrivé de Brooklyn à 20 ans, bâtit un empire de contrebande à <b>60 millions de dollars par an</b> — bars clandestins, corruption généralisée, la moitié de la police sur sa fiche de paie. Son QG de repli préféré : le <b>Green Mill</b>, où il avait sa banquette en coin, face aux deux portes. Tu passeras voir sa façade néon le 9 septembre — l'intérieur, réservé aux 21 ans et plus, attendra un prochain voyage." },

  { e:"🕵️", y:"1934", g:3, t:"Dillinger et la dame en rouge", x:"John Dillinger, braqueur de banques star et « ennemi public n°1 », nargue le FBI pendant des mois — évasions, fusillades, lettres aux journaux. Le 22 juillet 1934, il sort d'un cinéma de Lincoln Avenue, le <b>Biograph Theater</b>, trahi par une amie en robe orange (la légende dira « rouge »). Le FBI l'attend. Le Biograph existe toujours, à dix minutes de ton hôtel de la phase 3." },
  { e:"⚛️", y:"1942", g:3, t:"Une pile atomique sous les gradins", x:"2 décembre 1942, dans un ancien court de squash <b>sous les gradins du stade</b> de l'université de Chicago, à Hyde Park : Enrico Fermi et son équipe déclenchent la <b>première réaction nucléaire en chaîne contrôlée</b> de l'histoire — Chicago Pile-1, un simple empilement de graphite et d'uranium, sans blindage, en pleine ville. Message codé envoyé à Washington : « Le navigateur italien vient d'accoster dans le nouveau monde. » L'ère atomique est née à 3 km de ton Griffin Museum du 10 septembre — une sculpture de Henry Moore marque l'endroit exact." },
  { e:"🍕", y:"1943", g:3, t:"Deep dish, italian beef : la cuisine des ouvriers", x:"1943 : Pizzeria Uno invente la <b>deep dish</b>, une pizza-casserole pensée pour nourrir un ouvrier avec une part. L'<b>italian beef</b> vient des mariages italiens des années 1930 : peu de viande, beaucoup d'invités, donc du bœuf tranché fin et trempé de jus pour « l'étirer ». Et le hot dog de Chicago se commande « dragged through the garden » (traîné dans le jardin) — tout dessus, <b>sauf le ketchup</b>, considéré ici comme un crime alimentaire." },
  { e:"🐐", y:"1945", g:3, t:"La malédiction de la chèvre", x:"1945, finale de baseball : Billy Sianis, patron de taverne, se fait expulser de Wrigley Field à cause de l'odeur de sa chèvre Murphy. Furieux, il maudit les Cubs : « <b>Ils ne gagneront plus jamais</b> ». Les Cubs ne regagneront le titre qu'en… <b>2016</b>, après 108 ans de disette — la plus longue de l'histoire du sport américain. Le stade où tu vas le 2 septembre est celui de 1914 : lierre planté en 1937, tableau d'affichage encore tourné à la main." },
  { e:"🤵", y:"1957", g:4, t:"L'Outfit : la mafia discrète qui tenait Las Vegas", x:"Après Alcatraz, l'empire de Capone ne meurt pas : il devient l'« <b>Outfit</b> », plus discret et plus riche que les familles new-yorkaises. <b>Tony Accardo</b>, dit « Joe Batters » (surnom offert par Capone pour son talent… à la batte de baseball), le dirige un demi-siècle <b>sans passer une seule nuit en prison</b>. L'Outfit écrème les casinos de Las Vegas — la véritable histoire du film « Casino » — et place <b>Sam Giancana</b>, dont la légende raconte qu'il partageait une petite amie avec le président Kennedy. Ton Crime Tour du 8 septembre t'en racontera les meilleures pages." },
  { e:"🪧", y:"1968", g:4, t:"Daley, la Machine et l'été 68", x:"<b>Richard J. Daley</b>, maire de 1955 à sa mort en 1976, règne par « la Machine » : des dizaines de milliers d'emplois municipaux échangés contre des votes, une loyauté de fer. En 1966, <b>Martin Luther King</b> s'installe à Chicago pour dénoncer la ségrégation immobilière et déclare n'avoir « jamais vu de foules aussi hostiles, même dans le Mississippi ». Août 1968 : la convention démocrate tourne à l'émeute en mondovision devant le Hilton de Michigan Avenue — à 600 m de ta résidence. Son fils Richard M. dirigera ensuite la ville 22 ans : record familial battu." },
  { e:"🏢", y:"1973", g:4, t:"Sears Tower : 25 ans sur le toit du monde", x:"1973 : Sears, alors plus grand commerçant du monde, s'offre la plus haute tour du monde — <b>442 mètres</b>, grâce à une astuce d'ingénierie toute neuve : neuf « tubes » d'acier de hauteurs différentes solidaires les uns des autres, comme un fagot. Elle restera <b>25 ans</b> le toit de la planète. Sears est parti, tout Chicago dit encore « Sears Tower » — officiellement c'est la <b>Willis Tower</b>, et son Skydeck du 103e étage avec ses cages de verre au-dessus du vide, c'est TON mardi 8 septembre, au coucher du soleil." },
  { e:"🎧", y:"1977", g:4, t:"La house music est née ici", x:"Fin des années 1970, un club au 206 S. Jefferson Street : <b>The Warehouse</b>. Aux platines, Frankie Knuckles mixe disco, soul et boîtes à rythmes jusqu'à inventer un son que les disquaires du coin étiquettent « <b>house</b> » — la musique du Warehouse. De Chicago, elle conquerra Detroit, Londres, Ibiza, le monde. La ville a inventé la musique sur laquelle la planète danse encore tous les samedis soir." },
  { e:"🎬", y:"1986", g:4, t:"Chicago, star de cinéma", x:"La ville est une actrice : la poursuite en voiture des <b>Blues Brothers</b> dans un vrai centre commercial, <b>Ferris Bueller</b> qui sèche les cours à l'Art Institute et au Skydeck, <b>Maman, j'ai raté l'avion</b> dans la banlieue nord — et Gotham City, c'est ici : la poursuite en Batpod de « <b>The Dark Knight</b> » file sur Lower Wacker Drive, la rue cachée SOUS les rues que tu longeras sans la voir. Si un coin de rue te semble déjà vu, c'est normal." },
  { e:"🏀", y:"1991", g:4, t:"Jordan : six titres et une statue", x:"Années 90 : <b>Michael Jordan</b> et les Bulls écrasent la NBA — <b>six titres en huit ans</b>, deux triplés, 72 victoires en une saison, et un documentaire-monument (« The Last Dance »). Sa statue devant le United Center est un lieu de pèlerinage mondial. Même décennie, même ville : <b>Oprah Winfrey</b> tourne son show à Chicago pendant 25 ans. Dans les années 90, la ville était à la fois la capitale du basket et celle de la télévision." },
  { e:"🌊", y:"1992", g:4, t:"Le jour où le Loop a été inondé… par en dessous", x:"13 avril 1992 : un pieu planté dans le lit de la rivière perce un <b>ancien tunnel de fret oublié</b>, et des centaines de millions de litres d'eau envahissent les sous-sols du Loop par un réseau de galeries du début du siècle que presque plus personne ne connaissait. <b>Pas une goutte en surface</b> : la ville est inondée par en dessous. Bourse fermée, dégâts colossaux — et l'Amérique découvre que Chicago cache ~100 km de tunnels à 12 m sous les trottoirs que tu arpenteras." },
  { e:"🫘", y:"2004", g:5, t:"Millennium Park et le Bean", x:"Un dépôt ferroviaire à ciel ouvert en plein centre → le plus beau parc urbain d'Amérique. <b>Millennium Park</b> ouvre en 2004, avec 4 ans de retard et un budget triplé (plus personne ne s'en souvient) : pavillon de concert signé Gehry, Crown Fountain qui crache l'eau par des visages géants, et « <b>Cloud Gate</b> » d'Anish Kapoor — 110 tonnes d'acier poli sans une soudure visible, que la planète entière appelle <b>The Bean</b>. Ton passage du 30 août : cherche le point sous l'arche où tu te vois réfléchi huit fois." },

  { e:"🎓", y:"1962", g:6, t:"Oxford : Faulkner, et la nuit de 1962", x:"Côté Mississippi : <b>William Faulkner</b>, prix Nobel 1949, écrivait le plan de ses romans directement sur les murs de son bureau — sa maison Rowan Oak, dans un bois de cèdres à 15 min de la Square, se visite (~9 €) si l'envie te prend le 6. Et le 30 septembre 1962, Ole Miss vit la nuit la plus grave de son histoire : des émeutes ségrégationnistes éclatent contre l'inscription de <b>James Meredith, premier étudiant noir</b> de l'université. Deux morts, des centaines de blessés, Kennedy envoie l'armée. Les colonnes du <b>Lyceum</b>, devant lequel tu passeras le 5, portent encore les impacts de balles. The Grove, lui, reste le tailgating le plus élégant du Sud — nappes blanches et chandeliers sous les chênes." }

/* ============================================================
   ÉTAT — moteur de sauvegarde à 3 niveaux
   1. localStorage (testé réellement, pas juste supposé)
   2. cookies (si localStorage est bloqué par le bac à sable)
   3. mémoire seule + alerte et export/import manuel
   ============================================================ */
var LS_OK = (function () {
  try {
    localStorage.setItem("chi26:t", "1");
    var ok = localStorage.getItem("chi26:t") === "1";
    localStorage.removeItem("chi26:t");
    return ok;
  } catch (e) { return false; }
})();

/* Les cookies posés sur le domaine parent survivent aux republications
   de l'appli (qui changent l'origine du cadre) — c'est la copie durable. */
var COOKIE_DOMAIN = (function () {
  try {
    var h = location.hostname.split(".");
    if (h.length >= 3) return "; domain=." + h.slice(1).join(".");
  } catch (e) {}
  return "";
})();

/* Payload cookie en base64 : ~3× plus compact que l'encodage %XX pour les
   accents français, donc bien plus de place pour les notes. Les anciens
   cookies (encodage %XX) restent lisibles. */
function encPayload(raw) {
  try { return "b64:" + btoa(unescape(encodeURIComponent(raw))); }
  catch (e) { return encodeURIComponent(raw); }
}
function decPayload(s) {
  try {
    if (s.indexOf("b64:") === 0) return decodeURIComponent(escape(atob(s.slice(4))));
    return decodeURIComponent(s);
  } catch (e) { return null; }
}

function readCookieRaw() {
  try {
    var out = "";
    for (var i = 0; i < 12; i++) {
      var m = document.cookie.match(new RegExp("(?:^|;\\s*)chi26p" + i + "=([^;]*)"));
      if (!m || !m[1]) break;
      out += m[1];
    }
    return out ? decPayload(out) : null;
  } catch (e) { return null; }
}

function writeCookieChunks(enc, domain) {
  var CH = 3500;
  var n = Math.ceil(enc.length / CH) || 0;
  if (n > 12) return false;
  for (var i = 0; i < 12; i++) {
    var part = i < n ? enc.slice(i * CH, (i + 1) * CH) : "";
    document.cookie = "chi26p" + i + "=" + part + "; path=/; SameSite=Lax; max-age=" + (part ? 31536000 : 0) + domain;
  }
  return true;
}

function writeCookieRaw(raw) {
  try {
    var enc = encPayload(raw);
    writeCookieChunks(enc, COOKIE_DOMAIN);
    if (readCookieRaw() === raw) return true;
    writeCookieChunks(enc, "");
    return readCookieRaw() === raw;
  } catch (e) { return false; }
}

var CK_OK = (function () {
  var existing = readCookieRaw();
  return writeCookieRaw(existing !== null ? existing : "chi26probe");
})();

var BACKEND = LS_OK ? "local" : (CK_OK ? "cookie" : "mem");

var DB = { done: {}, prep: {}, pass: {}, pack: {}, food: {}, shop: {}, notes: {}, prices: {}, edits: {}, hidden: {}, added: {}, gadd: {}, ghide: {}, resa: {}, walk: {}, spend: [], paid: null, theme: null };

function parseCand(raw) {
  if (!raw) return null;
  try {
    var o = JSON.parse(raw);
    return o && typeof o === "object" ? o : null;
  } catch (e) { return null; }
}

function loadDB() {
  var cands = [];
  try { cands.push(parseCand(localStorage.getItem("chi26:db"))); } catch (e) {}
  cands.push(parseCand(readCookieRaw()));
  /* sauvegarde embarquée DANS la page elle-même (survit à tout) */
  try {
    var emb = document.getElementById("dbsave");
    if (emb) cands.push(parseCand(emb.textContent.trim()));
  } catch (e) {}
  try {
    var legacy = {};
    ["done", "prep", "pass", "pack", "food", "shop", "notes", "prices"].forEach(function (k) {
      var v = localStorage.getItem("chi26:" + k);
      if (v) legacy[k] = JSON.parse(v);
    });
    if (Object.keys(legacy).length) cands.push(legacy);
  } catch (e) {}
  var best = null;
  cands.forEach(function (c) {
    if (c && (!best || (+c.ts || 0) >= (+best.ts || 0))) best = c;
  });
  if (!best) return;
  ["done", "prep", "pass", "pack", "food", "shop", "notes", "prices", "edits", "hidden", "added", "gadd", "ghide", "resa", "walk"].forEach(function (k) {
    if (best[k] && typeof best[k] === "object" && !Array.isArray(best[k])) DB[k] = best[k];
  });
  if (Array.isArray(best.spend)) DB.spend = best.spend;
  if (best.paid && typeof best.paid === "object") DB.paid = best.paid;
  if (best.theme) DB.theme = best.theme;
}

/* état réel de la DERNIÈRE sauvegarde (pas juste le test du démarrage) */
var SAVE_LS = LS_OK, SAVE_CK = CK_OK, saveWarned = false;

function saveDB() {
  DB.ts = Date.now();
  var raw = JSON.stringify(DB);
  SAVE_LS = false;
  try {
    localStorage.setItem("chi26:db", raw);
    SAVE_LS = localStorage.getItem("chi26:db") === raw;
  } catch (e) {}
  SAVE_CK = writeCookieRaw(raw);
  if (!SAVE_LS && !SAVE_CK && !saveWarned) {
    saveWarned = true;
    try { toast("⚠️ Enregistrement local bloqué — garde la page ouverte quelques secondes, la copie en ligne prend le relais"); } catch (e) {}
  }
  scheduleArtSave();
}

/* ============================================================
   SAUVEGARDE EN LIGNE — la page réécrit sa propre version publiée
   (capacité « artifact ») : l'état est gravé dans la page, il survit
   à la fermeture, aux mises à jour de l'appli et au changement
   d'appareil. localStorage + cookies restent la copie instantanée.
   ============================================================ */
var artCap = null, artSrc = null, artDirty = false, artTimer = null, artBusy = false;
var ART_OK = null; /* null = pas encore su, true = ok, false = indispo ici */

(function () {
  try {
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("artifact").then(function (ns) { artCap = ns || null; if (!ns) ART_OK = false; },
        function () { ART_OK = false; });
    } else { ART_OK = false; }
  } catch (e) { ART_OK = false; }
})();

function artSource() {
  if (artSrc) return Promise.resolve(artSrc);
  return fetch(location.href).then(function (r) {
    if (!r.ok) throw new Error("http " + r.status);
    return r.text();
  }).then(function (t) {
    if (t.indexOf('id="dbsave"') === -1 || t.indexOf("chi26:db") === -1) throw new Error("source inattendue");
    artSrc = t;
    return t;
  });

function editingNow() {

var appReady = false;

function scheduleArtSave() {
  if (!appReady) return; /* pas de publication pour la normalisation du démarrage */
  artDirty = true;
  if (artTimer) clearTimeout(artTimer);
  artTimer = setTimeout(function () { artSave(false); }, 8000);
}

function artSave(force) {
  if (!artCap || !artDirty || artBusy) return;
  if (!force && editingNow()) { artTimer = setTimeout(function () { artSave(false); }, 8000); return; }
  artBusy = true;
  artSource().then(function (src) {
    var json = JSON.stringify(DB).replace(/</g, "\\u003c");
    var html = src.replace(
      /(<script type="application\/json" id="dbsave">)[\s\S]*?(<\/script>)/,
      function (_, a, b) { return a + json + b; }
    );
    try {
      var tabEl = document.querySelector(".tab.on");
      sessionStorage.setItem("chi26:resume", JSON.stringify({
        tab: tabEl ? tabEl.dataset.scr : null,
        day: curDay, pv: planView, tm: tlMode, tw: tlWeek,
        acc: accOpen, sy: window.pageYOffset || 0
      }));
    } catch (e) {}
    return artCap.publish(html);
  }).then(function () {
    artDirty = false;
    artBusy = false;
    ART_OK = true;
    /* la vue se recharge toute seule sur la nouvelle version */
  }, function (err) {
    artBusy = false;
    var code = err && err.code;
    if (code === "conflict") { artDirty = false; ART_OK = true; }
    else if (code === "rate_limited") { artTimer = setTimeout(function () { artSave(false); }, 45000); }
    else if (code === "not_granted" || code === "not_writer" || code === "not_declared" ||
             code === "capability_disabled" || code === "capability_removed" || code === "consent_required") {
      ART_OK = false; artCap = null;
    } else { ART_OK = false; }
  });
}

function mapsUrl(day, it) {

function linkLabel(it) {

var editItem = null;

function dayItems(day) {
  var arr = [];
  day.items.forEach(function (base, i) {
    var uid = "d" + day.d + "-" + i;
    if (DB.hidden[uid]) return;
    var it = DB.edits[uid] ? Object.assign({}, base, DB.edits[uid]) : base;
    arr.push({ it: it, uid: uid });
  });
  (DB.added[day.d] || []).forEach(function (c, i) {
    if (!c) return; /* emplacement vidé par un déplacement de jour */
    var uid = "a" + day.d + "-" + i;
    if (DB.hidden[uid]) return;
    arr.push({ it: c, uid: uid, custom: true });
  });
  /* tri par horaire, pour que la liste suive les déplacements ;
     un item sans heure reste collé après son prédécesseur */
  var last = -1;
  arr.forEach(function (en, i) {
    var k = parseMin(en.it.h);
    if (k == null) k = last + 0.01; else last = k;
    en._k = k;
    en._i = i;
  });
  arr.sort(function (a, b) { return a._k - b._k || a._i - b._i; });
  return arr;
}

function hiddenCount(day) {
  var n = 0;
  day.items.forEach(function (_, i) { if (DB.hidden["d" + day.d + "-" + i]) n++; });
  (DB.added[day.d] || []).forEach(function (c, i) { if (c && DB.hidden["a" + day.d + "-" + i]) n++; });
  return n;
}

var planView = "time"; /* l'onglet Jours s'ouvre sur le planning semaine */

var CATS = [

  ["archi",  "Architecture", "--c-archi"],
  ["air",    "Plein air",    "--c-air"],
  ["soir",   "Soirées",      "--c-soir"],

  ["campus", "Ole Miss",     "--c-campus"],
  ["cours",  "Kaplan",       "--c-cours"],
  ["trajet", "Trajets",      "--c-trajet"]
];

var TL_LABELS = [
  ["fin d'aprem", 990], ["après-midi", 840], ["aprem", 840], ["matin", 540],
  ["midi", 720], ["sunset", 1110], ["soir", 1140], ["minuit", 1380],
  ["journée", 570], ["libre", 600]
];

function parseMin(h) {
  if (!h) return null;
  var m = /(\d{1,2})h(\d{0,2})/.exec(h);
  if (m) return (+m[1]) * 60 + (+(m[2] || 0));
  var k = h.toLowerCase();
  for (var i = 0; i < TL_LABELS.length; i++) {
    if (k.indexOf(TL_LABELS[i][0]) !== -1) return TL_LABELS[i][1];
  }
  return null;
}

function fmtMin(mn) {
  var hh = Math.floor(mn / 60) % 24, mm = mn % 60;
  return hh + "h" + (mm ? String(mm).padStart(2, "0") : "");
}

function nowChicagoMin() {
  try {
    var p = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Chicago", hour: "numeric", minute: "numeric", hour12: false
    }).formatToParts(new Date());
    var h = 0, m = 0;
    p.forEach(function (x) {
      if (x.type === "hour") h = parseInt(x.value, 10) % 24;
      if (x.type === "minute") m = parseInt(x.value, 10);
    });
    return h * 60 + m;
  } catch (e) { return null; }
}

function tlSlots(day) {
  var ens = dayItems(day).filter(function (en) { return itemMatches(en.it); });
  var t = null, slots = [];
  ens.forEach(function (en) {
    var s = parseMin(en.it.h);
    if (s == null) s = (t == null ? 540 : t + 30);
    if (t != null && s < t + 15) s = t + 15;
    slots.push({ en: en, s: s });
    t = s;
  });
  slots.forEach(function (o, i) {
    var it = o.en.it;
    if (it.dur) {
      o.e = o.s + it.dur;   /* durée fixée à la main : jamais rognée */
      return;
    }
    var c = it.c;
    var dur = c === "cours" ? 210 : c === "soir" ? 150 : c === "trajet" ? 75 : 105;
    if (i + 1 < slots.length) dur = Math.max(40, Math.min(dur, slots[i + 1].s - o.s - 5));
    o.e = o.s + dur;
  });
  /* chevauchements (durées manuelles) : décalage en 2e colonne */
  var maxEnd = -1;
  slots.forEach(function (o) {
    o.lane = o.s < maxEnd ? 1 : 0;
    if (o.e > maxEnd) maxEnd = o.e;
  });
  return slots;
}

function weekHtml(w) {
  var days = DAYS.slice(w * 7, w * 7 + 7);
  var all = days.map(function (d) { return { d: d, slots: tlSlots(d) }; });
  var h0 = 480, h1 = 1320;
  all.forEach(function (o) {
    o.slots.forEach(function (s) {
      if (s.s < h0) h0 = Math.floor(s.s / 60) * 60;
      if (s.e > h1) h1 = Math.ceil(s.e / 60) * 60;
    });
  });
  var PX = 44 / 60;
  var tHead = todayChicago();
  var head = '<div class="twhead"><div class="twgut"></div>' + all.map(function (o) {
    return '<button type="button" class="twd' + (o.d.date === tHead ? " today" : "") + '" data-goday="' + o.d.d + '" style="--pc: var(--g' + o.d.p + 'a)">' +
      "<span>" + o.d.dow + "</span><b>" + esc(o.d.lab.split(" ")[0]) + "</b></button>";
  }).join("") + "</div>";
  var gut = '<div class="twgut">';
  for (var hh = h0 + 60; hh < h1; hh += 60) {
    gut += '<span style="top:' + ((hh - h0) * PX - 6).toFixed(1) + 'px">' + (hh / 60) + "h</span>";
  }
  gut += "</div>";
  var tNow = todayChicago(), nmW = nowChicagoMin();
  var cols = all.map(function (o) {
    var b = o.slots.map(function (s) {
      var top = (s.s - h0) * PX;
      var height = Math.max(16, (s.e - s.s) * PX - 2);
      return '<button type="button" class="twb' + (done[s.en.uid] ? " done" : "") + (s.lane ? " lane1" : "") +
        '" style="top:' + top.toFixed(1) + "px;height:" + height.toFixed(1) + "px;--cat:var(--c-" + (s.en.it.c || "air") +
        ')" data-tlb="' + s.en.uid + '" data-day="' + o.d.d + '"><span>' + esc(s.en.it.t) + "</span></button>";
    }).join("");
    if (o.d.date === tNow && nmW != null && nmW >= h0 && nmW <= h1) {
      b += '<div class="twnow" style="top:' + ((nmW - h0) * PX).toFixed(1) + 'px"></div>';
    }
    return '<div class="twc">' + b + "</div>";
  }).join("");
  return head +
    '<div class="tw" style="height:' + ((h1 - h0) * PX).toFixed(0) + 'px">' + gut + cols + "</div>" +
    '<div class="tipcard">👆 Tap = fiche du bloc · reste appuyé ½ s puis glisse pour changer l\'heure · l\'en-tête d\'un jour l\'ouvre en grand.</div>';
}

function timelineHtml(day) {
  var slots = tlSlots(day);
  if (!slots.length) return '<div class="tipcard">Rien ce jour-là pour ce filtre.</div>';
  var h0 = Math.min(480, Math.floor(slots[0].s / 60) * 60);
  var h1 = Math.max(1320, Math.ceil(slots[slots.length - 1].e / 60) * 60);
  var PX = 56 / 60;
  var html = '<div class="tl" style="height:' + ((h1 - h0) * PX) + 'px">';
  for (var hh = h0; hh < h1; hh += 60) {
    html += '<div class="tlh"' + (hh === h0 ? "" : "") + ">" +
      (hh === h0 ? "" : '<span>' + (hh / 60) + "h</span>") + "</div>";
  }
  slots.forEach(function (o) {
    var top = (o.s - h0) * PX;
    var height = Math.max(30, (o.e - o.s) * PX - 3);
    html += '<button type="button" class="tlb' + (height < 46 ? " sm" : "") + (done[o.en.uid] ? " done" : "") + (o.lane ? " lane1" : "") +
      '" style="top:' + top.toFixed(1) + "px; height:" + height.toFixed(1) + "px; --cat: var(--c-" + (o.en.it.c || "air") + ')" data-tlb="' + o.en.uid + '" data-day="' + day.d + '">' +
      '<span class="tltime">' + fmtMin(o.s) + " – " + fmtMin(o.e) + "</span><b>" + esc(o.en.it.t) + "</b></button>";
  });
  if (day.date === todayChicago()) {
    var nm = nowChicagoMin();
    if (nm != null && nm >= h0 && nm <= h1) {
      html += '<div class="tlnow" style="top:' + ((nm - h0) * PX).toFixed(1) + 'px"><span>' + fmtMin(nm) + "</span></div>";
    }
  }
  html += "</div>" +
    '<div class="tipcard">👆 Tap = fiche (liens, itinéraire, « fait ») · reste appuyé ½ s puis glisse un bloc pour le déplacer — la liste et les horaires suivent.</div>';
  return html;
}

/* ---------- déplacement d'un bloc par appui long (façon Google Agenda) ---------- */
var justDragged = false;

/* déplacer une activité vers un autre jour (copie fidèle, source masquée) */
function moveToDay(uid, fromD, toD, newH, durMin) {
  if (fromD === toD) return false;
  var day = DAYS[fromD - 1], target = DAYS[toD - 1];
  if (!day || !target) return false;
  var en = null;
  dayItems(day).forEach(function (x) { if (x.uid === uid) en = x; });
  if (!en) return false;
  var copy = {};
  Object.keys(en.it).forEach(function (k) { if (k.charAt(0) !== "_") copy[k] = en.it[k]; });
  if (newH != null) copy.h = newH;
  if (durMin && !copy.dur) copy.dur = durMin;
  (DB.added[toD] = DB.added[toD] || []).push(copy);
  var newUid = "a" + toD + "-" + (DB.added[toD].length - 1);
  if (uid.charAt(0) === "a") {
    var p = uid.slice(1).split("-");
    if (DB.added[+p[0]]) DB.added[+p[0]][+p[1]] = null;
    delete DB.hidden[uid];
  } else {
    DB.hidden[uid] = 1;
    delete DB.edits[uid];
  }
  if (done[uid]) { done[newUid] = 1; delete done[uid]; }
  saveDB();
  toast("Déplacé au J" + toD + " · " + target.dow + " " + target.lab + " ✓");
  return true;
}

function moveActivity(uid, slot, newS) {
  var h = fmtMin(newS);
  var durMin = Math.max(15, Math.round((slot.e - slot.s) / 5) * 5);
  if (uid.charAt(0) === "a") {
    var p = uid.slice(1).split("-");
    var it = DB.added[+p[0]] && DB.added[+p[0]][+p[1]];
    if (!it) return;
    it.h = h;
    if (!it.dur) it.dur = durMin;
  } else {
    var e = DB.edits[uid] || (DB.edits[uid] = {});
    e.h = h;
    if (!slot.en.it.dur) e.dur = durMin; /* on fige la durée affichée pour que le bloc ne change pas de taille */
  }
  saveDB();
  toast("Déplacé à " + h + " ✓");
  renderPlan();
  renderHome();
}

function bindBlockDrag(b) {
  var uid = b.dataset.tlb, dnum = +b.dataset.day;
  var isWeek = b.classList.contains("twb");
  var PXd = (isWeek ? 44 : 56) / 60;
  var timer = null, dragging = false, y0 = 0, x0 = 0, slot = null, newS = null;
  var colW = 0, colShift = 0;

  function targetDay() {
    if (!colShift) return dnum;
    var lo = tlWeek * 7 + 1, hi = Math.min(DAYS.length, tlWeek * 7 + 7);
    return Math.max(lo, Math.min(hi, dnum + colShift));
  }
  function badgeTxt() {
    var d = slot.e - slot.s;
    var td = targetDay();
    return (td !== dnum ? "📅 " + DAYS[td - 1].dow + " " + DAYS[td - 1].lab + " · " : "↕ ") +
      fmtMin(newS) + " – " + fmtMin(newS + d);
  }
  function start(e) {
    var s0 = null;
    tlSlots(DAYS[dnum - 1]).forEach(function (s) { if (s.en.uid === uid) s0 = s; });
    if (!s0) return;
    slot = s0;
    newS = slot.s;
    colShift = 0;
    colW = 0;
    if (isWeek) {
      try { colW = b.parentElement.getBoundingClientRect().width + 3; } catch (err) {}
    }
    dragging = true;
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
    b.classList.add("drag");
    var badge = document.getElementById("dragBadge");
    if (badge) {
      badge.textContent = badgeTxt();
      badge.classList.add("show");
    }
  }
  function update(dy, dx) {
    var d = slot.e - slot.s;
    newS = Math.max(0, Math.min(1440 - d, Math.round((slot.s + dy / PXd) / 5) * 5));
    colShift = isWeek && colW > 0 ? Math.round(dx / colW) : 0;
    var tx = (targetDay() - dnum) * colW;
    b.style.transform = "translate(" + tx.toFixed(1) + "px," + ((newS - slot.s) * PXd).toFixed(1) + "px)";
    var badge = document.getElementById("dragBadge");
    if (badge) badge.textContent = badgeTxt();
  }
  function stop(commit) {
    if (timer) { clearTimeout(timer); timer = null; }
    if (!dragging) return;
    dragging = false;
    b.classList.remove("drag");
    b.style.transform = "";
    var badge = document.getElementById("dragBadge");
    if (badge) badge.classList.remove("show");
    justDragged = true;
    setTimeout(function () { justDragged = false; }, 400);
    if (!commit || newS == null) return;
    var td = targetDay();
    if (td !== dnum) {
      moveToDay(uid, dnum, td, fmtMin(newS), Math.max(15, Math.round((slot.e - slot.s) / 5) * 5));
      renderPlan(); renderHome(); refreshRing();
    } else if (newS !== slot.s) {
      moveActivity(uid, slot, newS);
    }
  }

  b.addEventListener("pointerdown", function (e) {
    y0 = e.clientY;
    x0 = e.clientX;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { timer = null; start(e); }, 420);
  });
  b.addEventListener("pointermove", function (e) {
    if (dragging) { update(e.clientY - y0, e.clientX - x0); return; }
    if (timer && (Math.abs(e.clientY - y0) > 10 || Math.abs(e.clientX - x0) > 10)) { clearTimeout(timer); timer = null; }
  });
  b.addEventListener("pointerup", function () { stop(true); });
  b.addEventListener("pointercancel", function () { stop(false); });
  /* bloque le défilement de la page pendant un déplacement (iOS) */
  b.addEventListener("touchmove", function (e) { if (dragging) e.preventDefault(); }, { passive: false });
  b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
}

function renderPlan() {
  var scr = document.getElementById("scr-plan");

  var seg = '<div class="seg" role="tablist">' +
    '<button type="button" data-view="day" class="' + (planView === "day" ? "on" : "") + '">Par jour</button>' +
    '<button type="button" data-view="time" class="' + (planView === "time" ? "on" : "") + '">🕐 Horaire</button>' +
    '<button type="button" data-view="all" class="' + (planView === "all" ? "on" : "") + '">Tout</button></div>';

  var chips = '<div class="filters">' +
    '<button class="chip reset" type="button" data-cat="all" aria-pressed="' + (activeCats.length === 0 ? "true" : "false") + '">Tout</button>' +
    CATS.map(function (c) {
      var on = activeCats.indexOf(c[0]) !== -1;
      return '<button class="chip" type="button" data-cat="' + c[0] + '" style="--dot: var(' + c[2] + ')" aria-pressed="' + (on ? "true" : "false") + '">' + c[1] + "</button>";
    }).join("") + "</div>";

  var body = "";
  if (planView === "day" || planView === "time") {
    var picks = DAYS.map(function (day) {
      var all = dayItems(day).length > 0 && dayDoneCount(day) === dayItems(day).length;
      return '<button class="dp' + (day.d === curDay ? " on" : "") + (all ? " alldone" : "") +
        '" data-p="' + day.p + '" data-d="' + day.d + '" type="button">' +
        '<span class="e">' + day.e + '</span><span class="n">' + day.d + '</span>' +
        '<span class="d">' + day.dow + "</span></button>";
    }).join("");
    if (planView === "time") {
      if (tlWeek == null) tlWeek = curDay <= 7 ? 0 : 1;
      body = '<div class="seg">' +
        '<button type="button" data-tlmode="day" class="' + (tlMode === "day" ? "on" : "") + '">Jour</button>' +
        '<button type="button" data-tlmode="week" class="' + (tlMode === "week" ? "on" : "") + '">Semaine</button></div>';
      if (tlMode === "week") {
        body += '<div class="seg">' +
          '<button type="button" data-week="0" class="' + (tlWeek === 0 ? "on" : "") + '">Sem. 1 · Kaplan</button>' +
          '<button type="button" data-week="1" class="' + (tlWeek === 1 ? "on" : "") + '">Sem. 2 · Ole Miss + Chicago</button></div>' +
          weekHtml(tlWeek);
      } else {
        var td = DAYS[curDay - 1];
        var tNowP = todayChicago();
        var tdToday = null;
        DAYS.forEach(function (dd) { if (dd.date === tNowP) tdToday = dd; });
        body += '<div class="daypick" id="daypick">' + picks + "</div>" +
          '<div class="mini-day" style="--pc: var(--g' + td.p + 'a)"><span class="me">' + td.e +
          '</span><span class="n">J' + td.d + '</span><span class="d">' + td.dow + " " + td.lab + " · " + esc(td.title) + "</span>" +
          '<span class="dnavs"><button type="button" class="dnavb" data-dnav="-1" aria-label="Jour précédent">‹</button>' +
          '<button type="button" class="dnavb" data-dnav="1" aria-label="Jour suivant">›</button></span></div>' +
          (tdToday && tdToday.d !== curDay
            ? '<button class="btn tdy" type="button" data-gotoday="' + tdToday.d + '">📍 Revenir à aujourd\'hui (J' + tdToday.d + ")</button>"
            : "") +
          timelineHtml(td) +
          (editItem === "new-" + td.d
            ? editFormHtml(editItem, { h: "", t: "", c: "air" })
            : '<button class="btn" type="button" data-addday="' + td.d + '">＋ Ajouter une activité à ce jour</button>');
      }
      body += sheetHtml();
    } else {
      body = '<div class="daypick" id="daypick">' + picks + "</div>" + dayCardHtml(DAYS[curDay - 1], null, true);
    }
  } else {
    DAYS.forEach(function (day) {
      var ens = dayItems(day).filter(function (en) { return itemMatches(en.it); });
      if (!ens.length) return;
      body += '<div class="mini-day" style="--pc: var(--g' + day.p + 'a)">' +
        '<span class="me">' + day.e + '</span><span class="n">J' + day.d + '</span>' +
        '<span class="d">' + day.dow + " " + day.lab + " · " + esc(day.title) + "</span></div>";
      ens.forEach(function (en) { body += itemHtml(day, en.uid, en.it, false); });
    });
    if (!body) body = '<div class="tipcard">Rien pour ce filtre.</div>';
  }

  scr.innerHTML = '<h2 class="screen-title"><span>📅</span>Le planning</h2>' + seg + chips + body;

  scr.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      if (!b.dataset.view) return; /* laisse Jour/Semaine et Sem.1/Sem.2 à leurs propres gestionnaires */
      planView = b.dataset.view;
      renderPlan();
    });
  });
  scr.querySelectorAll(".chip").forEach(function (ch) {
    ch.addEventListener("click", function () {
      var c = ch.dataset.cat;
      if (c === "all") activeCats = [];
      else {
        var i = activeCats.indexOf(c);
        if (i === -1) activeCats.push(c); else activeCats.splice(i, 1);
      }
      renderPlan();
    });
  });
  scr.querySelectorAll(".dp").forEach(function (b) {
    b.addEventListener("click", function () {
      curDay = +b.dataset.d;
      renderPlan();
    });
  });
  bindChecks(scr);
  bindNotes(scr);
  bindEditing(scr);
  scr.querySelectorAll("[data-tlmode]").forEach(function (b) {
    b.addEventListener("click", function () { tlMode = b.dataset.tlmode; renderPlan(); });
  });
  scr.querySelectorAll("[data-week]").forEach(function (b) {
    b.addEventListener("click", function () { tlWeek = +b.dataset.week; renderPlan(); });
  });
  scr.querySelectorAll("[data-goday]").forEach(function (b) {
    b.addEventListener("click", function () {
      curDay = +b.dataset.goday;
      tlMode = "day";
      renderPlan();
    });
  });
  scr.querySelectorAll("[data-tlb]").forEach(function (b) {
    b.addEventListener("click", function () {
      if (justDragged) return; /* fin d'un glisser : pas d'ouverture de fiche */
      tlSheet = { uid: b.dataset.tlb, d: +b.dataset.day };
      renderPlan();
    });
    bindBlockDrag(b);
  });
  scr.querySelectorAll("[data-dnav]").forEach(function (b) {
    b.addEventListener("click", function () {
      curDay = Math.min(DAYS.length, Math.max(1, curDay + (+b.dataset.dnav)));
      renderPlan();
    });
  });
  scr.querySelectorAll("[data-gotoday]").forEach(function (b) {
    b.addEventListener("click", function () {
      curDay = +b.dataset.gotoday;
      renderPlan();
    });
  });
  var shw = scr.querySelector("[data-shclose]");
  if (shw) {
    shw.addEventListener("click", function (e) {
      if (e.target === shw) { tlSheet = null; tlSheetMove = false; renderPlan(); }
    });
    shw.querySelector("[data-shx]").addEventListener("click", function () {
      tlSheet = null;
      tlSheetMove = false;
      renderPlan();
    });
    shw.querySelector("[data-shmove]").addEventListener("click", function () {
      tlSheetMove = !tlSheetMove;
      renderPlan();
    });
    shw.querySelectorAll("[data-shday]").forEach(function (db) {
      db.addEventListener("click", function () {
        var s = tlSheet;
        tlSheet = null;
        tlSheetMove = false;
        moveToDay(s.uid, s.d, +db.dataset.shday, null, null);
        renderPlan(); renderHome(); refreshRing();
      });
    });
    shw.querySelector("[data-shdone]").addEventListener("click", function () {
      var uid = tlSheet.uid, day = DAYS[tlSheet.d - 1];
      if (done[uid]) delete done[uid]; else done[uid] = 1;
      saveDB();
      refreshRing();
      if (done[uid] && dayDoneCount(day) === dayItems(day).length) burst([day.e, "🎉", "⭐"]);
      renderPlan();
    });
    shw.querySelector("[data-shedit]").addEventListener("click", function () {
      var s = tlSheet;
      tlSheet = null;
      tlSheetMove = false;
      curDay = s.d;
      planView = "day";
      editItem = s.uid;
      renderPlan();
      var efEl = scr.querySelector("[data-efuid]");
      if (efEl && efEl.scrollIntoView) efEl.scrollIntoView({ block: "center" });
    });
  }
}

    });

        timeZone: "America/Chicago", hour: "numeric", minute: "numeric", hour12: false
      }).formatToParts(new Date());
      hp.forEach(function (p) {
        if (p.type === "hour") hour = parseInt(p.value, 10);
        if (p.type === "minute") minute = parseInt(p.value, 10);
      });

    /* compte à rebours du prochain créneau horaire non coché */

      html += '<div class="tipcard">⏱️ <b>Prochain créneau :</b> ' + esc(nextEn.it.t) + " à " + esc(nextEn.it.h) + " — dans " + dtxt + "</div>";

    var nxt = DAYS[day.d];

      html += '<div class="card"><h3>🌙 Demain en un coup d\'œil — ' + nxt.e + " " + esc(nxt.title) + "</h3><ul>";
      nxt.items.slice(0, 3).forEach(function (it) {
        html += "<li><b>" + esc(it.h) + "</b> — " + esc(it.t) + "</li>";
      });
      html += "</ul>" + (nxt.tip ? "<p>💡 " + esc(nxt.tip) + "</p>" : "") + "</div>";
    } else if (nxt) {
      html += '<div class="tipcard">🔜 <b>Demain :</b> ' + nxt.e + " " + esc(nxt.title) +
        (nxt.tip ? " — " + esc(nxt.tip) : "") + "</div>";
    }
  }

  /* le voyage en chiffres */
  var foodTotal = 0, shopTotal = 0;
  FOOD.forEach(function (g) { foodTotal += g.items.length; });
  SHOP.forEach(function (g) { shopTotal += g.items.length; });
  var spentSum = DB.spend.reduce(function (a, e) { return a + (+e.a || 0); }, 0);
  var pc = progressCounts();
  html += '<div class="card"><h3>📊 Le voyage en chiffres</h3><ul class="blegend">' +
    '<li><span class="dot" style="background:var(--c-air)"></span><span class="lab">Activités cochées</span><span class="val">' + pc.ok + " / " + pc.total + "</span></li>" +
    '<li><span class="dot" style="background:var(--c-musee)"></span><span class="lab">CityPASS tamponnés</span><span class="val">' + Object.keys(passUsed).length + " / 5</span></li>" +
    '<li><span class="dot" style="background:var(--c-sport)"></span><span class="lab">Adresses goûtées</span><span class="val">' + Object.keys(DB.food).length + " / " + foodTotal + "</span></li>" +
    '<li><span class="dot" style="background:var(--c-soir)"></span><span class="lab">Boutiques faites</span><span class="val">' + Object.keys(DB.shop).length + " / " + shopTotal + "</span></li>" +
    '<li><span class="dot" style="background:var(--c-campus)"></span><span class="lab">Dépensé sur place</span><span class="val">' + spentSum.toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " €</span></li>" +
    '<li><span class="dot" style="background:var(--c-archi)"></span><span class="lab">Marche estimée</span><span class="val">~12–18 km/j</span></li>' +
    "</ul>" +
    [1, 2, 3].map(function (p) {
      var ok = 0, tot = 0;
      DAYS.forEach(function (d) {
        if (d.p !== p) return;
        dayItems(d).forEach(function (en) { tot++; if (done[en.uid]) ok++; });
      });
      var pctp = tot ? Math.round(ok / tot * 100) : 0;
      return '<div class="phrow"><span>' + ["", "Chicago 1", "Ole Miss", "Chicago 2"][p] + '</span>' +
        '<div class="gauge"><span style="width:' + pctp + '%; background: var(--g' + p + 'a)"></span></div>' +
        '<span class="pv">' + ok + "/" + tot + "</span></div>";
    }).join("") +
    '<div style="margin-top:12px"><button class="btn" id="btnSouvenir" type="button">🖼️ Ma carte-souvenir</button></div></div>';

  scr.innerHTML = html;
  var sv = document.getElementById("btnSouvenir");
  if (sv) sv.addEventListener("click", showSouvenir);
  var fb = document.getElementById("btnFocus");
  if (fb) fb.addEventListener("click", function () { focusMode = !focusMode; renderHome(); });
  bindChecks(scr);
  bindNotes(scr);
  bindEditing(scr);
  scr.querySelectorAll("[data-prep]").forEach(function (box) {
    box.addEventListener("change", function () {
      prepDone[box.dataset.prep] = box.checked ? 1 : undefined;
      if (!box.checked) delete prepDone[box.dataset.prep];
      store.set("chi26:prep", prepDone);
      renderHome();

}
