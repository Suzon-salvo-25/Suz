/* ============================================================
   BASE + COQUILLE D'APPLI
   ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-round);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ---------- barre du haut ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--ground) 82%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar .logo { font-size: 22px; }
.topbar .name {
  flex: 1;
  font-weight: 800;
  font-size: 17px;
  letter-spacing: -.01em;
}

/* ============================================================
   ÉTAT — moteur de sauvegarde à 3 niveaux
   1. localStorage (testé réellement, pas juste supposé)
   2. cookies (si localStorage est bloqué par le bac à sable)
   3. mémoire seule + alerte et export/import manuel
   ============================================================ */
var BACKEND = (function () {
  try {
    localStorage.setItem("chi26:t", "1");
    if (localStorage.getItem("chi26:t") === "1") {
      localStorage.removeItem("chi26:t");
      return "local";
    }
  } catch (e) {}
  try {
    document.cookie = "chi26t=1; max-age=60; path=/; SameSite=Lax";
    if (document.cookie.indexOf("chi26t=1") !== -1) return "cookie";
  } catch (e) {}
  return "mem";
})();

var DB = { done: {}, prep: {}, pass: {}, pack: {}, food: {}, shop: {}, notes: {}, spend: [], paid: null, theme: null };

function loadDB() {
  var raw = null;
  try {
    if (BACKEND === "local") {
      raw = localStorage.getItem("chi26:db");
      if (!raw) {
        /* migration depuis les anciennes clés éclatées */
        var legacy = {};
        ["done", "prep", "pass", "pack", "paid"].forEach(function (k) {
          var v = localStorage.getItem("chi26:" + k);
          if (v) legacy[k] = JSON.parse(v);
        });
        var th = localStorage.getItem("chi26:theme");
        if (th) legacy.theme = th.replace(/"/g, "");
        if (Object.keys(legacy).length) raw = JSON.stringify(legacy);
      }
    } else if (BACKEND === "cookie") {
      var m = document.cookie.match(/(?:^|;\s*)chi26db=([^;]*)/);
      if (m) raw = decodeURIComponent(m[1]);
    }
    if (raw) {
      var obj = JSON.parse(raw);
      ["done", "prep", "pass", "pack", "food", "shop", "notes"].forEach(function (k) {
        if (obj[k] && typeof obj[k] === "object" && !Array.isArray(obj[k])) DB[k] = obj[k];
      });
      if (Array.isArray(obj.spend)) DB.spend = obj.spend;
      if (obj.paid && typeof obj.paid === "object") DB.paid = obj.paid;
      if (obj.theme) DB.theme = obj.theme;
    }
  } catch (e) {}
}

function saveDB() {
  var raw = JSON.stringify(DB);
  try {
    if (BACKEND === "local") localStorage.setItem("chi26:db", raw);
    else if (BACKEND === "cookie") {
      document.cookie = "chi26db=" + encodeURIComponent(raw) + "; max-age=31536000; path=/; SameSite=Lax";
    }
  } catch (e) {}
}

   RENDU
   ============================================================ */
function esc(s) { return String(s == null ? "" : s); }

function priceHtml(it) {
  if (it.pass) return '<span class="price pass">🎫 ' + it.pass + "</span>";
  if (!it.pr) return "";
  var cls = /Gratuit|Donation/.test(it.pr) ? "price free" : "price";
  return '<span class="' + cls + '">' + esc(it.pr) + "</span>";
}

function itemHtml(day, idx) {
  var it = day.items[idx];
  var uid = "d" + day.d + "-" + idx;
  var checked = done[uid] ? " checked" : "";
  var doneCls = done[uid] ? " done" : "";
  return '<label class="item' + doneCls + '" style="--cat: var(--c-' + it.c + ')" data-uid="' + uid + '">' +
    '<input type="checkbox" class="chk" data-uid="' + uid + '" data-day="' + day.d + '"' + checked +
    ' aria-label="Fait : ' + esc(it.t).replace(/"/g, "&quot;") + '">' +
    '<span class="body"><span class="h">' + esc(it.h) + "</span><br>" +
    '<span class="t">' + esc(it.t) + "</span>" +
    (it.n ? '<div class="n' + (it.w ? " warn" : "") + '">' + esc(it.n) + "</div>" : "") +
    "</span>" + priceHtml(it) + "</label>";
}

function dayDoneCount(day) {
  var n = 0;
  day.items.forEach(function (_, i) { if (done["d" + day.d + "-" + i]) n++; });
  return n;
}

function itemMatches(it) {
  return activeCats.length === 0 || activeCats.indexOf(it.c) !== -1;
}

function dayCardHtml(day, kicker, useFilter) {
  var dn = dayDoneCount(day);
  var html = '<div class="dayhero" data-p="' + day.p + '">' +
    '<span class="big-emoji">' + day.e + "</span>" +
    '<div class="kicker">' + esc(kicker || ("Jour " + day.d + " / 14 · " + day.dow + " " + day.lab)) + "</div>" +
    "<h3>" + day.e + " " + esc(day.title) + "</h3>" +
    '<div class="sub">' + ["", "Chicago · semaine Kaplan", "Mississippi · Ole Miss", "Chicago · mode touriste"][day.p] + "</div>" +
    '<span class="done-pill">' + dn + " / " + day.items.length + " coché" + (dn > 1 ? "s" : "") + "</span>" +
    "</div>";
  if (day.tip) html += '<div class="tipcard">💡 ' + esc(day.tip) + "</div>";
  html += routeStrip(day);
  var shown = 0;
  day.items.forEach(function (it, i) {
    if (!useFilter || itemMatches(it)) { html += itemHtml(day, i); shown++; }
  });
  if (useFilter && shown === 0) html += '<div class="tipcard">Rien ce jour-là pour ce filtre.</div>';
  html += '<textarea class="daynote" data-note="d' + day.d + '" placeholder="📓 Journal du jour ' + day.d +
    ' — ce que tu as vu, aimé, raté…">' + escT(DB.notes["d" + day.d] || "") + "</textarea>";
  return html;
}

function escT(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
}

function routeStrip(day) {
  var steps = day.items.filter(function (it) { return it.c !== "cours"; });
  if (steps.length < 2) return "";
  var h = '<div class="route-strip" aria-label="Ordre de la journée">';
  steps.forEach(function (it, i) {
    var short = it.t.replace(/\s*[—:+·(].*$/, "").trim();
    if (short.length > 22) short = short.slice(0, 21) + "…";
    h += (i ? '<span class="ra">→</span>' : "") +
      '<span class="rs" style="--cat: var(--c-' + it.c + ')"><b>' + (i + 1) + "</b>" + esc(short) + "</span>";
  });
  return h + "</div>";
}

function bindNotes(scope) {
  scope.querySelectorAll(".daynote").forEach(function (ta) {
    ta.addEventListener("input", function () {
      var k = ta.dataset.note;
      var v = ta.value;
      if (v) DB.notes[k] = v; else delete DB.notes[k];
      saveDB();
    });
  });
}

var curDay = 1;

var activeCats = [];
var CATS = [
  ["musee",  "Musées",       "--c-musee"],
  ["archi",  "Architecture", "--c-archi"],
  ["air",    "Plein air",    "--c-air"],
  ["soir",   "Soirées",      "--c-soir"],

];

function renderPlan() {
  var scr = document.getElementById("scr-plan");

  var seg = '<div class="seg" role="tablist">' +
    '<button type="button" data-view="day" class="' + (planView === "day" ? "on" : "") + '">Par jour</button>' +
    '<button type="button" data-view="all" class="' + (planView === "all" ? "on" : "") + '">Tout le séjour</button></div>';

  var chips = '<div class="filters">' +
    '<button class="chip reset" type="button" data-cat="all" aria-pressed="' + (activeCats.length === 0 ? "true" : "false") + '">Tout</button>' +
    CATS.map(function (c) {
      var on = activeCats.indexOf(c[0]) !== -1;
      return '<button class="chip" type="button" data-cat="' + c[0] + '" style="--dot: var(' + c[2] + ')" aria-pressed="' + (on ? "true" : "false") + '">' + c[1] + "</button>";
    }).join("") + "</div>";

  var body = "";
  if (planView === "day") {
    var picks = DAYS.map(function (day) {
      var all = dayDoneCount(day) === day.items.length;
      return '<button class="dp' + (day.d === curDay ? " on" : "") + (all ? " alldone" : "") +
        '" data-p="' + day.p + '" data-d="' + day.d + '" type="button">' +
        '<span class="e">' + day.e + '</span><span class="n">' + day.d + '</span>' +
        '<span class="d">' + day.dow + "</span></button>";
    }).join("");
    body = '<div class="daypick" id="daypick">' + picks + "</div>" + dayCardHtml(DAYS[curDay - 1], null, true);
  } else {
    DAYS.forEach(function (day) {
      var idx = [];
      day.items.forEach(function (it, i) { if (itemMatches(it)) idx.push(i); });
      if (!idx.length) return;
      body += '<div class="mini-day" style="--pc: var(--g' + day.p + 'a)">' +
        '<span class="me">' + day.e + '</span><span class="n">J' + day.d + '</span>' +
        '<span class="d">' + day.dow + " " + day.lab + " · " + esc(day.title) + "</span></div>";
      idx.forEach(function (i) { body += itemHtml(day, i); });
    });
    if (!body) body = '<div class="tipcard">Rien pour ce filtre.</div>';
  }

  scr.innerHTML = '<h2 class="screen-title"><span>📅</span>Le planning</h2>' + seg + chips + body;

  scr.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () { planView = b.dataset.view; renderPlan(); });
  });
  scr.querySelectorAll(".chip").forEach(function (ch) {
    ch.addEventListener("click", function () {
      var c = ch.dataset.cat;
      if (c === "all") activeCats = [];
      else {
        var i = activeCats.indexOf(c);
        if (i === -1) activeCats.push(c); else activeCats.splice(i, 1);
      }
      renderPlan();
    });
  });
  scr.querySelectorAll(".dp").forEach(function (b) {
    b.addEventListener("click", function () {
      curDay = +b.dataset.d;
      renderPlan();
    });
  });
  bindChecks(scr);
  bindNotes(scr);
}

/* ---------- écran Budget ---------- */
function fmtEur(n) { return n.toLocaleString("fr-FR") + " €"; }

function renderBudget() {
  var scr = document.getElementById("scr-budget");
  var paidSum = 0, restFixed = 0;
  BUDGET.fixed.forEach(function (r) {
    if (paidState[r.id]) paidSum += r.v; else restFixed += r.v;
  });
  var onsiteSum = BUDGET.onsite.reduce(function (a, r) { return a + r[2]; }, 0);
  var resteTotal = restFixed + onsiteSum;

  var segs = [
    ["Déjà payé", paidSum, "var(--b-paid)"],
    ["Réservations restantes", restFixed, "var(--b-1)"]
  ].concat(BUDGET.onsite.map(function (r) {
    return [r[0], r[2], "var(--" + r[3] + ")"];
  })).filter(function (s) { return s[1] > 0; });
  var grand = segs.reduce(function (a, s) { return a + s[1]; }, 0);
  var bar = segs.map(function (s) {
    return '<span style="width:' + (s[1] / grand * 100).toFixed(1) + "%; background:" + s[2] + '" title="' + esc(s[0]) + '"></span>';
  }).join("");

  var spent = DB.spend.reduce(function (a, e) { return a + (+e.a || 0); }, 0);
  var envelope = 954; /* activités 304 + nourriture 350 + transports 300 */
  var pct = Math.min(100, spent / envelope * 100);
  var spendRows = DB.spend.slice().reverse().map(function (e, ri) {
    var i = DB.spend.length - 1 - ri;
    var dayObj = null;
    DAYS.forEach(function (d) { if (d.date === e.d) dayObj = d; });
    var lbl = dayObj ? "J" + dayObj.d : (e.d || "").slice(5);
    return '<li><span class="sd">' + esc(lbl) + '</span><span class="st">' + esc(e.t || "—") +
      '</span><span class="sa">' + (+e.a).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " €" +
      '</span><button class="sx" type="button" data-del="' + i + '" aria-label="Supprimer">✕</button></li>';
  }).join("");

  var html = '<h2 class="screen-title"><span>💰</span>Budget</h2>' +

    '<div class="card"><h3>💸 Carnet de dépenses — ' +
    spent.toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " € dépensés</h3>" +
    '<div class="spend-form">' +
    '<input type="number" inputmode="decimal" min="0" step="0.5" id="spAmt" placeholder="12,50">' +
    '<input type="text" id="spTxt" placeholder="ex : deep dish Pequod\'s" maxlength="60">' +
    '<button class="btn" id="spAdd" type="button" style="margin:0">＋</button></div>' +
    '<div class="gauge' + (spent > envelope ? " over" : "") + '"><span style="width:' + pct.toFixed(1) + '%"></span></div>' +
    '<p style="font-size:12.5px">' +
    (spent > envelope
      ? "Enveloppe « sur place » de 954 € dépassée de " + Math.round(spent - envelope) + " € — à compenser sur l'hôtel ou le shopping."
      : "Reste " + Math.round(envelope - spent) + " € sur l'enveloppe « sur place » (activités + nourriture + transports : 954 €).") +
    "</p>" +
    (spendRows ? '<ul class="spend-list">' + spendRows + "</ul>" : '<p style="font-size:12.5px">Saisis chaque dépense en 2 secondes — le total se compare tout seul au budget.</p>') +
    "</div>" +

    '<div class="card money-hero">' +
    '<div class="lbl">TOTAL ESTIMÉ DU VOYAGE</div>' +
    '<div class="total">3 493 – 3 813 €</div>' +
    '<div class="lbl">cible : ~3 500 € hors shopping</div>' +
    '<div class="stackbar" role="img" aria-label="Répartition du budget">' + bar + "</div>" +
    '<ul class="blegend">' +
    '<li class="head"><span class="dot" style="background:var(--b-paid)"></span><span class="lab">Déjà payé</span><span class="val">' + fmtEur(paidSum) + "</span></li>" +
    '<li class="head"><span class="dot" style="background:var(--b-1)"></span><span class="lab">Reste à payer</span><span class="val">~' + fmtEur(resteTotal) + "</span></li>" +
    BUDGET.onsite.map(function (r) {
      return '<li><span class="dot" style="background:var(--' + r[3] + ')"></span><span class="lab">' + esc(r[0]) + " (sur place)</span><span class=\"val\">" + esc(r[1]) + "</span></li>";
    }).join("") +
    "</ul></div>";

  var accB = accOpen.budget || (accOpen.budget = {});
  var paidRows = "", restRows = "";
  BUDGET.fixed.forEach(function (r) {
    var row = '<li><span class="dot" style="background:var(--b-' + (paidState[r.id] ? "paid" : "1") + ')"></span>' +
      '<span class="lab">' + esc(r.t) + '</span><span class="val">' + (r.lab || fmtEur(r.v)) + "</span></li>";
    if (paidState[r.id]) paidRows += row; else restRows += row;
  });
  BUDGET.onsite.forEach(function (r) {
    restRows += '<li><span class="dot" style="background:var(--' + r[3] + ')"></span>' +
      '<span class="lab">' + esc(r[0]) + ' (sur place)</span><span class="val">' + esc(r[1]) + "</span></li>";
  });
  html += '<details class="card acc" data-bacc="paid"' + (accB.paid ? " open" : "") + ">" +
    "<summary>✅ Déjà payé — le détail<span class=\"cnt\">" + fmtEur(paidSum) + "</span></summary>" +
    '<div class="acc-body"><ul class="blegend">' + (paidRows || "<li><span class=\"lab\">Rien pour l'instant.</span></li>") + "</ul></div></details>";
  html += '<details class="card acc" data-bacc="rest"' + (accB.rest ? " open" : "") + ">" +
    "<summary>⏳ Reste à payer — le détail<span class=\"cnt\">~" + fmtEur(resteTotal) + "</span></summary>" +
    '<div class="acc-body"><ul class="blegend">' + restRows + "</ul>" +
    '<p style="font-size:12.5px; margin-top:8px">Coche un poste dans le suivi ci-dessous dès qu\'il est réglé : il bascule automatiquement dans « Déjà payé ».</p></div></details>';

  html += '<div class="card"><h3>🧾 Suivi des paiements — coche quand c\'est réglé</h3><ul class="blegend">' +
    BUDGET.fixed.map(function (r) {
      var on = paidState[r.id];
      return '<li><input type="checkbox" class="paychk" data-pay="' + r.id + '"' + (on ? " checked" : "") +
        ' aria-label="Payé : ' + esc(r.t).replace(/"/g, "&quot;") + '">' +
        '<span class="lab"' + (on ? ' style="text-decoration:line-through; opacity:.6"' : "") + ">" + esc(r.t) + "</span>" +
        '<span class="val">' + (r.lab || fmtEur(r.v)) + "</span></li>";
    }).join("") + "</ul></div>";

  html += '<div class="tipcard">⚠️ <b>Le seul poste qui peut faire déraper : l\'hôtel.</b> À 300 € les 3 nuits, le total fait ~3 493 € — la cible tient tout juste. À 600 €, on file à 3 813 €. Viser ≤ 330 €.</div>';
  html += '<div class="tipcard">🚗 L\'Uber Memphis ↔ Oxford (180–230 € A/R) mange les deux tiers des 300 € de transport. Une navette ou une location peut libérer 50–100 €.</div>';
  scr.innerHTML = html;

  scr.querySelectorAll("[data-pay]").forEach(function (box) {
    box.addEventListener("change", function () {
      if (box.checked) paidState[box.dataset.pay] = 1; else delete paidState[box.dataset.pay];
      store.set("chi26:paid", paidState);
      if (box.checked) burst(["💸", "✅", "💰"]);
      renderBudget();
    });
  });

  var addBtn = document.getElementById("spAdd");
  var amtIn = document.getElementById("spAmt");
  var txtIn = document.getElementById("spTxt");
  function addSpend() {
    var a = parseFloat(String(amtIn.value).replace(",", "."));
    if (!a || a <= 0) { amtIn.focus(); return; }
    DB.spend.push({ d: todayChicago(), a: a, t: txtIn.value.trim() });
    saveDB();
    renderBudget();
  }
  if (addBtn) {
    addBtn.addEventListener("click", addSpend);
    txtIn.addEventListener("keydown", function (e) { if (e.key === "Enter") addSpend(); });
  }
  scr.querySelectorAll("[data-del]").forEach(function (b) {
    b.addEventListener("click", function () {
      DB.spend.splice(+b.dataset.del, 1);
      saveDB();
      renderBudget();
    });
  });
  scr.querySelectorAll("[data-bacc]").forEach(function (d) {
    d.addEventListener("toggle", function () {
      if (d.open) accOpen.budget[d.dataset.bacc] = 1; else delete accOpen.budget[d.dataset.bacc];
    });
  });
}

function renderGuide(scrId, groups, dbKey, titleHtml, tip, verb) {

  groups.forEach(function (g, gi) {
    g.items.forEach(function (_, ii) { total++; if (state["g" + gi + "-" + ii]) ok++; });
  });
  var html = titleHtml +
    '<div class="tipcard"><b>' + ok + " / " + total + "</b> " + verb + (ok > 1 ? "s" : "") + ". " + tip + "</div>";

    g.items.forEach(function (_, ii) { if (state["g" + gi + "-" + ii]) gOk++; });

      "<summary>" + g.e + " " + esc(g.t) +
      '<span class="cnt">' + gOk + " / " + g.items.length + "</span></summary>" +
      '<div class="acc-body">';
    g.items.forEach(function (it, ii) {
      var uid = "g" + gi + "-" + ii;
      html += '<label class="item' + (state[uid] ? " done" : "") + '" style="--cat: var(--c-' + g.c + '); box-shadow:none; margin-bottom:8px;">' +
        '<input type="checkbox" class="chk" data-guide="' + uid + '"' + (state[uid] ? " checked" : "") +
        ' aria-label="' + esc(it[0]).replace(/"/g, "&quot;") + '">' +
        '<span class="body"><span class="t">' + esc(it[0]) + "</span>" +
        (it[1] ? '<div class="n">' + esc(it[1]) + "</div>" : "") + "</span>" +
        (it[2] ? '<span class="price">' + esc(it[2]) + "</span>" : "") + "</label>";
    });
    html += "</div></details>";
  });
  scr.innerHTML = html;
  scr.querySelectorAll("details.acc").forEach(function (d) {
    d.addEventListener("toggle", function () {
      if (d.open) opened[d.dataset.gi] = 1; else delete opened[d.dataset.gi];
    });
  });
  scr.querySelectorAll("[data-guide]").forEach(function (box) {
    box.addEventListener("change", function () {
      if (box.checked) state[box.dataset.guide] = 1; else delete state[box.dataset.guide];
      saveDB();
      if (box.checked) {
        var left = 0;
        groups.forEach(function (g, gi) {
          g.items.forEach(function (_, ii) { if (!state["g" + gi + "-" + ii]) left++; });
        });
        if (left === 0) burst(["🎉", "⭐", "🎊"]);
      }
      renderGuide(scrId, groups, dbKey, titleHtml, tip, verb);
    });
  });
}

/* ---------- écran Infos ---------- */
function exportSave() {
  var data = JSON.stringify(DB);
  var doClipboard = function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(function () {
        alert("Sauvegarde copiée 📋 Colle-la dans une note pour la garder.");
      }, function () { window.prompt("Copie ce code de sauvegarde :", data); });
    } else {
      window.prompt("Copie ce code de sauvegarde :", data);
    }
  };
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (dl) {
      if (!dl) { doClipboard(); return; }
      dl.save({ filename: "chicago-sauvegarde.json", data: data }).catch(function (e) {
        if (!e || e.code !== "declined") doClipboard();
      });
    }, doClipboard);
  } else {
    doClipboard();
  }
}

function importSave() {
  var raw = window.prompt("Colle ici ta sauvegarde (le contenu du fichier .json ou le code copié) :");
  if (!raw) return;
  try {
    var obj = JSON.parse(raw.trim());
    if (typeof obj !== "object" || !obj) throw 0;
    ["done", "prep", "pass", "pack", "food", "shop", "notes"].forEach(function (k) {
      if (obj[k] && typeof obj[k] === "object" && !Array.isArray(obj[k])) DB[k] = obj[k];
    });
    if (Array.isArray(obj.spend)) DB.spend = obj.spend;
    if (obj.paid && typeof obj.paid === "object") DB.paid = obj.paid;
    if (obj.theme) { DB.theme = obj.theme; root.setAttribute("data-theme", obj.theme); }
    relink();
    saveDB();
    rerenderAll();
    alert("Sauvegarde restaurée ✅");
  } catch (e) {
    alert("Ce code n'est pas une sauvegarde valide.");
  }
}

function resetAll() {
  if (!window.confirm("Tout effacer sur cet appareil ? (coches, notes, dépenses)")) return;
  DB.done = {}; DB.prep = {}; DB.pass = {}; DB.pack = {};
  DB.food = {}; DB.shop = {}; DB.notes = {}; DB.spend = [];
  DB.paid = {};
  BUDGET.fixed.forEach(function (r) { if (r.def) DB.paid[r.id] = 1; });
  relink();
  saveDB();
  rerenderAll();
}

function rerenderAll() {
  renderHome();
  renderPlan();
  renderPack();
  renderFood();
  renderShop();
  renderPass();
  renderBudget();
  renderInfos();
  refreshRing();
}

/* ============================================================
   INTERACTIONS COMMUNES
   ============================================================ */
function refreshRing() {
  var n = 0;
  DAYS.forEach(function (day) { n += dayDoneCount(day); });
  var pct = Math.round(n / totalItems * 100);
  document.getElementById("ringFg").style.strokeDashoffset = (100.5 * (1 - n / totalItems)).toFixed(1);
  document.getElementById("ringTxt").textContent = pct + "%";
}

function burst(emojis) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var box = document.getElementById("confettiBox");
  for (var i = 0; i < 14; i++) {
    var s = document.createElement("span");
    s.className = "confetti";
    s.textContent = emojis[i % emojis.length];
    s.style.left = (5 + Math.random() * 90) + "%";
    s.style.animationDelay = (Math.random() * .35) + "s";
    s.style.fontSize = (16 + Math.random() * 14) + "px";
    box.appendChild(s);
    setTimeout(function (el) { return function () { el.remove(); }; }(s), 2200);
  }
}

function bindChecks(scope) {
  scope.querySelectorAll(".chk[data-uid]").forEach(function (box) {
    box.addEventListener("change", function () {
      var uid = box.dataset.uid;
      if (box.checked) done[uid] = 1; else delete done[uid];
      store.set("chi26:done", done);
      box.closest(".item").classList.toggle("done", box.checked);
      refreshRing();
      var day = DAYS[+box.dataset.day - 1];
      if (box.checked && dayDoneCount(day) === day.items.length) {
        burst([day.e, "🎉", "⭐", "🎊"]);
      }
      var pill = scope.querySelector(".done-pill");
      if (pill && day.d === curDay || (pill && scope.id === "scr-home")) {
        var dn = dayDoneCount(day);
        pill.textContent = dn + " / " + day.items.length + " coché" + (dn > 1 ? "s" : "");
      }
    });
  });
}

/* ---------- onglets ---------- */
var renderers = { home: renderHome, plan: renderPlan, pack: renderPack, miam: renderFood, shop: renderShop, pass: renderPass, budget: renderBudget, infos: renderInfos };
document.querySelectorAll(".tab").forEach(function (tab) {
  tab.addEventListener("click", function () {
    document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("on", t === tab); });
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("on"); });
    var id = tab.dataset.scr;
    document.getElementById("scr-" + id).classList.add("on");
    renderers[id]();
    window.scrollTo({ top: 0 });
  });
});

/* ---------- démarrage ---------- */
var t0 = todayChicago();
var d0 = DAYS.find(function (d) { return d.date === t0; });
if (d0) curDay = d0.d;
renderHome();
renderPlan();
renderPack();
renderFood();
renderShop();
renderPass();
renderBudget();
renderInfos();
refreshRing();
})();
</script>
