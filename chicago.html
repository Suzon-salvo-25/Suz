/* ---------- écran Budget ---------- */
function fmtEur(n) { return n.toLocaleString("fr-FR") + " €"; }

function effPrice(r) {
  return DB.prices[r.id] != null ? +DB.prices[r.id] : r.v;
}
function effLabel(r) {
  return DB.prices[r.id] != null ? fmtEur(+DB.prices[r.id]) : (r.lab || fmtEur(r.v));
}

function renderBudget() {
  var scr = document.getElementById("scr-budget");
  var paidSum = 0, restFixed = 0;
  BUDGET.fixed.forEach(function (r) {
    if (paidState[r.id]) paidSum += effPrice(r); else restFixed += effPrice(r);
  });
  var onsiteSum = BUDGET.onsite.reduce(function (a, r) { return a + r[2]; }, 0);
  var resteTotal = restFixed + onsiteSum;

  var tMin = onsiteSum, tMax = onsiteSum;
  BUDGET.fixed.forEach(function (r) {
    if (DB.prices[r.id] != null) { tMin += +DB.prices[r.id]; tMax += +DB.prices[r.id]; }
    else if (r.id === "hot") { tMin += 300; tMax += 600; }
    else if (r.id === "sim") { tMin += 20; tMax += 40; }
    else { tMin += r.v; tMax += r.v; }
  });
  var totalTxt = tMin === tMax
    ? fmtEur(tMin)
    : tMin.toLocaleString("fr-FR") + " – " + tMax.toLocaleString("fr-FR") + " €";

  var segs = [
    ["Déjà payé", paidSum, "var(--b-paid)"],
    ["Réservations restantes", restFixed, "var(--b-1)"]
  ].concat(BUDGET.onsite.map(function (r) {
    return [r[0], r[2], "var(--" + r[3] + ")"];
  })).filter(function (s) { return s[1] > 0; });
  var grand = segs.reduce(function (a, s) { return a + s[1]; }, 0);
  var bar = segs.map(function (s) {
    return '<span style="width:' + (s[1] / grand * 100).toFixed(1) + "%; background:" + s[2] + '" title="' + esc(s[0]) + '"></span>';
  }).join("");

  var spent = DB.spend.reduce(function (a, e) { return a + (+e.a || 0); }, 0);
  var envelope = 954; /* activités 304 + nourriture 350 + transports 300 */
  var pct = Math.min(100, spent / envelope * 100);
  var spendRows = DB.spend.slice().reverse().map(function (e, ri) {
    var i = DB.spend.length - 1 - ri;
    var dayObj = null;
    DAYS.forEach(function (d) { if (d.date === e.d) dayObj = d; });
    var lbl = dayObj ? "J" + dayObj.d : (e.d || "").slice(5);
    return '<li><span class="sd">' + esc(lbl) + '</span><span class="st">' + esc(e.t || "—") +
      '</span><span class="sa">' + (+e.a).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " €" +
      '</span><button class="sx" type="button" data-del="' + i + '" aria-label="Supprimer">✕</button></li>';
  }).join("");

  var html = '<h2 class="screen-title"><span>💰</span>Budget</h2>' +

    '<div class="card"><h3>💸 Carnet de dépenses — ' +
    spent.toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " € dépensés</h3>" +
    '<div class="spend-form">' +
    '<input type="number" inputmode="decimal" min="0" step="0.5" id="spAmt" placeholder="12,50">' +
    '<input type="text" id="spTxt" placeholder="ex : deep dish Pequod\'s" maxlength="60">' +
    '<button class="btn" id="spAdd" type="button" style="margin:0">＋</button></div>' +
    '<div class="gauge' + (spent > envelope ? " over" : "") + '"><span style="width:' + pct.toFixed(1) + '%"></span></div>' +
    '<p style="font-size:12.5px">' +
    (spent > envelope
      ? "Enveloppe « sur place » de 954 € dépassée de " + Math.round(spent - envelope) + " € — à compenser sur l'hôtel ou le shopping."
      : "Reste " + Math.round(envelope - spent) + " € sur l'enveloppe « sur place » (activités + nourriture + transports : 954 €).") +
    "</p>" +
    (spendRows ? '<ul class="spend-list">' + spendRows + "</ul>" : '<p style="font-size:12.5px">Saisis chaque dépense en 2 secondes — le total se compare tout seul au budget.</p>') +
    "</div>" +

    '<div class="card money-hero">' +
    '<div class="lbl">TOTAL ESTIMÉ DU VOYAGE</div>' +
    '<div class="total">' + totalTxt + "</div>" +
    '<div class="lbl">cible : ~3 500 € hors shopping · les prix corrigés recalculent tout</div>' +
    '<div class="stackbar" role="img" aria-label="Répartition du budget">' + bar + "</div>" +
    '<ul class="blegend">' +
    '<li class="head"><span class="dot" style="background:var(--b-paid)"></span><span class="lab">Déjà payé</span><span class="val">' + fmtEur(paidSum) + "</span></li>" +
    '<li class="head"><span class="dot" style="background:var(--b-1)"></span><span class="lab">Reste à payer</span><span class="val">~' + fmtEur(resteTotal) + "</span></li>" +
    BUDGET.onsite.map(function (r) {
      return '<li><span class="dot" style="background:var(--' + r[3] + ')"></span><span class="lab">' + esc(r[0]) + " (sur place)</span><span class=\"val\">" + esc(r[1]) + "</span></li>";
    }).join("") +
    "</ul></div>";

  var accB = accOpen.budget || (accOpen.budget = {});
  var paidRows = "", restRows = "";
  BUDGET.fixed.forEach(function (r) {
    var row = '<li><span class="dot" style="background:var(--b-' + (paidState[r.id] ? "paid" : "1") + ')"></span>' +
      '<span class="lab">' + esc(r.t) + '</span><span class="val">' + effLabel(r) + "</span></li>";
    if (paidState[r.id]) paidRows += row; else restRows += row;
  });
  BUDGET.onsite.forEach(function (r) {
    restRows += '<li><span class="dot" style="background:var(--' + r[3] + ')"></span>' +
      '<span class="lab">' + esc(r[0]) + ' (sur place)</span><span class="val">' + esc(r[1]) + "</span></li>";
  });
  html += '<details class="card acc" data-bacc="paid"' + (accB.paid ? " open" : "") + ">" +
    "<summary>✅ Déjà payé — le détail<span class=\"cnt\">" + fmtEur(paidSum) + "</span></summary>" +
    '<div class="acc-body"><ul class="blegend">' + (paidRows || "<li><span class=\"lab\">Rien pour l'instant.</span></li>") + "</ul></div></details>";
  html += '<details class="card acc" data-bacc="rest"' + (accB.rest ? " open" : "") + ">" +
    "<summary>⏳ Reste à payer — le détail<span class=\"cnt\">~" + fmtEur(resteTotal) + "</span></summary>" +
    '<div class="acc-body"><ul class="blegend">' + restRows + "</ul>" +
    '<p style="font-size:12.5px; margin-top:8px">Coche un poste dans le suivi ci-dessous dès qu\'il est réglé : il bascule automatiquement dans « Déjà payé ».</p></div></details>';

  html += '<div class="card"><h3>🧾 Suivi des paiements</h3>' +
    '<p style="font-size:12.5px; margin-bottom:8px">Coche quand c\'est réglé · touche un prix ✏️ pour saisir ce que tu as vraiment payé (vide + ✓ = retour à l\'estimation).</p><ul class="blegend">' +
    BUDGET.fixed.map(function (r) {
      var on = paidState[r.id];
      var edited = DB.prices[r.id] != null;
      if (editingPay === r.id) {
        var cur = edited ? DB.prices[r.id] : r.v;
        return '<li><span class="lab">' + esc(r.t) + "</span>" +
          '<input class="pin" type="number" inputmode="decimal" step="0.01" min="0" id="pinInput" value="' + cur + '" aria-label="Prix payé en euros">' +
          '<button class="mini" type="button" data-pok="1" aria-label="Valider le prix">✓</button>' +
          '<button class="mini cancel" type="button" data-pcancel="1" aria-label="Annuler">✕</button></li>';
      }
      return '<li><input type="checkbox" class="paychk" data-pay="' + r.id + '"' + (on ? " checked" : "") +
        ' aria-label="Payé : ' + esc(r.t).replace(/"/g, "&quot;") + '">' +
        '<span class="lab"' + (on ? ' style="text-decoration:line-through; opacity:.6"' : "") + ">" + esc(r.t) + "</span>" +
        '<button class="val pedit' + (edited ? " edited" : "") + '" type="button" data-edit="' + r.id +
        '" aria-label="Corriger le prix de ' + esc(r.t).replace(/"/g, "&quot;") + '">' + effLabel(r) + " ✏️</button></li>";
    }).join("") + "</ul></div>";

  html += '<div class="tipcard">⚠️ <b>Le seul poste qui peut faire déraper : l\'hôtel.</b> À 300 € les 3 nuits, le total fait ~3 493 € — la cible tient tout juste. À 600 €, on file à 3 813 €. Viser ≤ 330 €.</div>';
  html += '<div class="tipcard">🚗 Bon plan transfert : la navette Groome Memphis ↔ Oxford coûte ~50 $ le trajet au lieu des 90–115 € d\'Uber budgétés — ça peut libérer 100–150 € sur les 300 € de transport. Lien dans l\'onglet Infos.</div>';
  scr.innerHTML = html;

  scr.querySelectorAll("[data-pay]").forEach(function (box) {
    box.addEventListener("change", function () {
      if (box.checked) paidState[box.dataset.pay] = 1; else delete paidState[box.dataset.pay];
      store.set("chi26:paid", paidState);
      if (box.checked) burst(["💸", "✅", "💰"]);
      renderBudget();
    });
  });

  var addBtn = document.getElementById("spAdd");
  var amtIn = document.getElementById("spAmt");
  var txtIn = document.getElementById("spTxt");
  function addSpend() {
    var a = parseFloat(String(amtIn.value).replace(",", "."));
    if (!a || a <= 0) { amtIn.focus(); return; }
    DB.spend.push({ d: todayChicago(), a: a, t: txtIn.value.trim() });
    saveDB();
    renderBudget();
  }
  if (addBtn) {
    addBtn.addEventListener("click", addSpend);
    txtIn.addEventListener("keydown", function (e) { if (e.key === "Enter") addSpend(); });
  }
  scr.querySelectorAll("[data-del]").forEach(function (b) {
    b.addEventListener("click", function () {
      DB.spend.splice(+b.dataset.del, 1);
      saveDB();
      renderBudget();
    });
  });
  scr.querySelectorAll("[data-bacc]").forEach(function (d) {
    d.addEventListener("toggle", function () {
      if (d.open) accOpen.budget[d.dataset.bacc] = 1; else delete accOpen.budget[d.dataset.bacc];
    });
  });
  scr.querySelectorAll("[data-edit]").forEach(function (b) {
    b.addEventListener("click", function () {
      editingPay = b.dataset.edit;
      renderBudget();
      var inp = document.getElementById("pinInput");
      if (inp) { inp.focus(); if (inp.select) inp.select(); }
    });
  });
  var pok = scr.querySelector("[data-pok]");
  if (pok) pok.addEventListener("click", commitPrice);
  var pcan = scr.querySelector("[data-pcancel]");
  if (pcan) pcan.addEventListener("click", function () { editingPay = null; renderBudget(); });
  var pinInp = document.getElementById("pinInput");
  if (pinInp) pinInp.addEventListener("keydown", function (e) { if (e.key === "Enter") commitPrice(); });
}

var editingPay = null;

function commitPrice() {
  var inp = document.getElementById("pinInput");
  if (!inp || editingPay == null) return;
  var raw = String(inp.value).trim().replace(",", ".").replace(/[€\s]/g, "");
  if (raw === "") {
    delete DB.prices[editingPay];
    toast("Prix remis à l'estimation");
  } else {
    var val = parseFloat(raw);
    if (isNaN(val) || val < 0) { toast("Montant invalide"); return; }
    DB.prices[editingPay] = Math.round(val * 100) / 100;
    toast("Prix enregistré ✓");
  }
  editingPay = null;
  saveDB();
  renderBudget();
}

function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.classList.remove("show"); }, 2400);
}

/* ---------- écrans guides (Miam / Boutiques / Valise), en accordéons ---------- */
var accOpen = {};
var editingGuide = null;

function guideItems(dbKey, g, gi) {
  var out = [];
  g.items.forEach(function (it, ii) {
    var uid = "g" + gi + "-" + ii;
    if (!DB.ghide[dbKey + ":" + uid]) out.push({ it: it, uid: uid });
  });
  (DB.gadd[dbKey + ":" + gi] || []).forEach(function (it, ii) {
    var uid = "c" + gi + "-" + ii;
    if (!DB.ghide[dbKey + ":" + uid]) out.push({ it: it, uid: uid, custom: true });
  });
  return out;
}

var editingStamp = null;

function stampNow() {
  var d = new Date();
  var mo = ["janv", "févr", "mars", "avril", "mai", "juin", "juil", "août", "sept", "oct", "nov", "déc"];
  var mn = d.getMinutes();
  return d.getDate() + " " + mo[d.getMonth()] + " · " + d.getHours() + "h" + (mn < 10 ? "0" : "") + mn;
}

function renderGuide(scrId, groups, dbKey, titleHtml, tip, verb, opts) {
  opts = opts || {};
  var scr = document.getElementById(scrId);
  var state = DB[dbKey];
  var opened = accOpen[scrId] || (accOpen[scrId] = {});
  var total = 0, ok = 0;
  groups.forEach(function (g, gi) {
    guideItems(dbKey, g, gi).forEach(function (en) { total++; if (state[en.uid]) ok++; });
  });
  var html = titleHtml +
    '<div class="tipcard"><b>' + ok + " / " + total + "</b> " + verb + (ok > 1 ? "s" : "") + ". " + tip + "</div>";
  groups.forEach(function (g, gi) {
    var ens = guideItems(dbKey, g, gi);
    var gOk = 0;
    ens.forEach(function (en) { if (state[en.uid]) gOk++; });
    html += '<details class="card acc" data-gi="' + gi + '"' + (opened[gi] ? " open" : "") + ">" +
      "<summary>" + g.e + " " + esc(g.t) +
      '<span class="cnt">' + gOk + " / " + ens.length + "</span></summary>" +
      '<div class="acc-body">';
    ens.forEach(function (en) {
      var it = en.it, uid = en.uid;
      var stampHtml = "";
      if (opts.stamp && state[uid]) {
        var at = state[uid] && state[uid].at;
        if (editingStamp === dbKey + ":" + uid) {
          stampHtml = '<input class="rs-in" type="text" data-rsin="' + uid + '" placeholder="ex : 19 août · 14h30" value="' +
            esc(at || "").replace(/"/g, "&quot;") + '">';
        } else if (at) {
          stampHtml = '<button class="rsat" type="button" data-rstamp="' + uid + '">📌 Réservé le ' + esc(at) + ' <i>✎</i></button>';
        } else {
          stampHtml = '<button class="rsat" type="button" data-rstamp="' + uid + '">📌 Noter quand tu as réservé ✎</button>';
        }
      }
      html += '<label class="item' + (state[uid] ? " done" : "") + '" style="--cat: var(--c-' + g.c + '); box-shadow:none; margin-bottom:8px;">' +
        '<input type="checkbox" class="chk" data-guide="' + uid + '"' + (state[uid] ? " checked" : "") +
        ' aria-label="' + esc(it[0]).replace(/"/g, "&quot;") + '">' +
        '<span class="body"><span class="t">' + esc(it[0]) + (en.custom ? ' <span class="modif">ajouté</span>' : "") + "</span>" +
        (it[1] ? '<div class="n">' + esc(it[1]) + "</div>" : "") +
        (it[3] ? '<a class="lnk" href="' + it[3] + '" target="_blank" rel="noopener">Réserver ↗</a>' : "") +
        stampHtml + "</span>" +
        (it[2] ? '<span class="price">' + esc(it[2]) + "</span>" : "") +
        '<button class="gdel" type="button" data-gdel="' + uid + '" aria-label="Retirer ' + esc(it[0]).replace(/"/g, "&quot;") + '">✕</button>' +
        "</label>";
    });
    if (editingGuide === scrId + ":" + gi) {
      html += '<div class="ef" data-gform="' + gi + '" style="margin-bottom:8px">' +
        '<input class="gf-t" type="text" placeholder="Nom (resto, boutique, objet…)">' +
        '<input class="gf-n" type="text" placeholder="Note — adresse, pourquoi, combien…">' +
        '<div class="ef-row"><select class="gf-p"><option value="">Prix ?</option><option>€</option><option>€€</option><option>€€€</option></select>' +
        '<button class="btn" type="button" data-gfsave="' + gi + '" style="margin:0">✓ Ajouter</button></div>' +
        '<button class="btn" type="button" data-gfcancel="1">✕ Annuler</button></div>';
    } else {
      html += '<button class="btn" type="button" data-gadd="' + gi + '">＋ Ajouter ici</button>';
    }
    html += "</div></details>";
  });
  var hid = 0;
  Object.keys(DB.ghide).forEach(function (k) { if (k.indexOf(dbKey + ":") === 0) hid++; });
  if (hid) html += '<button class="btn" type="button" data-gunhide="1">↩︎ Réafficher ' + hid + " retiré" + (hid > 1 ? "s" : "") + "</button>";
  scr.innerHTML = html;

  function rerender() { renderGuide(scrId, groups, dbKey, titleHtml, tip, verb); }

  scr.querySelectorAll("details.acc").forEach(function (d) {
    d.addEventListener("toggle", function () {
      if (d.open) opened[d.dataset.gi] = 1; else delete opened[d.dataset.gi];
    });
  });
  scr.querySelectorAll("[data-guide]").forEach(function (box) {
    box.addEventListener("change", function () {
      if (box.checked) state[box.dataset.guide] = opts.stamp ? { at: stampNow() } : 1;
      else delete state[box.dataset.guide];
      saveDB();
      if (box.checked) {
        var left = 0;
        groups.forEach(function (g, gi) {
          guideItems(dbKey, g, gi).forEach(function (en) { if (!state[en.uid]) left++; });
        });
        if (left === 0) burst(["🎉", "⭐", "🎊"]);
      }
      rerender();
    });
  });
  scr.querySelectorAll("[data-gdel]").forEach(function (b) {
    b.addEventListener("click", function (e) {
      e.preventDefault();
      DB.ghide[dbKey + ":" + b.dataset.gdel] = 1;
      saveDB();
      rerender();
      toast("Retiré — « Réafficher » tout en bas pour annuler");
    });
  });
  scr.querySelectorAll("[data-rstamp]").forEach(function (b) {

      toast("Ajouté ➕");
    });
    gform.querySelector("[data-gfcancel]").addEventListener("click", function () {
      editingGuide = null;
      rerender();
    });
  }
  var unhide = scr.querySelector("[data-gunhide]");
  if (unhide) unhide.addEventListener("click", function () {
    Object.keys(DB.ghide).forEach(function (k) {
      if (k.indexOf(dbKey + ":") === 0) delete DB.ghide[k];
    });
    saveDB();
    rerender();
    toast("Tout est réaffiché ↩︎");
  });

function renderWalk() {
  var scr = document.getElementById("scr-walk");
  var total = 0, best = null, filled = 0, maxKm = 0;
  DAYS.forEach(function (day) {
    var v = +DB.walk[day.date] || 0;
    if (v > 0) { total += v; filled++; }
    if (v > maxKm) { maxKm = v; best = day; }
  });
  var frKm = function (v) { return (Math.round(v * 10) / 10).toString().replace(".", ","); };
  var steps = Math.round(total * 1350);
  var html = '<h2 class="screen-title"><span>👟</span>Kilomètres à pied</h2>' +
    '<div class="card" style="text-align:center">' +

    '<div class="n" style="color:var(--ink-faint); font-size:13px; margin-top:4px">' +
    (filled
      ? "≈ " + steps.toLocaleString("fr-FR") + " pas · moyenne " + frKm(total / filled) + " km/jour marché" +
        (best ? " · record : J" + best.d + " (" + frKm(maxKm) + " km)" : "")
      : "Note tes km chaque soir — le compteur fait le reste.") + "</div>" +
    (total > 0
      ? '<div class="n" style="font-size:12.5px; margin-top:8px">🏙️ ' + Math.round(total / 0.442) + " Willis Tower couchées · " +
        frKm(total / 42.195) + " marathon" + (total / 42.195 >= 2 ? "s" : "") + "</div>"
      : "") +
    "</div><div class='card'>";
  DAYS.forEach(function (day) {
    var v = DB.walk[day.date];
    var pct = maxKm > 0 && v ? Math.max(6, Math.round((+v / maxKm) * 100)) : 0;
    html += '<div class="wrow">' +
      '<span class="wl">' + day.e + " J" + day.d + "<small>" + day.dow + " " + esc(day.lab) + "</small></span>" +
      '<span class="wbar"><i style="width:' + pct + '%"></i></span>' +
      '<input type="number" inputmode="decimal" min="0" max="99" step="0.1" placeholder="km" data-wd="' + day.date + '" value="' + (v != null ? v : "") + '">' +
      "</div>";
  });
  html += "</div>" +
    '<div class="tipcard">💡 Ton téléphone compte déjà tes pas (app Santé sur iPhone) : recopie le chiffre du soir ici pour garder la trace du voyage.</div>';

    inp.addEventListener("change", function () {

function exportSave() {
  var data = JSON.stringify(DB);
  var doClipboard = function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(function () {
        toast("Sauvegarde copiée 📋 — colle-la dans une note");
      }, function () {
        showImpBox(data);
        toast("Copie le texte affiché et garde-le");
      });
    } else {
      showImpBox(data);
      toast("Copie le texte affiché et garde-le");
    }
  };
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (dl) {
      if (!dl) { doClipboard(); return; }
      dl.save({ filename: "chicago-sauvegarde.json", data: data }).then(function () {
        toast("Fichier de sauvegarde proposé ⬇️");
      }, function (e) {
        if (!e || e.code !== "declined") doClipboard();
      });
    }, doClipboard);
  } else {
    doClipboard();
  }
}

function importSave(raw) {
  if (!raw || !raw.trim()) { toast("Colle d'abord ta sauvegarde dans la zone"); return; }
  try {
    var obj = JSON.parse(raw.trim());
    if (typeof obj !== "object" || !obj) throw 0;
    ["done", "prep", "pass", "pack", "food", "shop", "notes", "prices", "edits", "hidden", "added", "gadd", "ghide"].forEach(function (k) {
      if (obj[k] && typeof obj[k] === "object" && !Array.isArray(obj[k])) DB[k] = obj[k];
    });
    if (Array.isArray(obj.spend)) DB.spend = obj.spend;
    if (obj.paid && typeof obj.paid === "object") DB.paid = obj.paid;
    if (obj.theme) { DB.theme = obj.theme; root.setAttribute("data-theme", obj.theme); }
    relink();
    saveDB();
    rerenderAll();
    toast("Sauvegarde restaurée ✅");
  } catch (e) {
    toast("Ce texte n'est pas une sauvegarde valide");
  }
}

function refreshRing() {
  var pc = progressCounts();
  var ratio = pc.total ? pc.ok / pc.total : 0;
  document.getElementById("ringFg").style.strokeDashoffset = (100.5 * (1 - ratio)).toFixed(1);
  document.getElementById("ringTxt").textContent = Math.round(ratio * 100) + "%";
}

function burst(emojis) {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var box = document.getElementById("confettiBox");
  for (var i = 0; i < 14; i++) {
    var s = document.createElement("span");
    s.className = "confetti";
    s.textContent = emojis[i % emojis.length];
    s.style.left = (5 + Math.random() * 90) + "%";
    s.style.animationDelay = (Math.random() * .35) + "s";
    s.style.fontSize = (16 + Math.random() * 14) + "px";
    box.appendChild(s);
    setTimeout(function (el) { return function () { el.remove(); }; }(s), 2200);
  }
}

function bindChecks(scope) {
  scope.querySelectorAll(".chk[data-uid]").forEach(function (box) {
    box.addEventListener("change", function () {
      var uid = box.dataset.uid;
      if (box.checked) done[uid] = 1; else delete done[uid];
      store.set("chi26:done", done);
      box.closest(".item").classList.toggle("done", box.checked);
      refreshRing();
      var day = DAYS[+box.dataset.day - 1];
      if (box.checked && dayDoneCount(day) === dayItems(day).length) {
        burst([day.e, "🎉", "⭐", "🎊"]);
      }
      var pcAll = progressCounts();
      if (box.checked && pcAll.ok === pcAll.total) {
        burst(["🏆", "🎆", "🌆"]);
        burst(["🎉", "⭐", "🎊"]);
        toast("🏆 100 % du voyage coché — chapeau !");
      }
      var pill = scope.querySelector(".done-pill");
      if (pill && day.d === curDay || (pill && scope.id === "scr-home")) {
        var dn = dayDoneCount(day);
        pill.textContent = dn + " / " + dayItems(day).length + " coché" + (dn > 1 ? "s" : "");
      }
    });
  });
}

  q = q.trim().toLowerCase();
  searchHits = [];
  if (q.length < 2) return "";
  DAYS.forEach(function (day) {
    dayItems(day).forEach(function (en) {
      if ((en.it.t + " " + (en.it.n || "")).toLowerCase().indexOf(q) !== -1)
        searchHits.push({ e: day.e, l: en.it.t, w: "📅 Jour " + day.d + " · " + day.dow + " " + day.lab, go: ["plan", day.d] });
    });
  });
  FOOD.forEach(function (g, gi) {
    guideItems("food", g, gi).forEach(function (en) {
      if ((en.it[0] + " " + (en.it[1] || "")).toLowerCase().indexOf(q) !== -1)
        searchHits.push({ e: g.e, l: en.it[0], w: "🍕 Miam · " + g.t, go: ["miam", gi] });
    });
  });
  SHOP.forEach(function (g, gi) {
    guideItems("shop", g, gi).forEach(function (en) {
      if ((en.it[0] + " " + (en.it[1] || "")).toLowerCase().indexOf(q) !== -1)
        searchHits.push({ e: g.e, l: en.it[0], w: "🛍️ Shops · " + g.t, go: ["shop", gi] });
    });
  });
  PACK.forEach(function (g, gi) {
    guideItems("pack", g, gi).forEach(function (en) {
      if ((en.it[0] + " " + (en.it[1] || "")).toLowerCase().indexOf(q) !== -1)
        searchHits.push({ e: g.e, l: en.it[0], w: "🧳 Valise · " + g.t, go: ["pack", gi] });
    });
  });
  RESA.forEach(function (g, gi) {
    guideItems("resa", g, gi).forEach(function (en) {
      if ((en.it[0] + " " + (en.it[1] || "")).toLowerCase().indexOf(q) !== -1)
        searchHits.push({ e: g.e, l: en.it[0], w: "🎟️ Résas · " + g.t, go: ["resa", gi] });
    });
  });
  STORY.forEach(function (st, i) {
    if ((st.t + " " + st.x).toLowerCase().indexOf(q) !== -1)
      searchHits.push({ e: st.e, l: st.t, w: "🕰️ Histoire", go: ["story", i] });
  });
  searchHits = searchHits.slice(0, 30);
  if (!searchHits.length) return '<div class="tipcard">Rien trouvé pour « ' + esc(q) + " »</div>";
  return searchHits.map(function (r, i) {
    return '<button class="resrow" type="button" data-ri="' + i + '">' +
      '<span class="rw">' + esc(r.w) + '</span><span class="rl">' + r.e + " " + esc(r.l) + "</span></button>";
  }).join("");
}

/* ---------- carte-souvenir ---------- */
function makeSouvenir() {
  var c = document.createElement("canvas");
  c.width = 1080; c.height = 1350;
  var x = c.getContext("2d");
  var g = x.createLinearGradient(0, 0, 0, 1350);
  g.addColorStop(0, "#1e1b4b"); g.addColorStop(.55, "#7c2d82"); g.addColorStop(1, "#f06e3c");
  x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
  x.fillStyle = "#ffcd5a";
  x.beginPath(); x.arc(820, 640, 105, 0, 7); x.fill();
  x.fillStyle = "#100e28";
  var B = [[30, 165, 900], [200, 120, 780], [340, 175, 860], [540, 130, 700], [690, 150, 830], [860, 150, 740], [1020, 60, 880]];
  B.forEach(function (b) { x.fillRect(b[0], b[2], b[1], 1350 - b[2]); });
  x.fillRect(590, 620, 14, 80);
  x.fillStyle = "rgba(255,214,120,.85)";
  B.forEach(function (b, bi) {
    for (var wy = b[2] + 28; wy < 1300; wy += 46)
      for (var wx = b[0] + 16; wx < b[0] + b[1] - 16; wx += 40)
        if ((wx * 7 + wy * 13 + bi) % 17 < 6) x.fillRect(wx, wy, 14, 20);
  });
  x.fillStyle = "#fff";
  x.textAlign = "center";
  x.font = "900 96px -apple-system, system-ui, sans-serif";
  x.fillText("CHICAGO", 540, 150);
  x.font = "800 40px -apple-system, system-ui, sans-serif";
  x.fillText("& OLE MISS · 29 AOÛT → 11 SEPT 2026", 540, 215);
  var pc = progressCounts();
  var spent = DB.spend.reduce(function (a, e) { return a + (+e.a || 0); }, 0);
  var lines = [
    "✅  " + pc.ok + " / " + pc.total + " activités",
    "🎫  " + Object.keys(passUsed).length + " / 5 CityPASS",
    "🍕  " + Object.keys(DB.food).length + " adresses goûtées",
    "🛍️  " + Object.keys(DB.shop).length + " boutiques",
    "💸  " + Math.round(spent) + " € sur place",
    "🚶  ~200 km à pied"
  ];
  x.fillStyle = "rgba(16,14,40,.5)";
  x.fillRect(130, 270, 820, 640);
  x.fillStyle = "#fff";
  x.textAlign = "left";
  x.font = "700 54px -apple-system, system-ui, sans-serif";
  lines.forEach(function (l, i) { x.fillText(l, 200, 380 + i * 98); });
  x.textAlign = "center";
  x.font = "700 34px -apple-system, system-ui, sans-serif";
  x.fillText("14 jours · 3 villes · 1 malédiction de chèvre évitée", 540, 1315);
  return c;
}

function showSouvenir() {
  var c = makeSouvenir();
  document.getElementById("souvenirImg").src = c.toDataURL("image/png");
  document.getElementById("imgOvl").hidden = false;
  if (window.claude && window.claude.use && c.toBlob) {
    c.toBlob(function (blob) {
      if (!blob) return;
      window.claude.use("downloads").then(function (dl) {
        if (dl) dl.save({ filename: "chicago-souvenir.png", data: blob }).catch(function () {});
      }, function () {});
    });
  }
}

/* ---------- planning imprimable (.txt) ---------- */
function planText() {
  var out = "CHICAGO & OLE MISS — 29 août → 11 septembre 2026\n";
  out += "================================================\n\n";
  DAYS.forEach(function (day) {
    out += "JOUR " + day.d + " — " + day.dow + " " + day.lab + " · " + day.title + "\n";
    if (day.tip) out += "  💡 " + day.tip + "\n";
    dayItems(day).forEach(function (en) {
      out += "  [" + (done[en.uid] ? "x" : " ") + "] " + (en.it.h || "—") + " · " + en.it.t + (en.it.pr ? " (" + en.it.pr + ")" : "") + "\n";
      if (en.it.n) out += "      " + en.it.n + "\n";
    });
    var note = DB.notes["d" + day.d];
    if (note) out += "  📓 " + note + "\n";
    out += "\n";
  });
  return out;
}

function exportPlanTxt() {
  var data = planText();
  function fallback() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(function () {
        toast("Planning copié 📋 — colle-le dans Notes et imprime");
      }, function () { toast("Impossible ici — utilise Exporter"); });
    } else toast("Impossible ici — utilise Exporter");
  }
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (dl) {
      if (!dl) { fallback(); return; }
      dl.save({ filename: "planning-chicago.txt", data: data }).then(function () {
        toast("Planning téléchargé 🖨️");
      }, function (e) { if (!e || e.code !== "declined") fallback(); });
    }, fallback);
  } else fallback();
}

/* ---------- liaisons statiques : recherche, souvenir, swipe ---------- */
document.getElementById("searchBtn").addEventListener("click", function () {
  document.getElementById("searchOvl").hidden = false;
  var inp = document.getElementById("searchIn");
  inp.focus();
  inp.select();
});
document.getElementById("searchClose").addEventListener("click", function () {
  document.getElementById("searchOvl").hidden = true;
});
document.getElementById("searchIn").addEventListener("input", function () {
  document.getElementById("searchRes").innerHTML = doSearch(this.value);
});
document.getElementById("searchRes").addEventListener("click", function (e) {
  var b = e.target.closest ? e.target.closest("[data-ri]") : null;
  if (!b) return;
  var r = searchHits[+b.dataset.ri];
  if (!r) return;
  document.getElementById("searchOvl").hidden = true;
  if (r.go[0] === "plan") { curDay = r.go[1]; planView = "day"; }
  else if (r.go[0] === "story") { (accOpen.story = accOpen.story || {})[r.go[1]] = 1; }
  else { (accOpen["scr-" + r.go[0]] = accOpen["scr-" + r.go[0]] || {})[r.go[1]] = 1; }
  switchTab(r.go[0]);
});
document.getElementById("imgClose").addEventListener("click", function () {
  document.getElementById("imgOvl").hidden = true;
});

(function () {
  var sx = 0, sy = 0;
  var scr = document.getElementById("scr-plan");
  scr.addEventListener("touchstart", function (e) {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  scr.addEventListener("touchend", function (e) {
    if (planView === "all" || editItem || justDragged) return;
    var t = e.target;
    if (t.closest && (t.closest(".daypick") || t.closest("textarea") || t.closest("input") || t.closest(".ef") || t.closest(".filters"))) return;
    var dx = e.changedTouches[0].clientX - sx;
    var dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 50) {
      if (planView === "time" && tlMode === "week") {
        var nw = dx < 0 ? 1 : 0;
        if (nw !== tlWeek) { tlWeek = nw; renderPlan(); }
        return;
      }
      var next = Math.min(DAYS.length, Math.max(1, curDay + (dx < 0 ? 1 : -1)));
      if (next !== curDay) { curDay = next; renderPlan(); }
    }
  }, { passive: true });
})();

/* ---------- démarrage ---------- */
var t0 = todayChicago();
var d0 = DAYS.find(function (d) { return d.date === t0; });
if (d0) curDay = d0.d;
/* reprise après un rechargement de sauvegarde en ligne : on revient
   exactement où on était (onglet, jour, vue, accordéons, scroll) */
var resumeTab = null;
try {
  var rs = sessionStorage.getItem("chi26:resume");
  if (rs) {
    sessionStorage.removeItem("chi26:resume");
    rs = JSON.parse(rs);
    if (rs.day >= 1 && rs.day <= DAYS.length) curDay = rs.day;
    if (rs.pv) planView = rs.pv;
    if (rs.tm) tlMode = rs.tm;
    if (rs.tw === 0 || rs.tw === 1) tlWeek = rs.tw;
    if (rs.acc && typeof rs.acc === "object") accOpen = rs.acc;
    if (rs.tab && document.getElementById("scr-" + rs.tab)) resumeTab = rs.tab;
    if (rs.sy) setTimeout(function () { window.scrollTo(0, rs.sy); }, 80);
  }
} catch (e) {}
renderHome();
renderPlan();
renderPack();
renderFood();
renderShop();
renderStory();
renderPass();
renderResa();
renderWalk();
renderBudget();
renderInfos();
refreshRing();
if (resumeTab) switchTab(resumeTab);
appReady = true;
})();
</script>
